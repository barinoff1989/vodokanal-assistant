<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;Electron\&quot; agent=\&quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) draw.io/29.0.3 Chrome/140.0.7339.249 Electron/38.7.0 Safari/537.36\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;c4l2\&quot; name=\&quot;C4 Level 2\&quot;&gt;&lt;mxGraphModel dx=\&quot;1469\&quot; dy=\&quot;873\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;2400\&quot; pageHeight=\&quot;1650\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot; /&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot; /&gt;&lt;mxCell id=\&quot;title\&quot; value=\&quot;&amp;lt;b&amp;gt;C4 Level 2 — Контейнеры: «AI-помощник абонента водоканала»&amp;lt;/b&amp;gt;\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=middle;whiteSpace=wrap;fontSize=18;fontColor=#1A237E;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;10\&quot; width=\&quot;900\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note\&quot; value=\&quot;&amp;lt;i&amp;gt;⚠ Нумерация рёбер одна на два этапа, визуального различия нет. Шаги 1–3 (поиск контекста, промпт, генерация) — Этап 1, активны уже на прототипе и MVP. Шаги 4–7c (делегирование Agent Orchestrator, заполнение/запись после подтверждения) — Этап 2, целевые: Agent Orchestrator, Document Generator, Billing Adapter, Сервис работы с обращениями на MVP не разворачиваются (C4_Deployment.html). На прототипе шаги 4–7c не выполняются — регистрация обращений идёт путём другим (app/backend/registration.py — InquiryServiceAdapter, минуя Orchestrator).&amp;lt;/i&amp;gt;\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=top;whiteSpace=wrap;fontSize=9;fontColor=#C0392B;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;700\&quot; y=\&quot;40\&quot; width=\&quot;1520\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;person\&quot; value=\&quot;&amp;lt;b&amp;gt;Абонент&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Персона]&amp;lt;br&amp;gt;Клиент водоканала. Работает в существующем ЛК\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#1F4E79;strokeColor=#163A5A;fontColor=#FFFFFF;fontSize=12;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;60\&quot; width=\&quot;260\&quot; height=\&quot;100\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;boundary\&quot; value=\&quot;Граница программной системы «AI-помощник абонента водоканала» (контейнеры, Этап 1 + Этап 2)\&quot; style=\&quot;rounded=1;arcSize=4;whiteSpace=wrap;html=1;fillColor=#F5F7FA;strokeColor=#90A4AE;fillOpacity=40;align=left;verticalAlign=top;spacingTop=8;spacingLeft=12;fontSize=12;fontStyle=1;fontColor=#546E7A;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;210\&quot; width=\&quot;1760\&quot; height=\&quot;1150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;widget\&quot; value=\&quot;&amp;lt;b&amp;gt;AI-виджет в ЛК&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: React/TS, Node.js]&amp;lt;br&amp;gt;Чат-UI, SSE-рендер, suggested_actions, формы подтверждения\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#4A90D9;strokeColor=#2E6DA4;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;260\&quot; width=\&quot;300\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;session\&quot; value=\&quot;&amp;lt;b&amp;gt;Session State Store&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Redis / PostgreSQL]&amp;lt;br&amp;gt;Этап 1: сессия диалога, аудит, счётчики квот. Этап 2: состояние FSM обращения, слоты, аудит-лог подтверждений и операций\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#4A90D9;strokeColor=#2E6DA4;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;460\&quot; y=\&quot;260\&quot; width=\&quot;280\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;quota\&quot; value=\&quot;&amp;lt;b&amp;gt;Quota Store&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Redis]&amp;lt;br&amp;gt;Счётчики лимитов на абонента, сессию и сервис (slowapi + Redis). Отдельно от Session State Store\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#4A90D9;strokeColor=#2E6DA4;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;900\&quot; y=\&quot;260\&quot; width=\&quot;260\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;click\&quot; value=\&quot;&amp;lt;b&amp;gt;Postgres (telemetry)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[БД телеметрии]&amp;lt;br&amp;gt;Телеметрия AI-сервиса: токены, стоимость, latency, quality_report Guardrails. Источник данных для дашборда\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#4A90D9;strokeColor=#2E6DA4;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1240\&quot; y=\&quot;260\&quot; width=\&quot;280\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;gw\&quot; value=\&quot;&amp;lt;b&amp;gt;API Gateway / Backend&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Go / Python/FastAPI]&amp;lt;br&amp;gt;Единая точка входа: оркестрация, сессия, Retrieval (эмбеддинг → поиск → реранкинг), маршрутизация на Agent Orchestrator, интеграция с ЛК\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#4A90D9;strokeColor=#2E6DA4;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;480\&quot; width=\&quot;300\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;orch\&quot; value=\&quot;&amp;lt;b&amp;gt;Agent Orchestrator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Python, Этап 2]&amp;lt;br&amp;gt;FSM жизненного цикла обращения, классификация (inquiry_type), tool-calling, HITL-гейты, аудит\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#4A90D9;strokeColor=#2E6DA4;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;620\&quot; y=\&quot;480\&quot; width=\&quot;300\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;llm\&quot; value=\&quot;&amp;lt;b&amp;gt;LLM Gateway&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Python / LiteLLM]&amp;lt;br&amp;gt;Абстракция над моделями (routing / fallback / retry / circuit breaker), SSE.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Security Layer&amp;lt;/b&amp;gt; (внутри контейнера): PII Sanitizer (Presidio + кастомные распознаватели: ФИО, СНИЛС, ИНН, лицевой счёт, телефон, email — обезличивание до LLM Provider); Guardrails на пути ответа (sync &amp;amp;lt; 50 мс: PII / токсичность / policy → обрыв потока + safe fallback; async: groundedness / faithfulness, не блокирует стрим).&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Quota Manager:&amp;lt;/b&amp;gt; лимиты на абонента + сессию + глобальный лимит сервиса, 429 + Retry-After\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#4A90D9;strokeColor=#2E6DA4;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1120\&quot; y=\&quot;460\&quot; width=\&quot;440\&quot; height=\&quot;230\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;vdb\&quot; value=\&quot;&amp;lt;b&amp;gt;Vector Database&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Qdrant]&amp;lt;br&amp;gt;Эмбеддинги, семантический поиск, payload-фильтр inquiry_type\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#4A90D9;strokeColor=#2E6DA4;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;760\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;docgen\&quot; value=\&quot;&amp;lt;b&amp;gt;Document Generator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Python, Этап 2]&amp;lt;br&amp;gt;Заполнение шаблонов обращений, рендер PDF/HTML, валидация полей\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#4A90D9;strokeColor=#2E6DA4;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;480\&quot; y=\&quot;760\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ba\&quot; value=\&quot;&amp;lt;b&amp;gt;Billing Adapter&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Go/Python, Этап 2]&amp;lt;br&amp;gt;Write-операции в Биллинг через его внешний XML-RPC API, HITL-подтверждение + Idempotency-Key. Собственного SQL-клиента к БД Биллинга не имеет\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#4A90D9;strokeColor=#2E6DA4;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;840\&quot; y=\&quot;760\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;isvc\&quot; value=\&quot;&amp;lt;b&amp;gt;Сервис работы с обращениями&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Go/Python, Этап 2]&amp;lt;br&amp;gt;Регистрация обращения абонента в микросервисе обращений после подтверждения (HITL), присвоение и отслеживание статусов заявки, идемпотентность\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#4A90D9;strokeColor=#2E6DA4;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1200\&quot; y=\&quot;760\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;etl\&quot; value=\&quot;&amp;lt;b&amp;gt;ETL Worker&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Python, GPU]&amp;lt;br&amp;gt;Индексация RAG: парсинг → чанки → эмбеддинг → upsert, теги inquiry_type\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#4A90D9;strokeColor=#2E6DA4;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;1000\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;emb\&quot; value=\&quot;&amp;lt;b&amp;gt;Embedding Inference&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: TEI/vLLM, GPU]&amp;lt;br&amp;gt;Модель эмбеддингов: батч-эмбеддинг чанков для ETL и эмбеддинг запросов для Backend\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#D99C00;strokeColor=#A67C00;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;520\&quot; y=\&quot;1000\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rerank\&quot; value=\&quot;&amp;lt;b&amp;gt;Reranker Inference [НОВЫЙ]&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: TEI, GPU]&amp;lt;br&amp;gt;Кросс-энкодер BGE-reranker-v2-m3: offline-отбор представительных чанков (ETL) и онлайн-reranking top_k=20 → top_n=3 (Backend)\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#D99C00;strokeColor=#A67C00;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;900\&quot; y=\&quot;1000\&quot; width=\&quot;320\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;llmprov\&quot; value=\&quot;&amp;lt;b&amp;gt;LLM Provider&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;GigaChat / YandexGPT / self-hosted\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#9E9E9E;strokeColor=#757575;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1900\&quot; y=\&quot;480\&quot; width=\&quot;320\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;micro\&quot; value=\&quot;&amp;lt;b&amp;gt;Микросервис обращений&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;Единая точка регистрации обращений абонентов (поверка, подключение, приём документов). Из него обращения читают подрядчики и пайплайн дообучения модели\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#9E9E9E;strokeColor=#757575;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1900\&quot; y=\&quot;700\&quot; width=\&quot;320\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;billing\&quot; value=\&quot;&amp;lt;b&amp;gt;Биллинг&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя legacy-система]&amp;lt;br&amp;gt;Данные абонента, показания, начисления, задолженность, данные о поверке. Доступ — только через собственный внешний XML-RPC API системы\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#9E9E9E;strokeColor=#757575;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1900\&quot; y=\&quot;920\&quot; width=\&quot;320\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;dispatch\&quot; value=\&quot;&amp;lt;b&amp;gt;Диспетчерская система&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;Аварийные заявки, near real-time. Этап 1 — чтение данных по авариям для ответа абоненту. Этап 2 — передача аварийной заявки после подтверждения (HITL)\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#9E9E9E;strokeColor=#757575;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1900\&quot; y=\&quot;1140\&quot; width=\&quot;320\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;kb\&quot; value=\&quot;&amp;lt;b&amp;gt;База знаний (файловое хранилище)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;Регламенты и инструкции (Word), реестр договоров (файлы по типу обращения), типовые формы / устав / оферта (Word/PDF), публичный FAQ / сайт и соцсети водоканала\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#9E9E9E;strokeColor=#757575;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;1400\&quot; width=\&quot;340\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e1\&quot; value=\&quot;Диалог, подтверждение действий&amp;lt;br&amp;gt;[HTTPS]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#666666;fontColor=#333333;fontSize=9;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;person\&quot; target=\&quot;widget\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;120\&quot; as=\&quot;offset\&quot; /&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;230\&quot; y=\&quot;210\&quot; /&gt;&lt;mxPoint x=\&quot;250\&quot; y=\&quot;210\&quot; /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e2\&quot; value=\&quot;Вопросы, данные обращений / SSE,&amp;lt;br&amp;gt;suggested_actions [HTTPS / JSON]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#666666;fontColor=#333333;fontSize=9;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;widget\&quot; target=\&quot;gw\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;-90\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e3\&quot; value=\&quot;Сессия диалога, аудит, квоты (Этап 1)&amp;lt;br&amp;gt;[Redis protocol / SQL]\&quot; style=\&quot;edgeStyle=orthogonalEdgeSt
