<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;toolbar&quot;: &quot;pages zoom layers lightbox&quot;, &quot;page&quot;: 0, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;app.diagrams.net\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;data-architecture-training\&quot; name=\&quot;Архитектура данных — Обучение / индексация (офлайн)\&quot;&gt;\n    &lt;mxGraphModel dx=\&quot;1212\&quot; dy=\&quot;736\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;2700\&quot; pageHeight=\&quot;1240\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;\n      &lt;root&gt;\n        &lt;mxCell id=\&quot;0\&quot; /&gt;\n        &lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot; /&gt;\n\n        &lt;mxCell id=\&quot;title\&quot; value=\&quot;Архитектура данных — Обучение / индексация (офлайн-контур)\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=20;fontStyle=1;fontColor=#1A1A1A;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;40\&quot; y=\&quot;15\&quot; width=\&quot;2000\&quot; height=\&quot;36\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;legend\&quot; value=\&quot;&amp;lt;b&amp;gt;Легенда&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font color=&#x27;#707070&#x27;&amp;gt;━━&amp;lt;/font&amp;gt; основной поток данных&amp;lt;br&amp;gt;&amp;lt;font color=&#x27;#707070&#x27;&amp;gt;┅┅&amp;lt;/font&amp;gt; снимок для оценки / отложенный поток&amp;lt;br&amp;gt;&amp;lt;font color=&#x27;#C0392B&#x27;&amp;gt;━━&amp;lt;/font&amp;gt; данные с ПДн (до обезличивания)&amp;lt;br&amp;gt;&amp;lt;font color=&#x27;#2E7D5B&#x27;&amp;gt;━━&amp;lt;/font&amp;gt; обезличенные данные и метрики&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Цвета блоков:&amp;lt;/b&amp;gt; синий — наш компонент; серый — чужая система; жёлтый — хранилище; розовый — контур ПДн; светло-синий — Этап 2&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Режимы:&amp;lt;/b&amp;gt; 〈BATCH〉 — пакет по расписанию; 〈STREAM〉 — событие в реальном времени&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Этапы:&amp;lt;/b&amp;gt; MVP — без пометки; Этап 3 — серый пунктир\&quot; style=\&quot;shape=note;whiteSpace=wrap;html=1;size=14;fillColor=#FFF7DC;strokeColor=#C7B26B;fontSize=11;fontColor=#3E3410;align=left;verticalAlign=top;whiteSpace=wrap;spacingLeft=8;spacingTop=6;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;2400\&quot; y=\&quot;50\&quot; width=\&quot;290\&quot; height=\&quot;175\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n\n        &lt;mxCell id=\&quot;row1lbl\&quot; value=\&quot;1. ИНДЕКСАЦИЯ БАЗЫ ЗНАНИЙ — данные становятся доступны модели через поиск\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=13;fontStyle=1;fontColor=#707070;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;40\&quot; y=\&quot;58\&quot; width=\&quot;800\&quot; height=\&quot;24\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n\n        &lt;mxCell id=\&quot;s1\&quot; value=\&quot;&amp;lt;b&amp;gt;Документные источники&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешние системы · &amp;lt;font color=&amp;quot;#3C7FC0&amp;quot;&amp;gt;〈BATCH〉&amp;lt;/font&amp;gt;]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Инструкции по биллингу (Word); инструкции по общению с абонентом (Word); реестр договоров ВС/ВО (файлы по типу обращения); публичный FAQ и сайт/соцсети водоканала&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;40\&quot; y=\&quot;90\&quot; width=\&quot;270\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;n1\&quot; value=\&quot;&amp;lt;b&amp;gt;ETL Worker — Ingest&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер, существующий · &amp;lt;font color=&amp;quot;#FFE699&amp;quot;&amp;gt;〈BATCH〉&amp;lt;/font&amp;gt;]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Планировщик Celery Beat, курсор last_modified — периодический опрос документных источников: инструмент выбран под редкие, некритичные по задержке обновления&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;420\&quot; y=\&quot;90\&quot; width=\&quot;250\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;d1\&quot; value=\&quot;&amp;lt;b&amp;gt;Data Lake — Raw Zone&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Хранилище: S3 / MinIO]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;〔предложение〕 та же технология, что уже применяется для резервного копирования системы — хранит необработанные документы до трансформации&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#D79B00;strokeColor=#B57E00;fontColor=#FFFFFF;fontSize=12;strokeWidth=2;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;810\&quot; y=\&quot;90\&quot; width=\&quot;220\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n\n        &lt;mxCell id=\&quot;cbox\&quot; value=\&quot;ГДЕ ОЧИСТКА\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FBF0DC;strokeColor=#B57E00;strokeWidth=1.6;dashed=1;verticalAlign=top;align=left;fontSize=12;fontStyle=1;fontColor=#8A5A00;spacingLeft=12;spacingTop=8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;1080\&quot; y=\&quot;40\&quot; width=\&quot;440\&quot; height=\&quot;490\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;c1\&quot; value=\&quot;&amp;lt;b&amp;gt;Document Reader + Metadata Enricher&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Парсинг HTML/PDF/DOCX; классификация типа обращения: правила, а когда они молчат — запасной k-NN по эмбеддингам&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;1110\&quot; y=\&quot;80\&quot; width=\&quot;380\&quot; height=\&quot;100\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;c2\&quot; value=\&quot;&amp;lt;b&amp;gt;Text Splitter&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Чанки около 800 токенов; границы по заголовкам документа, не разрывают предложения&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;1110\&quot; y=\&quot;200\&quot; width=\&quot;380\&quot; height=\&quot;80\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;c3\&quot; value=\&quot;&amp;lt;b&amp;gt;Quality &amp;amp;amp; Dedup Filter&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Отсев малоинформативных фрагментов; поиск почти-дублей (MinHash/SimHash); оценка качества каждого чанка&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;1110\&quot; y=\&quot;300\&quot; width=\&quot;380\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n\n        &lt;mxCell id=\&quot;ebox\&quot; value=\&quot;ГДЕ ЭМБЕДДИНГИ\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#E4F0E5;strokeColor=#3C7FC0;strokeWidth=1.6;dashed=1;verticalAlign=top;align=left;fontSize=12;fontStyle=1;fontColor=#2E7D5B;spacingLeft=12;spacingTop=8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;1550\&quot; y=\&quot;40\&quot; width=\&quot;400\&quot; height=\&quot;490\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;e1n\&quot; value=\&quot;&amp;lt;b&amp;gt;Offline Reranker Client&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[〈BATCH〉]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Кросс-энкодер BGE-reranker-v2-m3 отбирает представительный чанк внутри кластера почти-дублей.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;〔ОТКРЫТО〕&amp;lt;/b&amp;gt; Модель обучена на паре «запрос ↔ документ», а здесь запроса нет — возможно, дешевле закрыть уже посчитанным quality_score или центроидным сходством&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;1110\&quot; y=\&quot;410\&quot; width=\&quot;380\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;e2n\&quot; value=\&quot;&amp;lt;b&amp;gt;Embedding Client — документы&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[&amp;lt;font color=&amp;quot;#FFE699&amp;quot;&amp;gt;〈BATCH〉&amp;lt;/font&amp;gt;, GPU]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Тяжёлые прогоны — только в окне 02:00–05:00.&amp;lt;/b&amp;gt; Батчи по 32–64 чанка → GPU-инференс эмбеддингов (модель BGE-M3): пакетная обработка даёт пропускную способность, задержка одного документа не критична&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;strokeWidth=2;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;1570\&quot; y=\&quot;225\&quot; width=\&quot;340\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n\n        &lt;mxCell id=\&quot;v1\&quot; value=\&quot;&amp;lt;b&amp;gt;Vector DB — Qdrant&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Хранилище]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;HNSW (m=16, ef=128); upsert новых векторов. Удалённые документы уходят при полной пересборке: коллекция строится заново, и алиас переключается на неё атомарно (blue-green) — поиск не останавливается.&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;&amp;lt;b&amp;gt;→ здесь данные впервые становятся доступны модели: retrieval + LLM читают этот индекс при каждом ответе (см. схему онлайн-инференса)&amp;lt;/b&amp;gt;&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;strokeWidth=2;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;2040\&quot; y=\&quot;60\&quot; width=\&quot;280\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n\n        &lt;mxCell id=\&quot;row2lbl\&quot; value=\&quot;2. ПОСТРОЕНИЕ ПРОФИЛЯ АБОНЕНТА (Feature Store) — предотвращение Training-Serving Skew\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=13;fontStyle=1;fontColor=#707070;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;40\&quot; y=\&quot;580.0\&quot; width=\&quot;900\&quot; height=\&quot;24\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n\n        &lt;mxCell id=\&quot;s2\&quot; value=\&quot;&amp;lt;b&amp;gt;Биллинг + Диспетчерская&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешние системы · &amp;lt;font color=&amp;quot;#3C7FC0&amp;quot;&amp;gt;〈BATCH〉&amp;lt;/font&amp;gt; для этой ветки]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;БД Биллинга (Postgres): задолженность, показания приборов, дата поверки. Диспетчерская: статус аварийной заявки, зона&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;40\&quot; y=\&quot;610\&quot; width=\&quot;270\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;billing_access\&quot; value=\&quot;&amp;lt;b&amp;gt;Внешний XML-RPC API Биллинга&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[интерфейс системы-владельца]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Единственный способ доступа к Биллингу — прямого SQL нет. Тот же API используется и на онлайн-инференсе&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#D79B00;strokeColor=#B57E00;fontColor=#FFFFFF;fontSize=12;strokeWidth=3;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;440\&quot; y=\&quot;600\&quot; width=\&quot;290\&quot; height=\&quot;100\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;cronjob\&quot; value=\&quot;&amp;lt;b&amp;gt;K8s CronJob&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Оркестратор, принято · &amp;lt;font color=&amp;quot;#FFE699&amp;quot;&amp;gt;〈BATCH〉&amp;lt;/font&amp;gt;]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Периодическая материализация — тот же примитив, что уже используется для резервного копирования, без Airflow&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;940\&quot; y=\&quot;620\&quot; width=\&quot;230\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;v2\&quot; value=\&quot;&amp;lt;b&amp;gt;Кэш профиля абонента&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Хранилище: Postgres MV + Redis]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;НЕ формальный Feature Store (Feast/Tecton) — материализованная таблица плюс быстрый слой Redis поверх неё.&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Роль против Training-Serving Skew:&amp;lt;/b&amp;gt; эту же таблицу читает и офлайн-оценка (Data Scientist), и онлайн-инференс (Backend) — один код, одно определение признака, а не два независимо считающих места&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#D79B00;strokeColor=#B57E00;fontColor=#FFFFFF;fontSize=12;strokeWidth=3;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;1290\&quot; y=\&quot;590\&quot; width=\&quot;340\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;v3\&quot; value=\&quot;&amp;lt;b&amp;gt;ClickHouse&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Хранилище]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Аналитика токенов и стоимости LLM-запросов; метрики качества сервиса — доля ющий материал&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешние/внутренние источники · &amp;lt;font color=&amp;quot;#3C7FC0&amp;quot;&amp;gt;〈BATCH〉&amp;lt;/font&amp;gt;]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;История диалогов абонента с ботом (Session State Store); расшифровки звонков колл-центра; история письменных обращений (Микросервис обращений); курируемый эталонный датасет вопрос-ответ, который ведёт Data Scientist&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;40\&quot; y=\&quot;1000.0\&quot; width=\&quot;270\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;t3\&quot; value=\&quot;&amp;lt;b&amp;gt;PII Filter&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Существующий компонент]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Presidio и распознаватели СНИЛС/ИНН/лицевого счёта/телефона/email — тот же фильтр, что закрывает запросы к внешнему провайдеру LLM на инференсе&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F8CECC;strokeColor=#B85450;fontColor=#333333;fontSize=12;strokeWidth=2;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;450\&quot; y=\&quot;930.0\&quot; width=\&quot;270\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;t4\&quot; value=\&quot;&amp;lt;b&amp;gt;Курируемый корпус&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Хранилище: S3 / MinIO, версионируемый]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Обезличенные данные, готовые к дообучению.&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Граница этой схе ;\n        &lt;mxCell id=\&quot;ed18\&quot; value=\&quot;метрики качества\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;dashed=1;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;entryX=0;entryY=0.4;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;v3\&quot; target=\&quot;k2\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;\n\n      &lt;mxCell id=\&quot;n_adr3_exception\&quot; value=\&quot;&amp;lt;b&amp;gt;〔ОТКРЫТО〕 Как выгружаются история обращений и расшифровки колл-центра&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;История письменных обращений и расшифровки колл-центра принадлежат &amp;lt;b&amp;gt;чужим системам&amp;lt;/b&amp;gt;. Правило доступа запрещает прямое чтение чужих БД (только через API владельца), а способ выгрузки здесь не определён.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Допустимы только три варианта:&amp;lt;br&amp;gt;1. пакетный метод API системы-владельца;&amp;lt;br&amp;gt;2. выгрузка, которую владелец делает сам и кладёт в согласованное место;&amp;lt;br&amp;gt;3. чтение реплики, предоставленной владельцем явно и под его ответственность.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Пока вариант не выбран, порядок доступа к этим источникам остаётся неутверждённым.\&quot; style=\&quot;shape=note;whiteSpace=wrap;html=1;size=14;fillColor=#FBE6E1;strokeColor=#B33D26;fontSize=11;fontColor=#5A1A0D;align=left;verticalAlign=top;spacingLeft=8;spacingTop=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1170\&quot; y=\&quot;870.0\&quot; width=\&quot;360\&quot; height=\&quot;270\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_biometry\&quot; value=\&quot;&amp;lt;b&amp;gt;〔152-ФЗ, ст. 11〕 Расшифровки колл-центра — биометрия&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Голос квалифицируется как биометрические персональные данные. Для их обработки нужно &amp;lt;b&amp;gt;письменное согласие субъекта&amp;lt;/b&amp;gt;, а не просто правовое основание.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;PII Filter закрывает обезличивание, но &amp;lt;b&amp;gt;не заменяет согласие&amp;lt;/b&amp;gt;: если согласия нет, расшифровки колл-центра нельзя брать в корпус вообще, независимо от качества анонимизации.\&quot; style=\&quot;shape=note;whiteSpace=wrap;html=1;size=14;fillColor=#FBF0DC;strokeColor=#A66A12;fontSize=11;fontColor=#4A2F05;align=left;verticalAlign=top;spacingLeft=8;spacingTop=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1570\&quot; y=\&quot;870.0\&quot; width=\&quot;330\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;disp_api\&quot; value=\&quot;&amp;lt;b&amp;gt;Внешний REST API Диспетчерской&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[интерфейс системы-владельца]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Статус аварийной заявки и зона — только через API владельца&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#D79B00;strokeColor=#B57E00;fontColor=#FFFFFF;fontSize=12;strokeWidth=3;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;440\&quot; y=\&quot;720\&quot; width=\&quot;290\&quot; height=\&quot;100\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ed9\&quot; value=\&quot;данные Биллинга\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;strokeColor=#C0392B;exitX=1;exitY=0.3;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; edge=\&quot;1\&quot; source=\&quot;s2\&quot; target=\&quot;billing_access\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ed9b\&quot; value=\&quot;данные Диспетчерской\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html= rap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;240\&quot; y=\&quot;110\&quot; width=\&quot;160\&quot; height=\&quot;70\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;backend\&quot; value=\&quot;&amp;lt;b&amp;gt;Backend&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер · &amp;lt;font color=&amp;quot;#7A3EA1&amp;quot;&amp;gt;〈ONLINE〉&amp;lt;/font&amp;gt;]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Собирает данные из четырёх мест ниже, чтобы сформировать ответ на один вопрос абонента&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;strokeWidth=2;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;440\&quot; y=\&quot;100\&quot; width=\&quot;780\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n\n        \n        &lt;mxCell id=\&quot;mech1\&quot; value=\&quot;&amp;lt;b&amp;gt;Эмбеддинг запроса&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[GPU-сервис · &amp;lt;font color=&amp;quot;#7A3EA1&amp;quot;&amp;gt;〈ONLINE〉&amp;lt;/font&amp;gt;, один запрос]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Embedding Inference (модель BGE-M3) превращает текст вопроса в вектор, затем — семантический поиск&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;40\&quot; y=\&quot;270\&quot; width=\&quot;260\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;src1\&quot; value=\&quot;&amp;lt;b&amp;gt;Vector DB — Qdrant&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Построен заранее пакетной индексацией (BATCH, см. схему обучения); здесь — только чтение (ONLINE): база знаний — инструкции, реестр договоров, публичный сайт&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;40\&quot; y=\&quot;440\&quot; width=\&quot;260\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n\n        \n        &lt;mxCell id=\&quot;mech2\&quot; value=\&quot;&amp;lt;b&amp;gt;Прямое чтение&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[&amp;lt;font color=&amp;quot;#7A3EA1&amp;quot;&amp;gt;〈ONLINE〉&amp;lt;/font&amp;gt;, O(1) из Redis]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Redis + Postgres MV — уже посчитанный агрегат, без обращения к первичным системам&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;340\&quot; y=\&quot;270\&quot; width=\&quot;260\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;src2\&quot; value=\&quot;&amp;lt;b&amp;gt;Кэш профиля абонента&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Построен заранее пакетно (BATCH, K8s CronJob, см. схему обучения) из Биллинга и Диспетчерской — не формальный Feature Store.&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Против Training-Serving Skew:&amp;lt;/b&amp;gt; это та же таблица, что читает офлайн-оценка при обучении — единое определение признака для обеих сторон&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#D79B00;strokeColor=#B57E00;fontColor=#FFFFFF;fontSize=12;strokeWidth=3;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;340\&quot; y=\&quot;440\&quot; width=\&quot;260\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n\n        \n        &lt;mxCell id=\&quot;mech3\&quot; value=\&quot;&amp;lt;b&amp;gt;Внешние API систем&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[&amp;lt;font color=&amp;quot;#7A3EA1&amp;quot;&amp;gt;〈ONLINE〉&amp;lt;/font&amp;gt;, интерфейс системы-владельца]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;XML-RPC API Биллинга и REST API Диспетчерской — используются, только когда кэш может быть устаревшим: обходят BATCH-задержку кэша ради свежести. Прямого SQL в чужие БД нет&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#D79B00;strokeColor=#B57E00;fontColor=#FFFFFF;fontSize=12;strokeWidth=2;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;640\&quot; y=\&quot;270\&quot; width=\&quot;260\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;src3\&quot; value=\&quot;&amp;lt;b&amp;gt;Биллинг + Диспетчерская&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешние системы]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Задолженность, показания, статус аварийной заявки — в реальном времени, без промежуточного хранилища&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;640\&quot; y=\&quot;440\&quot; width=\&quot;260\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCe l=1;align=left;verticalAlign=middle;fontSize=20;fontStyle=1;fontColor=#1A1A1A;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;20\&quot; width=\&quot;1500\&quot; height=\&quot;34\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sub\&quot; value=\&quot;&amp;lt;font style=&amp;quot;font-size:12px;color:#4D4D4D;&amp;quot;&amp;gt;Третья дорожка потоков данных: куда уходят данные, порождённые системой. Обучение и инференс — страницы 1 и 2. Все пути записи проходят через подтверждение абонента (правило 4.7) и идут только через API систем-владельцев.&amp;lt;/font&amp;gt;\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=12;fontColor=#4D4D4D;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;56\&quot; width=\&quot;1500\&quot; height=\&quot;34\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;band1\&quot; value=\&quot;1. ПОРОЖДЕНИЕ И ПОДТВЕРЖДЕНИЕ — данные ещё внутри периметра\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=none;strokeColor=#B0BEC5;dashed=1;verticalAlign=top;align=left;spacingLeft=12;spacingTop=6;fontSize=13;fontStyle=1;fontColor=#546E7A;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;120\&quot; width=\&quot;1180\&quot; height=\&quot;300\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;band2\&quot; value=\&quot;2. ЗАПИСЬ ВО ВНЕШНИЕ СИСТЕМЫ — только через их API\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=none;strokeColor=#B0BEC5;dashed=1;verticalAlign=top;align=left;spacingLeft=12;spacingTop=6;fontSize=13;fontStyle=1;fontColor=#546E7A;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;450\&quot; width=\&quot;1180\&quot; height=\&quot;320\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;band3\&quot; value=\&q
