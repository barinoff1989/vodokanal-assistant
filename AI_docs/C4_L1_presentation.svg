<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6B7B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="800" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#16324F">AI-помощник абонента водоканала — контекст</text>

  <!-- edges -->
  <path d="M 288,220 L 288,416 L 560,416" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
  <rect x="300" y="300" width="110" height="22" fill="#FFFFFF"/>
  <text x="355" y="316" text-anchor="middle" font-size="13" fill="#333333">вопрос → ответ</text>

  <path d="M 215,220 L 215,360" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>

  <path d="M 1040,408 L 1140,408 L 1140,420 L 1240,420" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
  <rect x="1060" y="380" width="140" height="22" fill="#FFFFFF"/>
  <text x="1130" y="396" text-anchor="middle" font-size="13" fill="#333333">генерация ответа</text>

  <path d="M 632,520 L 632,590 L 245,590 L 245,660" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
  <path d="M 752,520 L 752,590 L 615,590 L 615,660" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
  <path d="M 848,520 L 848,590 L 985,590 L 985,660" stroke="#5A6B7B" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow1)"/>
  <path d="M 968,520 L 968,590 L 1355,590 L 1355,660" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>

  <!-- Абонент -->
  <rect x="80" y="130" width="260" height="90" rx="14" fill="#16324F" stroke="#0E2233" stroke-width="1.5"/>
  <text x="210" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Абонент водоканала</text>

  <!-- AI -->
  <rect x="560" y="360" width="480" height="160" rx="10" fill="#2F80C3" stroke="#1F5C8B" stroke-width="3"/>
  <text x="800" y="430" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">AI-помощник абонента</text>
  <text x="800" y="455" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">водоканала</text>
  <text x="800" y="482" text-anchor="middle" font-size="13" fill="#E8F0FA">отвечает на вопросы, помогает с</text>
  <text x="800" y="499" text-anchor="middle" font-size="13" fill="#E8F0FA">документами и заявками</text>

  <!-- Платформа ЛК -->
  <rect x="80" y="360" width="280" height="120" rx="10" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
  <text x="220" y="412" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Платформа ЛК</text>
  <text x="220" y="434" text-anchor="middle" font-size="12.5" fill="#F0F0F0">вход, профиль абонента</text>

  <!-- LLM Provider -->
  <rect x="1240" y="360" width="280" height="120" rx="10" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
  <text x="1380" y="412" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">LLM Provider</text>
  <text x="1380" y="434" text-anchor="middle" font-size="12.5" fill="#F0F0F0">GigaChat / YandexGPT —</text>
  <text x="1380" y="451" text-anchor="middle" font-size="12.5" fill="#F0F0F0">генерация ответа</text>

  <!-- База знаний -->
  <rect x="80" y="660" width="330" height="120" rx="10" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
  <text x="245" y="712" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">База знаний</text>
  <text x="245" y="734" text-anchor="middle" font-size="12.5" fill="#F0F0F0">регламенты, инструкции, FAQ</text>

  <!-- Биллинг -->
  <rect x="450" y="660" width="330" height="120" rx="10" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
  <text x="615" y="712" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Биллинг</text>
  <text x="615" y="734" text-anchor="middle" font-size="12.5" fill="#F0F0F0">лицевые счета, начисления,</text>
  <text x="615" y="751" text-anchor="middle" font-size="12.5" fill="#F0F0F0">показания</text>

  <!-- Обращения абонентов -->
  <rect x="820" y="660" width="330" height="120" rx="10" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
  <text x="985" y="712" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Обращения абонентов</text>
  <text x="985" y="734" text-anchor="middle" font-size="12.5" fill="#F0F0F0">регистрация заявок</text>

  <!-- Диспетчерская -->
  <rect x="1190" y="660" width="330" height="120" rx="10" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
  <text x="1355" y="712" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Диспетчерская</text>
  <text x="1355" y="734" text-anchor="middle" font-size="12.5" fill="#F0F0F0">аварийные заявки</text>

  <!-- Легенда -->
  <line x1="80" y1="812" x2="110" y2="812" stroke="#5A6B7B" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="118" y="817" font-size="13.5" fill="#333333">регистрация заявок — Этап 2, в разработке</text>
</svg>
