<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;Electron\&quot; agent=\&quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) draw.io/29.0.3 Chrome/140.0.7339.249 Electron/38.7.0 Safari/537.36\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;c4l3etl\&quot; name=\&quot;C4 Level 3 ETL Worker\&quot;&gt;&lt;mxGraphModel dx=\&quot;1028\&quot; dy=\&quot;611\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;2600\&quot; pageHeight=\&quot;1400\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot; /&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot; /&gt;&lt;mxCell id=\&quot;title\&quot; value=\&quot;&amp;lt;b&amp;gt;C4 Level 3 — Компонент ETL Worker&amp;lt;/b&amp;gt;\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=middle;whiteSpace=wrap;fontSize=20;fontColor=#16324F;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;20\&quot; width=\&quot;1200\&quot; height=\&quot;36\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;subtitle\&quot; value=\&quot;Пайплайн индексации RAG: опрос источников → сырые копии → чанкинг → дедупликация → офлайн-реранкинг → эмбеддинги → upsert в Qdrant. Нумерация шагов 1.1–9 сохранена; in-process связи без сети, GPU-вызовы — HTTP/gRPC.\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=top;whiteSpace=wrap;fontSize=11;fontColor=#5A6B7B;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;58\&quot; width=\&quot;1800\&quot; height=\&quot;30\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;kb\&quot; value=\&quot;&amp;lt;b&amp;gt;База знаний (файловое хранилище)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система на L2]&amp;lt;br&amp;gt;Регламенты и инструкции (Word), реестр договоров (файлы по типу обращения), типовые формы / устав / оферта (Word/PDF), публичный FAQ / сайт и соцсети водоканала\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#8A9BA8;strokeColor=#5F7182;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;140\&quot; y=\&quot;120\&quot; width=\&quot;420\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;boundary\&quot; value=\&quot;Контейнер: ETL Worker [Python / Celery Beat + воркеры, GPU-узел]\&quot; style=\&quot;rounded=1;arcSize=3;whiteSpace=wrap;html=1;fillColor=#F4F8FC;strokeColor=#5B8DB8;dashed=1;strokeWidth=2;align=left;verticalAlign=top;spacingTop=10;spacingLeft=14;fontSize=13;fontStyle=1;fontColor=#16324F;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;340\&quot; width=\&quot;1900\&quot; height=\&quot;960\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ingest\&quot; value=\&quot;&amp;lt;b&amp;gt;1. Ingest Pipeline&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Python, Celery/Dramatiq worker + Unstructured.io]&amp;lt;br&amp;gt;Единая фаза Ingest: триггер (Celery Beat, курсор last_modified), Document Reader (Unstructured: HTML/PDF/DOCX, очистка), Metadata Enricher (3-уровневый классификатор: regex → эмбеддинг → LLM-fallback через LLM Gateway). Выход: документы с тегами inquiry_type[], department, effective_date, source_title/url\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;160\&quot; y=\&quot;420\&quot; width=\&quot;420\&quot; height=\&quot;230\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;splitter\&quot; value=\&quot;&amp;lt;b&amp;gt;2. Text Splitter (чанкинг)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[RecursiveCharacterTextSplitter]&amp;lt;br&amp;gt;Чанки ~800 токенов, overlap 10–15%, границы heading-aware (## → ### → \\n\\n → предложение); chunk_id = hash(doc_id + heading_path + seq)\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;660\&quot; y=\&quot;420\&quot; width=\&quot;420\&quot; height=\&quot;230\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;dedup\&quot; value=\&quot;&amp;lt;b&amp;gt;3. Quality &amp;amp; Dedup Filter&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[MinHash/SimHash]&amp;lt;br&amp;gt;Отсев мусора/шаблонного текста; near-duplicate кластеры (Jaccard ≥ 0.9); quality_score в payload\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1160\&quot; y=\&quot;420\&quot; width=\&quot;420\&quot; height=\&quot;230\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rerankcl\&quot; value=\&quot;&amp;lt;b&amp;gt;4. Reranker Client (offline)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[BGE-reranker-v2-m3, cross-encoder]&amp;lt;br&amp;gt;Отбор представительных чанков из дубль-кластеров; rerank_score в payload. Та же модель — online в Backend (Retrieval)\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;660\&quot; y=\&quot;760\&quot; width=\&quot;420\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;vectorcl\&quot; value=\&quot;&amp;lt;b&amp;gt;6. Vector DB Client&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[qdrant-client, gRPC]&amp;lt;br&amp;gt;upsert (вектор + payload), tombstones по source_id; реиндекс: новая коллекция → переключение alias (без простоя поиска)\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1160\&quot; y=\&quot;760\&quot; width=\&quot;420\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;embcl\&quot; value=\&quot;&amp;lt;b&amp;gt;5. Embedding Client&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[BGE-M3 (осн.) / GigaChat Embeddings (fallback)]&amp;lt;br&amp;gt;Батчи 32–64, нормализация векторов (cosine); model_version в payload, retry/backoff при отказах GPU-инференса\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;660\&quot; y=\&quot;1060\&quot; width=\&quot;420\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;datalake\&quot; value=\&quot;&amp;lt;b&amp;gt;Data Lake — Raw Zone&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[S3 / MinIO]&amp;lt;br&amp;gt;Сырые копии документов «как есть» до трансформации. Паттерн ELT: реиндексация идёт из Data Lake, без повторного похода к источнику\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=14;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;160\&quot; y=\&quot;760\&quot; width=\&quot;380\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;syncstate\&quot; value=\&quot;&amp;lt;b&amp;gt;Sync State&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[PostgreSQL / Redis]&amp;lt;br&amp;gt;Курсоры источников, история запусков, контрольные суммы документов\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=14;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;160\&quot; y=\&quot;1060\&quot; width=\&quot;380\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rerankinf\&quot; value=\&quot;&amp;lt;b&amp;gt;Reranker Inference [GPU]&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment-сервис: TEI self-hosted]&amp;lt;br&amp;gt;BGE-reranker-v2-m3 (cross-encoder). Та же модель переиспользуется online в Backend/Retrieval\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#D99C00;strokeColor=#A67C00;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2100\&quot; y=\&quot;420\&quot; width=\&quot;440\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;vectordb\&quot; value=\&quot;&amp;lt;b&amp;gt;Vector Database&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Qdrant, контейнер L2]&amp;lt;br&amp;gt;HNSW m=16 / ef=128; payload-индексы: inquiry_type, department, effective_date\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=14;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2100\&quot; y=\&quot;760\&quot; width=\&quot;440\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;embinf\&quot; value=\&quot;&amp;lt;b&amp;gt;Embedding Inference [GPU]&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment-сервис: TEI/vLLM self-hosted]&amp;lt;br&amp;gt;BGE-M3 (осн., 1024-d) / GigaChat Embeddings API (fallback)\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#D99C00;strokeColor=#A67C00;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2100\&quot; y=\&quot;1060\&quot; width=\&quot;440\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note_f7\&quot; value=\&quot;&amp;lt;b&amp;gt;⚠ F7 (смежный P0):&amp;lt;/b&amp;gt; Embedding Inference и Reranker Inference — общие для пайплайна ETL и онлайн-ретривала Backend. Изоляция GPU (приоритетные окна обслуживания) — не решена; см. решение F7 на Deployment View.\&quot; style=\&quot;rounded=1;arcSize=6;whiteSpace=wrap;html=1;fillColor=#FDF6E7;strokeColor=#D9A400;fontColor=#7A5C00;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1620\&quot; y=\&quot;420\&quot; width=\&quot;360\&quot; height=\&quot;230\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;h1\&quot; value=\&quot;1.1 опрос изменений (курсор last_modified)&amp;lt;br&amp;gt;[Файловый доступ — как на L2]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.33;exitY=0;entryX=0.3;entryY=1;\&quot; parent=\&quot;1\&quot; source=\&quot;ingest\&quot; target=\&quot;kb\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;-100\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;h2\&quot; value=\&quot;1.3 получение контента документов&amp;lt;br&amp;gt;[Файловый доступ — как на L2]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.45;exitY=0;entryX=0.5;entryY=1;\&quot; parent=\&quot;1\&quot; source=\&quot;ingest\&quot; target=\&quot;kb\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;100\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;h3\&quot; value=\&quot;1.4 сохранение сырых копий&amp;lt;br&amp;gt;[S3 API]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.25;exitY=1;entryX=0.25;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;ingest\&quot; target=\&quot;datalake\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;-60\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;h4\&quot; value=\&quot;1.5 чтение при переиндексации&amp;lt;br&amp;gt;(без похода к источнику) [S3 API]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.45;exitY=0;entryX=0.45;entryY=1;\&quot; parent=\&quot;1\&quot; source=\&quot;datalake\&quot; target=\&quot;ingest\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;70\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;h5\&quot; value=\&quot;1.2 чтение/запись курсоров&amp;lt;br&amp;gt;[SQL/KV]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.7;exitY=1;entryX=0.75;entryY=1;\&quot; parent=\&quot;1\&quot; source=\&quot;ingest\&quot; target=\&quot;syncstate\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;150\&quot; y=\&quot;-300\&quot; as=\&quot;offset\&quot; /&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;454\&quot; y=\&quot;1000\&quot; /&gt;&lt;mxPoint x=\&quot;600\&quot; y=\&quot;1000\&quot; /&gt;&lt;mxPoint x=\&quot;600\&quot; y=\&quot;1240\&quot; /&gt;&lt;mxPoint x=\&quot;445\&quot; y=\&quot;1240\&quot; /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;h6\&quot; value=\&quot;2. Документы с метаданными → чанкинг&amp;lt;br&amp;gt;[in-process]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;ingest\&quot; target=\&quot;splitter\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint y=\&quot;-145\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;h7\&quot; value=\&quot;3. Чанки ~800 токенов, overlap 10–15%&amp;lt;br&amp;gt;[in-process]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;splitter\&quot; target=\&quot;dedup\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint y=\&quot;-145\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;h8\&quot; value=\&quot;4. Кандидаты после дедупликации&amp;lt;br&amp;gt;[in-process]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;dedup\&quot; target=\&quot;rerankcl\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;-470\&quot; y=\&quot;45\&quot; as=\&quot;offset\&quot; /&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1370\&quot; y=\&quot;710\&quot; /&gt;&lt;mxPoint x=\&quot;870\&quot; y=\&quot;710\&quot; /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;h9\&quot; value=\&quot;5. Скоринг пар (чанк ↔ заголовок раздела)&amp;lt;br&amp;gt;[HTTP, GPU-инференс]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;rerankcl\&quot; target=\&quot;rerankinf\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint y=\&quot;-15\&quot; as=\&quot;offset\&quot; /&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1120\&quot; y=\&quot;865\&quot; /&gt;&lt;mxPoint x=\&quot;1120\&quot; y=\&quot;700\&quot; /&gt;&lt;mxPoint x=\&quot;2040\&quot; y=\&quot;700\&quot; /&gt;&lt;mxPoint x=\&quot;2040\&quot; y=\&quot;500\&quot; /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;h10\&quot; value=\&quot;6. Репрезентативные чанки + rerank_score&amp;lt;br&amp;gt;[in-process]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;rerankcl\&quo
