<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;Electron\&quot; agent=\&quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) draw.io/29.0.3 Chrome/140.0.7339.249 Electron/38.7.0 Safari/537.36\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;c4-l3-etl-final\&quot; name=\&quot;C4 L3 — ETL Worker (финальная, целевая модель)\&quot;&gt;&lt;mxGraphModel dx=\&quot;2570\&quot; dy=\&quot;1528\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;2300\&quot; pageHeight=\&quot;1700\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;title\&quot; value=\&quot;C4 Level 3 — Компонент ETL Worker\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=20;fontStyle=1;fontColor=#1A1A1A;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;20\&quot; width=\&quot;2100\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;kb_external\&quot; value=\&quot;&amp;lt;b&amp;gt;База знаний (файловое хранилище)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система на L2]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Регламенты и инструкции (Word), реестр договоров (файлы по типу обращения), типовые формы / устав / оферта (Word/PDF), публичный FAQ / сайт и соцсети водоканала&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;80\&quot; y=\&quot;140\&quot; width=\&quot;260\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;vdb_external\&quot; value=\&quot;&amp;lt;b&amp;gt;Vector Database&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Qdrant, контейнер L2]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;HNSW m=16 / ef=128; payload-индексы: inquiry_type, department, effective_date&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1690\&quot; y=\&quot;810\&quot; width=\&quot;280\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;embed_inf\&quot; value=\&quot;&amp;lt;b&amp;gt;Embedding Inference [GPU]&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment-сервис: TEI/vLLM self-hosted]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;BGE-M3 (осн., 1024-d) / GigaChat Embeddings API (fallback).&amp;amp;nbsp;&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1690\&quot; y=\&quot;1000\&quot; width=\&quot;280\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rerank_inf\&quot; value=\&quot;&amp;lt;b&amp;gt;Reranker Inference [GPU]&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment-сервис: TEI self-hosted]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;BGE-reranker-v2-m3 (cross-encoder). Та же модель переиспользуется online в Backend/Retrieval&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1690\&quot; y=\&quot;638\&quot; width=\&quot;280\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;boundary\&quot; value=\&quot;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F7F9FB;strokeColor=#4D4D4D;strokeWidth=2;verticalAlign=top;align=left;spacingLeft=12;spacingTop=6;fontSize=15;fontStyle=1;fontColor=#4D4D4D;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;360\&quot; width=\&quot;1530\&quot; height=\&quot;880\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ingest\&quot; value=\&quot;&amp;lt;b&amp;gt;1. Ingest Pipeline&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Python, Celery/Dramatiq worker + Unstructured.io]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Единая фаза Ingest: триггер (Celery Beat, курсор last_modified), Document Reader (Unstructured: HTML/PDF/DOCX, очистка), Metadata Enricher (3-уровневый классификатор: regex → эмбеддинг → LLM-fallback через LLM Gateway). Выход: документы с тегами inquiry_type[], department, effective_date, source_title/url&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;110\&quot; y=\&quot;438\&quot; width=\&quot;340\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;syncstate\&quot; value=\&quot;&amp;lt;b&amp;gt;Sync State&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[PostgreSQL / Redis]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Курсоры источников, история запусков, контрольные суммы документов&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=15;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;90\&quot; y=\&quot;740\&quot; width=\&quot;240\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;splitter\&quot; value=\&quot;&amp;lt;b&amp;gt;2. Text Splitter (чанкинг)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[RecursiveCharacterTextSplitter]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Чанки ~800 токенов, overlap 10–15%; границы heading-aware (## → ### → \\n\\n → предложение); chunk_id = hash(doc_id + heading_path + seq)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;700\&quot; y=\&quot;438\&quot; width=\&quot;300\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;dedup\&quot; value=\&quot;&amp;lt;b&amp;gt;3. Quality &amp;amp;amp; Dedup Filter&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[MinHash/SimHash]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Отсев мусора/шаблонного текста; near-duplicate кластеры (Jaccard ≥ 0.9); quality_score в payload&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1250\&quot; y=\&quot;438\&quot; width=\&quot;300\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;reranker\&quot; value=\&quot;&amp;lt;b&amp;gt;4. Reranker Client (offline)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[BGE-reranker-v2-m3, cross-encoder]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Отбор представительных чанков из дубль-кластеров; rerank_score в payload. Та же модель — online в Backend (Retrieval)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;520\&quot; y=\&quot;700\&quot; width=\&quot;300\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;embedding\&quot; value=\&quot;&amp;lt;b&amp;gt;5. Embedding Client&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[BGE-M3 (осн.) / GigaChat Embeddings (fallback)]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Батчи 32–64; нормализация векторов (cosine); model_version в payload; retry/backoff к инференсу&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;520\&quot; y=\&quot;950\&quot; width=\&quot;300\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;vdbclient\&quot; value=\&quot;&amp;lt;b&amp;gt;6. Vector DB Client&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[qdrant-client, gRPC]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;upsert (вектор + payload); tombstones по source_id; реиндекс: новая коллекция → переключение alias (без простоя поиска)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1060\&quot; y=\&quot;880\&quot; width=\&quot;300\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_ingest_kb\&quot; value=\&quot;1.1 опрос изменений (курсор last_modified)&amp;lt;br&amp;gt;[Файловый доступ — как на L2]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=10;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.274;exitY=-0.011;exitDx=0;exitDy=0;exitPerimeter=0;entryX=0.465;entryY=0.995;entryDx=0;entryDy=0;entryPerimeter=0;\&quot; parent=\&quot;1\&quot; source=\&quot;ingest\&quot; target=\&quot;kb_external\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;0.5305\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;200\&quot; y=\&quot;280\&quot; as=\&quot;targetPoint\&quot;/&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;203\&quot; y=\&quot;438\&quot;/&gt;&lt;mxPoint x=\&quot;201\&quot; y=\&quot;438\&quot;/&gt;&lt;/Array&gt;&lt;mxPoint as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_ingest_sync\&quot; value=\&quot;1.2 чтение/запись курсоров&amp;lt;br&amp;gt;[SQL/KV]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=10;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.3;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;ingest\&quot; target=\&quot;syncstate\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_ingest_kb2\&quot; value=\&quot;1.3 получение контента документов&amp;lt;br&amp;gt;[Файловый доступ — как на L2]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=10;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.524;exitY=0.005;entryX=0.8;entryY=1;exitDx=0;exitDy=0;exitPerimeter=0;\&quot; parent=\&quot;1\&quot; source=\&quot;ingest\&quot; target=\&quot;kb_external\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;0.2631\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;288\&quot; y=\&quot;439\&quot;/&gt;&lt;mxPoint x=\&quot;288\&quot; y=\&quot;439\&quot;/&gt;&lt;/Array&gt;&lt;mxPoint as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_ingest_split\&quot; value=\&quot;2. Документы с метаданными → чанкинг&amp;lt;br&amp;gt;[in-process]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=10;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;ingest\&quot; target=\&quot;splitter\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_split_dedup\&quot; value=\&quot;3. Чанки ~800 токенов, overlap 10–15%&amp;lt;br&amp;gt;[in-process]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=10;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;splitter\&quot; target=\&quot;dedup\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_dedup_rerank\&quot; value=\&quot;4. Кандидаты после дедупликации&amp;lt;br&amp;gt;[in-process]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=10;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.3;exitY=1;entryX=0.5;entryY=0;entryDx=0;entryDy=0;\&quot; parent=\&quot;1\&quot; source=\&quot;dedup\&quot; target=\&quot;reranker\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1340\&quot; y=\&quot;660\&quot;/&gt;&lt;mxPoint x=\&quot;670\&quot; y=\&quot;660\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_rerank_inf\&quot; value=\&quot;5. Скоринг пар (чанк ↔ заголовок раздела)&amp;lt;br&amp;gt;[HTTP, GPU-инференс]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=10;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.85;entryX=0;entryY=0.5;startArrow=classic;startFill=1;\&quot; parent=\&quot;1\&quot; source=\&quot;reranker\&quot; target=\&quot;rerank_inf\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;-0.7044\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1500\&quot; y=\&quot;853\&quot;/&gt;&lt;mxPoint x=\&quot;1500\&quot; y=\&quot;708\&quot;/&gt;&lt;/Array&gt;&lt;mxPoint as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_rerank_embed\&quot; value=\&quot;6. Репрезентативные чанки + rerank_score&amp;lt;br&amp;gt;[in-process]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=10;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;reranker\&quot; target=\&quot;embedding\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_embed_inf\&quot; value=\&quot;7. Батч-эмбеддинг (32–64), BGE-M3&amp;lt;br&amp;gt;[HTTP/gRPC, GPU]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=10;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.987;exitY=0.717;entryX=0;entryY=0.5;exitDx=0;exitDy=0;exitPerimeter=0;startArrow=classic;startFill=1;\&quot; parent=\&quot;1\&quot; source=\&quot;embedding\&quot; target=\&quot;embed_inf\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;-0.6807\&quot; y=\&quot;-1\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;820\&quot; y=\&quot;1079\&quot;/&gt;&lt;mxPoint x=\&quot;1450\&quot; y=\&quot;1080\&quot;/&gt;&lt;mxPoint x=\&quot;1450\&quot; y=\&quot;1030\&quot;/&gt;&lt;/Array&gt;&lt;mxPoint as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_embed_vdb\&quot; value=\&quot;8. Векторы + payload (model_version, rerank_score)&amp;lt;br&amp;gt;[in-process]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=10;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;embedding\&quot; target=\&quot;vdbclient\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_vdb_qdrant\&quot; value=\&quot;9. upsert (вектор+payload), tombstones, реиндекс&amp;lt;br&amp;gt;[gRPC — связь есть на L2]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=10;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.992;exitY=0.586;exitDx=0;exitDy=0;exitPerimeter=0;\&quot; parent=\&quot;1\&quot; source=\&quot;vdbclient\&quot; target=\&quot;vdb_external\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;-0.2438\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1430\&quot; y=\&quot;986\&quot;/&gt;&lt;mxPoint x=\&quot;1430\&quot; y=\&quot;920\&quot;/&gt;&lt;mxPoint x=\&quot;1690\&quot; y=\&quot;920\&quot;/&gt;&lt;/Array&gt;&lt;mxPoint as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;datalake\&quot; value=\&quot;&amp;lt;b&amp;gt;Data Lake — Raw Zone&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[S3 / MinIO]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Сырые копии документов «как есть» до трансформации. Паттерн ELT (раздел 30): стратегия чанкинга и версия эмбеддинг-модели могут смениться — переиндексация идёт из Data Lake, без повторного похода к источнику&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#438DD5;strokeColor=#3C7FC0;
