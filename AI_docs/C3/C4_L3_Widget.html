;strokeColor=#4D4D4D;strokeWidth=2;dashed=1;dashPattern=8 6;verticalAlign=top;align=left;spacingLeft=14;spacingTop=8;fontSize=15;fontStyle=1;fontColor=#4D4D4D;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;250\&quot; width=\&quot;1180\&quot; height=\&quot;640\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;user\&quot; value=\&quot;&amp;lt;b&amp;gt;Абонент&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Персона]&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#08427B;strokeColor=#073B6F;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;110\&quot; width=\&quot;240\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;lk\&quot; value=\&quot;&amp;lt;b&amp;gt;Платформа ЛК&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Внешняя система] SSO-сессия, контекст кабинета, точка встраивания&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;420\&quot; y=\&quot;100\&quot; width=\&quot;300\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;backend\&quot; value=\&quot;&amp;lt;b&amp;gt;API Gateway / Backend&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Контейнер] POST /v1/generate, SSE-поток&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1310\&quot; y=\&quot;470\&quot; width=\&quot;300\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;shell\&quot; value=\&quot;&amp;lt;b&amp;gt;Widget Shell  ·  Session Context&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[React-компонент, монтируется в ЛК] Точка монтирования; subscriber_id, session_id, channel = lk_web|lk_mobile из SSO-сессии ЛК (на стенде — из справочника абонентов). Метаданные обязательны для аудита и квот (7.2). Способ встраивания — открытый вопрос раздела 16&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;110\&quot; y=\&quot;320\&quot; width=\&quot;540\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;transport\&quot; value=\&quot;&amp;lt;b&amp;gt;Transport&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[fetch + разбор потока] POST /v1/generate {stream:true}; кадры SSE token / metadata / done / error (7.3); разбор RFC 7807; повтор по 429 с учётом Retry-After&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;690\&quot; y=\&quot;320\&quot; width=\&quot;520\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;chat\&quot; value=\&quot;&amp;lt;b&amp;gt;Chat View&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[чат-лента] Инкрементальная отрисовка токенов, индикатор набора, история диалога. Из metadata-события: источники + confidence_score + disclaimer (DoD 18), кнопки suggested_actions, панель готового бланка (document_url, v4.53). Понятное сообщение об ошибке по type/title/detail. Черновик ввода в памяти React — ПДн абонента в браузере не кэшируются&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;110\&quot; y=\&quot;510\&quot; width=\&quot;1100\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;stage2\&quot; value=\&quot;&amp;lt;b&amp;gt;Блок Этапа 2&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[три состояния одного пути] &amp;lt;b&amp;gt;Confirmation Dialog&amp;lt;/b&amp;gt; — HITL-гейт (4.7): черновик + кнопки подтвердить/отклонить. &amp;lt;b&amp;gt;Document Panel&amp;lt;/b&amp;gt; — готовый документ после подтверждения. &amp;lt;i&amp;gt;Прототип (стенд, web/app.js): Confirmation Dialog и Document Panel реализованы. Slot Form (недостающие поля) остаётся целевым — три обязательных поля берутся из профиля Биллинга.&amp;lt;/i&amp;gt;&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#DAE8FC;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;110\&quot; y=\&quot;710\&quot; width=\&quot;1100\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_fold\&quot; value=\&quot;[v4.53] Свёрнуто 10 → 4. В Transport влиты API Client + SSE Consumer; в Chat View — Message Renderer + Sources Panel + Suggested Actions + Error &amp;amp; Fallback UI + Local UI State; Session Context Provider — в Widget Shell. Способ встраивания (widget / iframe / micro-frontend) — не выбран, раздел 16: влияет на изоляцию стилей, доступ к SSO и CSP.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#B85450;whiteSpace=wrap;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;900\&quot; width=\&quot;1180\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_proto\&quot; value=\&quot;Прототип отличается от целевой технологии (журнал 44.5). «React / TS / Node» — это MVP. На прототипе виджет — три файла статикой (web/index.html, app.js, style.css), без сборки и Node: React не проверил бы ничего архитектурного, зато потребовал бы второго процесса на демонстрации. Компоненты те же, реализация другая; правило 4.1 не нарушено.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#7A5C00;whiteSpace=wrap;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;945\&quot; width=\&quot;1180\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e1\&quot; value=\&quot;Диалог, подтверждение действий&amp;lt;br&amp;gt;[HTTPS]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=1;entryX=0.2;entryY=0;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;user\&quot; target=\&quot;shell\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e2\&quot; value=\&quot;монтирование, SSO-сессия\&quot; style=\&quot;edgeStyle=orthogonalEdgeS
