<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;toolbar&quot;: &quot;pages zoom layers lightbox&quot;, &quot;page&quot;: 0, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;Electron\&quot; agent=\&quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) draw.io/29.0.3 Chrome/140.0.7339.249 Electron/38.7.0 Safari/537.36\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;c4l3\&quot; name=\&quot;C4 Level 3 Widget\&quot;&gt;&lt;mxGraphModel dx=\&quot;1028\&quot; dy=\&quot;611\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;2500\&quot; pageHeight=\&quot;1450\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;title\&quot; value=\&quot;&amp;lt;b&amp;gt;C4 Level 3 — Компоненты: AI-виджет в ЛК&amp;lt;/b&amp;gt;\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=middle;whiteSpace=wrap;fontSize=20;fontColor=#16324F;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;80\&quot; y=\&quot;20\&quot; width=\&quot;1200\&quot; height=\&quot;36\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;subtitle\&quot; value=\&quot;Поток ответа на экран (4.3), источники, suggested_actions, подтверждение операций Этапа 2 (4.7). Свёрнут до четырёх компонентов (v4.53).\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=top;whiteSpace=wrap;fontSize=11;fontColor=#5A6B7B;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;80\&quot; y=\&quot;60\&quot; width=\&quot;1600\&quot; height=\&quot;30\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;person\&quot; value=\&quot;&amp;lt;b&amp;gt;Абонент&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Персона]\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#16324F;strokeColor=#0E2233;fontColor=#FFFFFF;fontSize=12;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;140\&quot; width=\&quot;260\&quot; height=\&quot;100\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;lk\&quot; value=\&quot;&amp;lt;b&amp;gt;Платформа ЛК&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;SSO-сессия, контекст кабинета, точка встраивания\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#8A9BA8;strokeColor=#5F7182;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;500\&quot; y=\&quot;120\&quot; width=\&quot;420\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;apigw\&quot; value=\&quot;&amp;lt;b&amp;gt;API Gateway / Backend&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер]&amp;lt;br&amp;gt;POST /v1/generate, SSE-поток\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2000\&quot; y=\&quot;420\&quot; width=\&quot;420\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;boundary\&quot; value=\&quot;Контейнер: AI-виджет в ЛК [React / TS — целевое; на прототипе 3 файла статики]\&quot; style=\&quot;rounded=1;arcSize=3;whiteSpace=wrap;html=1;fillColor=#F4F8FC;strokeColor=#5B8DB8;dashed=1;strokeWidth=2;align=left;verticalAlign=top;spacingTop=10;spacingLeft=14;fontSize=13;fontStyle=1;fontColor=#16324F;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;80\&quot; y=\&quot;340\&quot; width=\&quot;1700\&quot; height=\&quot;860\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;shell\&quot; value=\&quot;&amp;lt;b&amp;gt;Widget Shell · Session Context&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[React-компонент, монтируется в ЛК]&amp;lt;br&amp;gt;Точка монтирования: subscriber_id, session_id, channel = lk_web | lk_mobile из SSO-сессии ЛК (на стенде — из справочника абонентов). Метаданные обязательны для аудита и квот (7.2). Способ встраивания — открытый вопрос раздела 16\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;120\&quot; y=\&quot;400\&quot; width=\&quot;700\&quot; height=\&quot;190\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;transport\&quot; value=\&quot;&amp;lt;b&amp;gt;Transport&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[fetch + разбор потока]&amp;lt;br&amp;gt;POST /v1/generate {stream:true}; кадры SSE: token / metadata / done / error (7.3); разбор RFC 7807, повтор по 429 с учётом Retry-After\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;900\&quot; y=\&quot;400\&quot; width=\&quot;840\&quot; height=\&quot;190\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;chatview\&quot; value=\&quot;&amp;lt;b&amp;gt;Chat View&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[чат-лента] Инкрементальная отрисовка токенов, индикатор набора, история диалога. Из metadata-событий: источники + confidence_score + disclaimer (DoD 18), кнопки suggested_actions, панель готового бланка (document_url, v4.53). Понятное сообщение об ошибке по type/title/detail. Черновик ввода — в памяти React; ПДн абонента в браузере не кэшируются\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;120\&quot; y=\&quot;670\&quot; width=\&quot;1300\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;stage2\&quot; value=\&quot;&amp;lt;b&amp;gt;Блок Этапа 2&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[три состояния одного пути] &amp;lt;b&amp;gt;Confirmation Dialog&amp;lt;/b&amp;gt; — HITL-гейт (4.7): черновик + кнопки «подтвердить / отклонить». &amp;lt;b&amp;gt;Document Panel&amp;lt;/b&amp;gt; — готовый документ после подтверждения. &amp;lt;i&amp;gt;Прототип (стенд, web/app.js): Confirmation Dialog и Document Panel реализованы; Slot Form (недостающие поля) остаётся целевым — три обязательных поля берутся из профиля Биллинга.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#D6E6F5;strokeColor=#7EA6E0;fontColor=#16324F;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;120\&quot; y=\&quot;960\&quot; width=\&quot;1620\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note1\&quot; value=\&quot;&amp;lt;b&amp;gt;[v4.53]&amp;lt;/b&amp;gt; Свёрнуто 10 → 4. В Transport влиты API Client + SSE Consumer; в Chat View — Message Renderer + Sources Panel + Suggested Actions + Error &amp;amp; Fallback UI + Local UI State; Session Context Provider — в Widget Shell. Способ встраивания (widget / iframe / micro-frontend) — не выбран, раздел 16: влияет на изоляцию стилей, доступ к SSO и CSP.\&quot; style=\&quot;rounded=1;arcSize=6;whiteSpace=wrap;html=1;fillColor=#FDF6E7;strokeColor=#D9A400;fontColor=#7A5C00;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;80\&quot; y=\&quot;1240\&quot; width=\&quot;1140\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note2\&quot; value=\&quot;&amp;lt;b&amp;gt;Прототип отличается от целевой технологии&amp;lt;/b&amp;gt; (журнал 44.5). «React / TS / Node» — это MVP: на прототипе виджет — три файла статики (web/index.html, app.js, style.css), без сборки и Node. React не проверил бы ничего архитектурного, зато потребовал бы второго процесса на демонстрации; реализация проще, правило 4.1 не нарушено.\&quot; style=\&quot;rounded=1;arcSize=6;whiteSpace=wrap;html=1;fillColor=#FDF6E7;strokeColor=#D9A400;fontColor=#7A5C00;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1260\&quot; y=\&quot;1240\&quot; width=\&quot;1160\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e1\&quot; value=\&quot;Диалог, подтверждение действий&amp;lt;br&amp;gt;[HTTPS]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=1;entryX=0.2;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;person\&quot; target=\&quot;shell\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;100\&quot; y=\&quot;-30\&quot; as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e2\&quot; value=\&quot;Монтирование, SSO-сессия [HTTPS]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.4;exitY=0;entryX=0.5;entryY=1;\&quot; parent=\&quot;1\&quot; source=\&quot;shell\&quot; target=\&quot;lk\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;-10\&quot; y=\&quot;-12\&quot; as=\&quot;offset\&quot;/&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;400\&quot; y=\&quot;270\&quot;/&gt;&lt;mxPoint x=\&quot;710\&quot; y=\&quot;270\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e3\&quot; value=\&quot;subscriber_id, session_id, channel\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;shell\&quot; target=\&quot;transport\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint y=\&quot;-22\&quot; as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e4\&quot; value=\&quot;POST /v1/generate {stream:true}&amp;lt;br&amp;gt;[HTTPS / JSON]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.3;entryX=0;entryY=0.25;\&quot; parent=\&quot;1\&quot; source=\&quot;transport\&quot; target=\&quot;apigw\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint y=\&quot;-15\&quot; as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e5\&quot; value=\&quot;SSE-поток&amp;lt;br&amp;gt;[text/event-stream]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0;exitY=0.65;entryX=1;entryY=0.65;\&quot; parent=\&quot;1\&quot; source=\&quot;apigw\&quot; target=\&quot;transport\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint y=\&quot;15\&quot; as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e6\&quot; value=\&quot;Токены, источники, кнопки, ошибки\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.15;exitY=1;entryX=0.65;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;transport\&quot; target=\&quot;chatview\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;-120\&quot; as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e7\&quot; value=\&quot;Выбор действия → новый запрос\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.85;exitY=0;entryX=0.4;entryY=1;\&quot; parent=\&quot;1\&quot; source=\&quot;chatview\&quot; target=\&quot;transport\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;110\&quot; as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e8\&quot; value=\&quot;Слоты, черновик, готовый бланк (Этап 2)\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;dashed=1;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.15;exitY=1;entryX=0.12;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;chatview\&quot; target=\&quot;stage2\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;170\&quot; as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e9\&quot; value=\&quot;Подтверждение операции (HITL) → новый запрос\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;dashed=1;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.91;exitY=0;entryX=0.83;entryY=1;\&quot; parent=\&quot;1\&quot; source=\&quot;stage2\&quot; target=\&quot;transport\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;&quot;}"></div>
