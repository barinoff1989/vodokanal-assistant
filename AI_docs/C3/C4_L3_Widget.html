=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=6;spacingRight=6;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;950\&quot; y=\&quot;320\&quot; width=\&quot;350\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sse\&quot; value=\&quot;&amp;lt;b&amp;gt;SSE Consumer&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[обработчик событий]&amp;lt;br&amp;gt;&amp;lt;font style=&#x27;font-size:11px&#x27;&amp;gt;token / metadata / done / error (раздел 7.3). Отрисовка по мере поступления — абонент видит, что ответ печатается (правило 4.3)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=6;spacingRight=6;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;110\&quot; y=\&quot;530\&quot; width=\&quot;380\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;render\&quot; value=\&quot;&amp;lt;b&amp;gt;Message Renderer&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[чат-лента]&amp;lt;br&amp;gt;&amp;lt;font style=&#x27;font-size:11px&#x27;&amp;gt;История диалога, инкрементальная отрисовка токенов, индикатор набора&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=6;spacingRight=6;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;530\&quot; y=\&quot;530\&quot; width=\&quot;380\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sources\&quot; value=\&quot;&amp;lt;b&amp;gt;Sources Panel&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[источники ответа]&amp;lt;br&amp;gt;&amp;lt;font style=&#x27;font-size:11px&#x27;&amp;gt;sources + confidence_score + disclaimer из metadata-события. Требование DoD раздела 18&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=6;spacingRight=6;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;950\&quot; y=\&quot;530\&quot; width=\&quot;350\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;actions\&quot; value=\&quot;&amp;lt;b&amp;gt;Suggested Actions&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[кнопки следующих шагов]&amp;lt;br&amp;gt;&amp;lt;font style=&#x27;font-size:11px&#x27;&amp;gt;Рендер suggested_actions; выбор типа обращения вручную в fallback-сценарии&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=6;spacingRight=6;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;110\&quot; y=\&quot;740\&quot; width=\&quot;380\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;stage2\&quot; value=\&quot;&amp;lt;b&amp;gt;Блок Этапа 2&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[появляется вместе с операциями записи]&amp;lt;br&amp;gt;&amp;lt;font style=&#x27;font-size:11px&#x27;&amp;gt;&amp;lt;b&amp;gt;Три состояния одного пути, а не три независимых компонента.&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Slot Form&amp;lt;/b&amp;gt; — ввод недостающих обязательных полей: full_name, account_number, reason.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Confirmation Dialog&amp;lt;/b&amp;gt; — HITL-гейт: черновик и кнопки подтвердить / отклонить / исправить. Правило 4.7: без явного подтверждения абонента запись не выполняется.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Document Panel&amp;lt;/b&amp;gt; — готовый документ ПОСЛЕ подтверждения: вложение в ленте либо ссылка
