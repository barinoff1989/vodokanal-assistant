<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;toolbar&quot;: &quot;pages zoom layers lightbox&quot;, &quot;page&quot;: 0, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;app.diagrams.net\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;C4 L3 — Сервис работы с обращениями\&quot; name=\&quot;C4 L3 — Сервис работы с обращениями\&quot;&gt;&lt;mxGraphModel dx=\&quot;1400\&quot; dy=\&quot;900\&quot; grid=\&quot;0\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;1780\&quot; pageHeight=\&quot;780\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;ttl\&quot; value=\&quot;C4 Level 3 — Компоненты: Сервис работы с обращениями\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=20;fontStyle=1;fontColor=#1A1A1A;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;20\&quot; width=\&quot;1700\&quot; height=\&quot;34\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sub\&quot; value=\&quot;Этап 2. Регистрация обращения и маршрутизация: обычные — в микросервис обращений, аварийные — в Диспетчерскую. Только после подтверждения (4.7). Свёрнут до трёх компонентов (v4.53).\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=12;fontColor=#4D4D4D;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;56\&quot; width=\&quot;1700\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;bnd\&quot; value=\&quot;Сервис работы с обращениями  [Go/Python, Этап 2]\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F7F9FB;strokeColor=#4D4D4D;strokeWidth=2;dashed=1;dashPattern=8 6;verticalAlign=top;align=left;spacingLeft=14;spacingTop=8;fontSize=15;fontStyle=1;fontColor=#4D4D4D;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;380\&quot; y=\&quot;150\&quot; width=\&quot;900\&quot; height=\&quot;470\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;orch\&quot; value=\&quot;&amp;lt;b&amp;gt;Agent Orchestrator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Python] Шаги 30, 33: регистрация обращения, передача аварийной заявки. На прототипе роль несёт app/backend/registration.py&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;250\&quot; width=\&quot;260\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;inq\&quot; value=\&quot;&amp;lt;b&amp;gt;Микросервис обращений&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Внешняя система] Единая точка регистрации. Читают подрядчики и пайплайн дообучения (источник 3). &amp;lt;b&amp;gt;На прототипе — таблица в Postgres&amp;lt;/b&amp;gt; (app/inquiries/store.py, ADR-009)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1360\&quot; y=\&quot;190\&quot; width=\&quot;320\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;disp\&quot; value=\&quot;&amp;lt;b&amp;gt;Диспетчерская система&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Внешняя система] Аварийные заявки, near real-time (источник 7). На прототипе — заглушка&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1360\&quot; y=\&quot;400\&quot; width=\&quot;320\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sess\&quot; value=\&quot;&amp;lt;b&amp;gt;Session State Store&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Redis / PostgreSQL] Аудит-лог операций&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1360\&quot; y=\&quot;570\&quot; width=\&quot;320\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;regapi\&quot; value=\&quot;&amp;lt;b&amp;gt;Registration API  ·  HITL Guard&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[правило 4.7] Принимает обращение от оркестратора. Отклоняет без явного подтверждения абонента; проверяет привязку subscriber_id к сессии (Spoofing / IDOR, раздел 13). Idempotency-Key заявки: повторная отправка не создаёт вторую (UNIQUE в таблице)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;430\&quot; y=\&quot;230\&quot; width=\&quot;360\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;route\&quot; value=\&quot;&amp;lt;b&amp;gt;Route Selector  ·  Clients&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[правила по inquiry_type] emergency → Диспетчерская система (REST); остальные девять кодов таксономии → микросервис обращений (на прототипе — INSERT в таблицу Postgres). Прямого доступа в чужую БД нет (29.5)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;850\&quot; y=\&quot;230\&quot; width=\&quot;360\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;status\&quot; value=\&quot;&amp;lt;b&amp;gt;Status  ·  Audit&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[статусы + аудит] Возвращает ID заявки, подразделение, статус (шаг 35). Аудит в Session State: кто, что, когда, Idempotency-Key (шаг 36)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;430\&quot; y=\&quot;440\&quot; width=\&quot;780\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_fold\&quot; value=\&quot;[v4.53] Свёрнуто 8 → 3. В Registration API влит Idempotency Store; в Route Selector — Inquiry API Client + Dispatch Client; Status Tracker + Audit Emitter — один узел Status · Audit.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#B85450;whiteSpace=wrap;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;380\&quot; y=\&quot;640\&quot; width=\&quot;900\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_name\&quot; value=\&quot;Переименован из «Application Router» (раздел 5.4) в v4.5: контейнер не столько маршрутизирует, сколько регистрирует обращение и ведёт статус. На прототипе живой путь записи — регистрация обращения в таблицу Postgres после подтверждения в диалоге (журнал 77.5); Диспетчерская не подключена.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#B85450;whiteSpace=wrap;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;380\&quot; y=\&quot;685\&quot; width=\&quot;900\&quot; height=\&quot;55\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;i1\&quot; value=\&quot;30. регистрация обращения&amp;lt;br&amp;gt;[Internal HTTP]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.25;entryX=0;entryY=0.3;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;orch\&quot; target=\&quot;regapi\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;i2\&quot; value=\&quot;35. ID заявки, подразделение, статус\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0;exitY=0.85;entryX=1;entryY=0.85;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;regapi\&quot; target=\&quot;orch\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;i3\&quot; value=\&quot;гейт пройден\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;regapi\&quot; target=\&quot;route\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;i9\&quot; value=\&quot;31. создать обращение&amp;lt;br&amp;gt;[API микросервиса / INSERT]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.3;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;route\&quot; target=\&quot;inq\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;i10\&quot; value=\&quot;33. аварийная заявка&amp;lt;br&amp;gt;[REST API]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.7;entryX=0;entryY=0.4;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;route\&quot; target=\&quot;disp\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;i11\&quot; value=\&quot;результат: ID, подразделение\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.3;exitY=1;entryX=0.7;entryY=0;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;route\&quot; target=\&quot;status\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;i14\&quot; value=\&quot;36. аудит-лог&amp;lt;br&amp;gt;[Redis / SQL]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;status\&quot; target=\&quot;sess\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1310\&quot; y=\&quot;515\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;&quot;}"></div>
