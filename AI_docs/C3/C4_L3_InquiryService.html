;1\&quot;&gt;&lt;mxGeometry x=\&quot;600\&quot; y=\&quot;360\&quot; width=\&quot;560\&quot; height=\&quot;300\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;router\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:13px&amp;quot;&amp;gt;Route Selector · Clients&amp;lt;/b&amp;gt;  [правила по inquiry_type]&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;emergency&amp;lt;/b&amp;gt; → Диспетчерская система (REST); остальные шестнадцать кодов таксономии → микросервис обращений (на прототипе — INSERT в таблицу Postgres).&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Прямого доступа в чужую БД нет&amp;lt;/b&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#D6E6F5;strokeColor=#2F80C3;fontColor=#16324F;fontSize=11;align=left;verticalAlign=top;spacing=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1240\&quot; y=\&quot;360\&quot; width=\&quot;600\&quot; height=\&quot;300\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;status\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:13px&amp;quot;&amp;gt;Status · Audit&amp;lt;/b&amp;gt;  [статусы + аудит]&amp;lt;br&amp;gt;Возвращает ID заявки, подразделение, статус (шаг 35). Аудит в Session State: кто, что, когда, Idempotency-Key (шаг 36)\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#D6E6F5;strokeColor=#2F80C3;fontColor=#16324F;fontSize=11;align=left;verticalAlign=top;spacing=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;600\&quot; y=\&quot;760\&quot; width=\&quot;1240\&quot; height=\&quot;280\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;micro\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:13px&amp;quot;&amp;gt;Микросервис обращений&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;Единая точка регистрации. Читают подрядчики и пайплайн дообучения. &amp;lt;b&amp;gt;На прототипе&amp;lt;/b&amp;gt; — таблица в Postgres (app/inquiries/store.py)\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#8A9BA8;strokeColor=#5F7182;fontColor=#FFFFFF;fontSize=11;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2050\&quot; y=\&quot;260\&quot; width=\&quot;460\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;dispatch\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:13px&amp;quot;&amp;gt;Диспетчерская система&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;Аварийные заявки, near real-time. На прототипе — заглушка\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#8A9BA8;strokeColor=#5F7182;fontColor=#FFFFFF;fontSize=11;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2020\&quot; y=\&quot;560\&quot; width=\&quot;460\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;store\&quot; value=\&quot;&amp;lt;b&amp;gt;Session State Store&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Redis / PostgreSQL]&amp;lt;br&amp;gt;Аудит-лог операций\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=14;fillColor=#D5F0E1;strokeColor=#1E8449;fontColor=#16324F;fontSize=11;align=center;verticalAlign=middle;spacing=4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2020\&quot; y=\&quot;820\&quot; width=\&quot;460\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note_v\&quot; value=\&quot;&amp;lt;b&amp;gt;Состав.&amp;lt;/b&amp;gt; В Registration API входит Idempotency Store; в Route Selector — Inquiry API Client и Dispatch Client; Status Tracker и Audit Emitter — один узел Status · Audit.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Контейнер не столько маршрутизирует, сколько регистрирует обраще
