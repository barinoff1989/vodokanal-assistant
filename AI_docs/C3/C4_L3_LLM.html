mp;gt;[после сборки ответа]\&quot; style=\&quot;endArrow=classic;html=1;exitX=0.5;exitY=1;entryX=0.9;entryY=0;strokeColor=#333333;fontSize=10;dashed=1;\&quot; parent=\&quot;1\&quot; source=\&quot;core_litellm\&quot; target=\&quot;ext_pg\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry width=\&quot;50\&quot; height=\&quot;50\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1080\&quot; y=\&quot;470\&quot;/&gt;&lt;mxPoint x=\&quot;780\&quot; y=\&quot;470\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note_fold\&quot; value=\&quot;[v4.50] Бокс Billing Callback свёрнут: это две записи метрик, не компонент. Учёт сейчас: llm_gateway_tokens_total, llm_provider_used_total, гистограммы времён — в Prometheus (порт 9100, дашборд раздел 37); плюс строка на вызов в usage_events (Postgres на прототипе, ClickHouse на MVP — раздел 35.1). Стоимость в деньгах не считается (нет тарифов, P0 №1). quality_report async (rel_10) — check_groundedness в живом пути не вызывается (заглушка, судья — код-шаг 10).\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=10;fontStyle=2;fontColor=#B85450;whiteSpace=wrap;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;200\&quot; y=\&quot;660\&quot; width=\&quot;1160\&quot; height=\&quot;70\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;&quot;, &quot;toolbar&quot;: &quot;pages zoom layers lightbox&quot;, &quot;page&quot;: 0}"></div>
