<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;toolbar&quot;: &quot;pages zoom layers lightbox&quot;, &quot;page&quot;: 0, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;app.diagrams.net\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;C4 L3 — Agent Orchestrator\&quot; name=\&quot;C4 L3 — Agent Orchestrator\&quot;&gt;&lt;mxGraphModel dx=\&quot;1400\&quot; dy=\&quot;900\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;1900\&quot; pageHeight=\&quot;1180\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;ttl\&quot; value=\&quot;C4 Level 3 — Компоненты: Agent Orchestrator\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=20;fontStyle=1;fontColor=#1A1A1A;whiteSpace=wrap;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;20\&quot; width=\&quot;1820\&quot; height=\&quot;34\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sub\&quot; value=\&quot;Этап 2. Конечный автомат жизненного цикла обращения, привал HITL и вызов инструментов записи. Соответствует диаграмме последовательностей Этапа 2. Классификация и генерация ответа делаются Backend&amp;#x27;ом до делегирования — оркестратор к модели не обращается (на прототипе — вообще, в целевом устройстве — только через Form Agent). Сокращено в v4.47: десять узлов свёрнуты в четыре — Triage и Advisor вынесены в Backend (в коде вызываются для каждого запроса, Этап 1 включительно), Tool Router → Scenario Controller, Draft Validator и Slot Store → Inquiry FSM (раздел 80 журнала).\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=12;fontColor=#4D4D4D;whiteSpace=wrap;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;56\&quot; width=\&quot;1820\&quot; height=\&quot;56\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;bnd\&quot; value=\&quot;Agent Orchestrator&amp;#160; [Контейнер: Python, Этап 2]\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F7F9FB;strokeColor=#4D4D4D;strokeWidth=2;dashed=1;verticalAlign=top;align=left;spacingLeft=14;spacingTop=8;fontSize=15;fontStyle=1;fontColor=#4D4D4D;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;440\&quot; y=\&quot;150\&quot; width=\&quot;980\&quot; height=\&quot;640\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;backend\&quot; value=\&quot;&amp;lt;b&amp;gt;API Gateway / Backend&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Go / Python FastAPI]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Делегирует сценарий Этапа 2 (шаг 3). Классификация (Triage) и решение «есть ли контекст» (Advisor) живут здесь — они общий пред-шаг всех путей, не часть оркестратора&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=6;spacingRight=6;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;180\&quot; width=\&quot;330\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;gw\&quot; value=\&quot;&amp;lt;b&amp;gt;LLM Gateway&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Python / LiteLLM]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Единственная возможная связь оркестратора с моделью&amp;lt;/b&amp;gt; — промпт роли Form Agent при сборе недостающих слотов (Этап 2). Классификация и генерация ответа модель делает раньше, на стороне Backend. На прототипе оркестратор к Gateway не обращается вообще&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=6;spacingRight=6;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;dashed=1;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;380\&quot; width=\&quot;330\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sess\&quot; value=\&quot;&amp;lt;b&amp;gt;Session State Store&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Redis / PostgreSQL]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Состояние FSM, слоты, черновик, аудит-лог. На прототипе — Redis без диска, TTL 30 мин&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1500\&quot; y=\&quot;180\&quot; width=\&quot;330\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;docgen\&quot; value=\&quot;&amp;lt;b&amp;gt;Document Generator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Python]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Шаг 18–19: рендер документа по шаблону&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=6;spacingRight=6;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1500\&quot; y=\&quot;380\&quot; width=\&quot;330\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;badapter\&quot; value=\&quot;&amp;lt;b&amp;gt;Billing Adapter&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Go / Python]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Шаг 26–29: запись показаний в Биллинг через XML-RPC API (ADR-009)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=6;spacingRight=6;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1500\&quot; y=\&quot;520\&quot; width=\&quot;330\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;inqsvc\&quot; value=\&quot;&amp;lt;b&amp;gt;Сервис работы с обращениями&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Go / Python]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Шаг 30–35: регистрация обращения; аварийная заявка → Диспетчерская&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=6;spacingRight=6;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1500\&quot; y=\&quot;660\&quot; width=\&quot;330\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ctl\&quot; value=\&quot;&amp;lt;b&amp;gt;Scenario Controller&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Python, точка входа = app/backend/registration.py]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Принимает делегирование от Backend, ведёт сценарий обращения по репликам: предложить черновик → дождаться явного подтверждения → выполнить → показать номер. &amp;lt;b&amp;gt;Вызов инструментов после HITL — здесь же&amp;lt;/b&amp;gt; (бывший Tool Router): один инструмент на путь, генерация и проброс Idempotency-Key. Возвращает результат — ID заявки, подразделение, статус, следующие шаги (шаг 37)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;470\&quot; y=\&quot;210\&quot; width=\&quot;440\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fsm\&quot; value=\&quot;&amp;lt;b&amp;gt;Inquiry FSM&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[таблица переходов = app/fsm.py; кандидат на LangGraph — ADR-010]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;INIT → CLASSIFIED → FILLING → DRAFT_READY → AWAITING_CONFIRMATION → SUBMITTED → COMPLETED. События: classify, fill, finalize_draft, request_confirm, submit, reject, complete. Недопустимый переход отклоняется.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Draft Validator&amp;lt;/b&amp;gt; — не отдельный бокс: на переходе finalize_draft проверяется полнота обязательных слотов (full_name, account_number, reason). &amp;lt;b&amp;gt;Слоты&amp;lt;/b&amp;gt; — поле состояния (SessionState.slots), не компонент&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;960\&quot; y=\&quot;210\&quot; width=\&quot;420\&quot; height=\&quot;240\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;hitl\&quot; value=\&quot;&amp;lt;b&amp;gt;HITL Gate&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[правило 4.7 = app/adapters/base.py + Intent]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Состояние AWAITING_CONFIRMATION. Без явного подтверждения абонента (признак Intent от кнопки, не текст реплики) ни один инструмент записи не вызывается. Проверка привязки subscriber_id к сессии на каждом write-шаге — защита Spoofing / IDOR (шаг 25)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;470\&quot; y=\&quot;480\&quot; width=\&quot;440\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;audit\&quot; value=\&quot;&amp;lt;b&amp;gt;Audit Writer&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[SessionState.record()]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Кто, что, когда, Idempotency-Key (шаг 36). Только идентификаторы и имена полей — не значения ПДн. Отказ абонента пишется тоже, с пометкой, что запись не выполнялась (шаг 43)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;960\&quot; y=\&quot;490\&quot; width=\&quot;420\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e1\&quot; value=\&quot;3. Делегирование сценария&amp;#10;[Internal HTTP]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.25;entryX=0;entryY=0.3;\&quot; parent=\&quot;1\&quot; source=\&quot;backend\&quot; target=\&quot;ctl\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e2\&quot; value=\&quot;37. ID заявки, подразделение,&amp;#10;статус, следующие шаги\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0;exitY=0.85;entryX=1;entryY=0.8;\&quot; parent=\&quot;1\&quot; source=\&quot;ctl\&quot; target=\&quot;backend\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e3\&quot; value=\&quot;Создать и вести состояние\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.3;entryX=0;entryY=0.3;\&quot; parent=\&quot;1\&quot; source=\&quot;ctl\&quot; target=\&quot;fsm\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e4\&quot; value=\&quot;Черновик полон →&amp;#10;request_confirm\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.3;exitY=1;entryX=0.7;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;fsm\&quot; target=\&quot;hitl\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e5\&quot; value=\&quot;22–24. Подтверждение&amp;#10;получено → submit\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=0;entryX=0.35;entryY=1;\&quot; parent=\&quot;1\&quot; source=\&quot;hitl\&quot; target=\&quot;ctl\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e6\&quot; value=\&quot;Результат операции\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.4;\&quot; parent=\&quot;1\&quot; source=\&quot;ctl\&quot; target=\&quot;audit\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e7\&quot; value=\&quot;Состояние FSM, слоты,&amp;#10;черновик [Redis / SQL]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.3;entryX=0;entryY=0.3;\&quot; parent=\&quot;1\&quot; source=\&quot;fsm\&quot; target=\&quot;sess\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e8\&quot; value=\&quot;36 / 43. Аудит-лог&amp;#10;[Redis / SQL]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.75;\&quot; parent=\&quot;1\&quot; source=\&quot;audit\&quot; target=\&quot;sess\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1440\&quot; y=\&quot;560\&quot;/&gt;&lt;mxPoint x=\&quot;1440\&quot; y=\&quot;292\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e9\&quot; value=\&quot;Промпт роли Form (Этап 2)\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#9673A6;strokeWidth=2;dashed=1;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0;exitY=0.6;entryX=1;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;ctl\&quot; target=\&quot;gw\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e10\&quot; value=\&quot;18. Рендер документа\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.6;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;ctl\&quot; target=\&quot;docgen\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1450\&quot; y=\&quot;435\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e11\&quot; value=\&quot;26. Запись операции&amp;#10;(после HITL)\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.7;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;ctl\&quot; target=\&quot;badapter\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1460\&quot; y=\&quot;575\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e12\&quot; value=\&quot;30 / 33. Регистрация обращения,&amp;#10;аварийная заявка\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.9;exitY=1;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;ctl\&quot; target=\&quot;inqsvc\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1470\&quot; y=\&quot;715\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_form\&quot; value=\&quot;Form Agent (сбор недостающих слотов, формулировка вопроса абоненту) — Этап 2, НЕ реализован; это единственный компонент оркестратора, которому нужна модель. На прототипе все три обязательных слота известны из профиля Биллинга и текста вопроса, форма не нужна, и оркестратор модель не вызывает (раздел 75.2, 79.2).\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#9673A6;whiteSpace=wrap;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;470\&quot; y=\&quot;700\&quot; width=\&quot;900\&quot; height=\&quot;60\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_guard\&quot; value=\&quot;Guardrails (ПДн / токсичность / groundedness ответа модели) живут в LLM Gateway (раздел 35) и здесь НЕ дублируются — решение зафиксировано этой диаграммой (раздел 41.2). Draft Validator внутри FSM — другая задача: готовность черновика к подтверждению, не проверка ответа модели.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#B85450;whiteSpace=wrap;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;820\&quot; width=\&quot;1150\&quot; height=\&quot;60\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_stage\&quot; value=\&quot;Контейнер Этапа 2. Внедряется только после метрик Этапа 1 (stage-gating, раздел 19 п. 9). Диаграмма проектная, не отражает работающий код. На прототипе роль Scenario Controller несёт app/backend/registration.py, живой путь записи — регистрация обращения через Сервис работы с обращениями; Billing Adapter и Document Generator написаны, но не вызываются.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#4D4D4D;whiteSpace=wrap;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;890\&quot; width=\&quot;1790\&quot; height=\&quot;70\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_moved\&quot; value=\&quot;[v4.47] Свёрнуто из десяти узлов: Triage, Advisor → Backend; Tool Router → Scenario Controller; Draft Validator, Slot Store → Inquiry FSM; Form Agent → нота. Обоснование — раздел 80 журнала.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#4D4D4D;whiteSpace=wrap;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;970\&quot; width=\&quot;1790\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;&quot;}"></div>
