<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;toolbar&quot;: &quot;pages zoom layers lightbox&quot;, &quot;page&quot;: 0, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;Electron\&quot; agent=\&quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) draw.io/29.0.3 Chrome/140.0.7339.249 Electron/38.7.0 Safari/537.36\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;c4l3orch\&quot; name=\&quot;C4 Level 3 Orchestrator\&quot;&gt;&lt;mxGraphModel dx=\&quot;1028\&quot; dy=\&quot;611\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;2600\&quot; pageHeight=\&quot;1420\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot; /&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot; /&gt;&lt;mxCell id=\&quot;title\&quot; value=\&quot;&amp;lt;b&amp;gt;C4 Level 3 — Компоненты: Agent Orchestrator&amp;lt;/b&amp;gt;\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=middle;whiteSpace=wrap;fontSize=20;fontColor=#16324F;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;20\&quot; width=\&quot;1400\&quot; height=\&quot;36\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;subtitle\&quot; value=\&quot;Этап 2. Конечный автомат жизненного цикла обращения, привал HITL и вызовов инструментов записи. Соответствует диаграмме последовательностей Этапа 2. Классификация и генерация ответа делаются Backend&#x27;ом до делегирования — оркестратор к модели не обращается (на прототипе — вообще, в целевом устройстве — только через Form Agent). Triage и Advisor живут в Backend; Tool Router — это Scenario Controller, Draft Validator и Slot Store — часть Inquiry FSM.\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=top;whiteSpace=wrap;fontSize=11;fontColor=#5A6B7B;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;58\&quot; width=\&quot;2200\&quot; height=\&quot;48\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;backend\&quot; value=\&quot;&amp;lt;b&amp;gt;API Gateway / Backend&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Go / Python FastAPI]&amp;lt;br&amp;gt;Делегирует сценарий Этапа 2 (шаг 3). Классификация (Triage) и решение «хватает ли контекста» (Advisor) живут здесь — они общий пред-шаг всех путей, не часть оркестратора\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;300\&quot; width=\&quot;420\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;llmgw\&quot; value=\&quot;&amp;lt;b&amp;gt;LLM Gateway&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Python / LiteLLM]&amp;lt;br&amp;gt;Единственная возможная связь оркестратора с моделью — промпт роли Form Agent при сборе недостающих слотов (Этап 2). Классификацию и генерацию ответа модель делает раньше, на стороне Backend. На прототипе оркестратор к Gateway не обращается вообще\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;560\&quot; width=\&quot;420\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;boundary\&quot; value=\&quot;Agent Orchestrator [Контейнер: Python, Этап 2]\&quot; style=\&quot;rounded=1;arcSize=3;whiteSpace=wrap;html=1;fillColor=#F4F8FC;strokeColor=#5B8DB8;dashed=1;strokeWidth=2;align=left;verticalAlign=top;spacingTop=10;spacingLeft=14;fontSize=13;fontStyle=1;fontColor=#16324F;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;560\&quot; y=\&quot;220\&quot; width=\&quot;1400\&quot; height=\&quot;900\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sc\&quot; value=\&quot;&amp;lt;b&amp;gt;Scenario Controller&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Python, точка входа = app/backend/registration.py]&amp;lt;br&amp;gt;Принимает делегирование от Backend. Ведёт сценарий обращения по репликам: предложить черновик → дождаться явного подтверждения → выполнить → показать номер. &amp;lt;b&amp;gt;Вызов инструментов после HITL — здесь же&amp;lt;/b&amp;gt; (бывший Tool Router): один инструмент на путь, генерация и проброс Idempotency-Key. Возвращает результат — ID заявки, подразделение, статус, следующие шаги (шаг 37)\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;640\&quot; y=\&quot;300\&quot; width=\&quot;600\&quot; height=\&quot;280\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fsm\&quot; value=\&quot;&amp;lt;b&amp;gt;Inquiry FSM&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[таблица переходов = app/fsm.py; LangGraph — только если измерено, что без него хуже (ADR-200)]&amp;lt;br&amp;gt;INIT → CLASSIFIED → FILLING → DRAFT_READY → AWAITING_CONFIRMATION → SUBMITTED → COMPLETED. События: classify, fill, finalize_draft, request_confirm, submit, reject, complete. Недопустимый переход отклоняется. &amp;lt;b&amp;gt;Draft Validator&amp;lt;/b&amp;gt; — не отдельный бокс: на переходе finalize_draft черновик проверяется на полноту обязательных слотов (full_name, account_number, reason). &amp;lt;b&amp;gt;Слоты&amp;lt;/b&amp;gt; — поле состояния (SessionState.slots), не компонент\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1280\&quot; y=\&quot;300\&quot; width=\&quot;620\&quot; height=\&quot;280\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;hitl\&quot; value=\&quot;&amp;lt;b&amp;gt;HITL Gate&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[app/adapters/base.py + Intent]&amp;lt;br&amp;gt;Состояние AWAITING_CONFIRMATION. Без явного подтверждения абонента (признак Intent или кнопки, не текст реплики) ни один инструмент записи не вызывается. Проверка привязки subscriber_id к сессии на каждом write-шаге — защита Spoofing / IDOR (шаг 25)\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;640\&quot; y=\&quot;700\&quot; width=\&quot;600\&quot; height=\&quot;260\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;audit\&quot; value=\&quot;&amp;lt;b&amp;gt;Audit Writer&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[SessionState.record()]&amp;lt;br&amp;gt;Кто, что, когда, Idempotency-Key (шаг 36). Только идентификаторы и имена полей — не значения ПДн. Отказ абонента пишется тоже, с пометкой, что запись не выполнялась (шаг 43)\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1280\&quot; y=\&quot;700\&quot; width=\&quot;620\&quot; height=\&quot;260\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note_form\&quot; value=\&quot;&amp;lt;b&amp;gt;Form Agent&amp;lt;/b&amp;gt; (сбор недостающих слотов, формулировка вопроса абоненту) — Этап 2, НЕ реализован; это единственный компонент оркестратора, которому нужна модель. На прототипе все три обязательных слота известны из профиля Биллинга и текста вопроса, форма не нужна, и оркестратор модель не вызывает.\&quot; style=\&quot;rounded=1;arcSize=6;whiteSpace=wrap;html=1;fillColor=#FDF6E7;strokeColor=#D9A400;fontColor=#7A5C00;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;640\&quot; y=\&quot;990\&quot; width=\&quot;1260\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;store\&quot; value=\&quot;&amp;lt;b&amp;gt;Session State Store&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Redis / PostgreSQL]&amp;lt;br&amp;gt;Состояние FSM, слоты, черновики, аудит-лог. На прототипе — Redis без диска, TTL 30 мин\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=14;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2100\&quot; y=\&quot;260\&quot; width=\&quot;440\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;docgen\&quot; value=\&quot;&amp;lt;b&amp;gt;Document Generator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Python]&amp;lt;br&amp;gt;Шаг 18–19: рендер документа по шаблону\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2100\&quot; y=\&quot;480\&quot; width=\&quot;440\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;billingad\&quot; value=\&quot;&amp;lt;b&amp;gt;Billing Adapter&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Go / Python]&amp;lt;br&amp;gt;Шаг 26–29: запись показаний в Биллинг через XML-RPC API\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2100\&quot; y=\&quot;640\&quot; width=\&quot;440\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;inqsrv\&quot; value=\&quot;&amp;lt;b&amp;gt;Сервис работы с обращениями&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Go / Python]&amp;lt;br&amp;gt;Шаг 30–35: регистрация обращения, аварийная заявка → Диспетчерская\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2100\&quot; y=\&quot;800\&quot; width=\&quot;440\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note1\&quot; value=\&quot;&amp;lt;b&amp;gt;Guardrails&amp;lt;/b&amp;gt; (ПДн / токсичность / groundedness ответа модели) живут в LLM Gateway и здесь НЕ дублируются — решение зафиксировано этой диаграммой. &amp;lt;b&amp;gt;Draft Validator внутри FSM&amp;lt;/b&amp;gt; — другая задача: готовность черновика к подтверждению, не проверка ответа модели.\&quot; style=\&quot;rounded=1;arcSize=6;whiteSpace=wrap;html=1;fillColor=#FDF6E7;strokeColor=#D9A400;fontColor=#7A5C00;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;1220\&quot; width=\&quot;820\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note2\&quot; value=\&quot;&amp;lt;b&amp;gt;Контейнер Этапа 2.&amp;lt;/b&amp;gt; Разворачивается на MVP после метрик Этапа 1 (stage-gating, ADR-600). Диаграмма проектная, не отражает работающий код. На прототипе роль Scenario Controller несёт app/backend/registration.py, живой путь записи — регистрация обращения через Сервис работы с обращениями; Billing Adapter и Document Generator написаны, но не вызываются.\&quot; style=\&quot;rounded=1;arcSize=6;whiteSpace=wrap;html=1;fillColor=#FDF6E7;strokeColor=#D9A400;fontColor=#7A5C00;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;920\&quot; y=\&quot;1220\&quot; width=\&quot;820\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note3\&quot; value=\&quot;&amp;lt;b&amp;gt;Состав.&amp;lt;/b&amp;gt; Десять исходных узлов сведены в четыре: Triage и Advisor — в Backend; Tool Router → Scenario Controller; Draft Validator и Slot Store → Inquiry FSM; Form Agent — в ноте.\&quot; style=\&quot;rounded=1;arcSize=6;whiteSpace=wrap;html=1;fillColor=#FDF6E7;strokeColor=#D9A400;fontColor=#7A5C00;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1780\&quot; y=\&quot;1220\&quot; width=\&quot;760\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;g1\&quot; value=\&quot;3. Делегирование сценария&amp;lt;br&amp;gt;[Internal HTTP]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.33;entryX=0;entryY=0.22;\&quot; parent=\&quot;1\&quot; source=\&quot;backend\&quot; target=\&quot;sc\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;120\&quot; y=\&quot;-75\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;g2\&quot; value=\&quot;37. ID заявки, подразделение, статус, следующие шаги\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0;exitY=0.43;entryX=1;entryY=0.67;\&quot; parent=\&quot;1\&quot; source=\&quot;sc\&quot; target=\&quot;backend\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;60\&quot; y=\&quot;80\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;g3\&quot; value=\&quot;Промпт роли Form (Этап 2), цель — сбор слотов\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;dashed=1;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0;exitY=0.79;entryX=1;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;sc\&quot; target=\&quot;llmgw\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;-210\&quot; y=\&quot;130\&quot; as=\&quot;offset\&quot; /&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;520\&quot; y=\&quot;520\&quot; /&gt;&lt;mxPoint x=\&quot;520\&quot; y=\&quot;660\&quot; /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;g4\&quot; value=\&quot;Создать и вести состояние\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.3;entryX=0;entryY=0.3;\&quot; parent=\&quot;1\&quot; source=\&quot;sc\&quot; target=\&quot;fsm\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint y=\&quot;-115\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;g5\&quot; value=\&quot;Состояние FSM, слоты, черновики&amp;lt;br&amp;gt;[Redis / SQL]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.22;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;fsm\&quot; target=\&quot;store\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;-70\&quot; y=\&quot;-80\&quot; as=\&quot;offset\&quot; /&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;2020\&quot; y=\&quot;362\&quot; /&gt;&lt;mxPoint x=\&quot;2020\&quot; y=\&quot;340\&quot; /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;g6\&quot; value=\&quot;18. Рендер документа\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.27;exitY=1;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;sc\&quot; target=\&quot;docgen\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint y=\&quot;-20\&quot; as=\&quot;offset\&quot; /&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;800\&quot; y=\&quot;660\&quot; /&gt;&lt;mxPoint x=\&quot;1920\&quot; y=\&quot;660\&quot; /&gt;&lt;mxPoint x=\&quot;1920\&quot; y=\&quot;540\&quot; /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;g7\&quot; value=\&quot;26. Запись операции (после HITL)\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.27;exitY=1;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;sc\&quot; target=\&quot;billingad\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint y=\&quot;-20\&quot; as=\&quot;offset\&quot; /&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxP
