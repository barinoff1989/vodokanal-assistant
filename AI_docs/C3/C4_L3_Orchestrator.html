<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;toolbar&quot;: &quot;pages zoom layers lightbox&quot;, &quot;page&quot;: 0, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;app.diagrams.net\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;C4 L3 — Agent Orchestrator\&quot; name=\&quot;C4 L3 — Agent Orchestrator\&quot;&gt;&lt;mxGraphModel dx=\&quot;1400\&quot; dy=\&quot;900\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;2280\&quot; pageHeight=\&quot;1560\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;ttl\&quot; value=\&quot;C4 Level 3 — Компоненты: Agent Orchestrator\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=20;fontStyle=1;fontColor=#1A1A1A;whiteSpace=wrap;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;20\&quot; width=\&quot;2200\&quot; height=\&quot;34\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sub\&quot; value=\&quot;Этап 2. FSM жизненного цикла обращения, сбор слотов, черновик, HITL-гейт и вызов инструментов. Соответствует диаграмме последовательностей Этапа 2 (шаги 3–46).\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=12;fontColor=#4D4D4D;whiteSpace=wrap;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;56\&quot; width=\&quot;2200\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;bnd\&quot; value=\&quot;Agent Orchestrator&amp;amp;nbsp; [Контейнер: Python, Этап 2]\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F7F9FB;strokeColor=#4D4D4D;strokeWidth=2;dashed=1;verticalAlign=top;align=left;spacingLeft=14;spacingTop=8;fontSize=15;fontStyle=1;fontColor=#4D4D4D;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;380\&quot; y=\&quot;150\&quot; width=\&quot;1480\&quot; height=\&quot;1160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;backend\&quot; value=\&quot;&amp;lt;b&amp;gt;API Gateway / Backend&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Go / Python FastAPI]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Делегирует сценарий (шаг 3); отдаёт ретривал для Advisor (шаг 7)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;300\&quot; width=\&quot;260\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;gw\&quot; value=\&quot;&amp;lt;b&amp;gt;LLM Gateway&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Python / LiteLLM]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Промпты LLM-ролей: Triage, Advisor, Form&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1930\&quot; y=\&quot;300\&quot; width=\&quot;280\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sess\&quot; value=\&quot;&amp;lt;b&amp;gt;Session State Store&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Redis / PostgreSQL]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Состояние FSM, слоты, аудит-лог&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1930\&quot; y=\&quot;500\&quot; width=\&quot;280\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;docgen\&quot; value=\&quot;&amp;lt;b&amp;gt;Document Generator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Python]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Шаг 18–19: рендер документа&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1930\&quot; y=\&quot;700\&quot; width=\&quot;280\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;badapter\&quot; value=\&quot;&amp;lt;b&amp;gt;Billing Adapter&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Go/Python]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Шаг 26–29: запись в Биллинг&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1930\&quot; y=\&quot;870\&quot; width=\&quot;280\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;inqsvc\&quot; value=\&quot;&amp;lt;b&amp;gt;Сервис работы с обращениями&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Go/Python]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Шаг 30–35: регистрация, статусы&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1930\&quot; y=\&quot;1040\&quot; width=\&quot;280\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ctl\&quot; value=\&quot;&amp;lt;b&amp;gt;Scenario Controller&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Python, точка входа]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Принимает делегирование от Backend, ведёт сценарий обращения, возвращает результат (ID заявки, подразделение, статус, следующие шаги — шаг 37)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;430\&quot; y=\&quot;230\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fsm\&quot; value=\&quot;&amp;lt;b&amp;gt;Inquiry FSM&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[transitions (кандидат на LangGraph StateGraph)]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;INIT → CLASSIFIED → FILLING → DRAFT_READY → AWAITING_CONFIRMATION → SUBMITTED → COMPLETED. Переходы: classify, fill, finalize_draft, request_confirm, submit, complete. Недопустимый переход отклоняется&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;430\&quot; y=\&quot;430\&quot; width=\&quot;300\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;triage\&quot; value=\&quot;&amp;lt;b&amp;gt;Triage Agent&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[LLM-роль через Gateway]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;inquiry_type + confidence (шаги 5–6). Единая таксономия, 10 canonical-кодов (раздел 9.3). При недоступности LLM — keyword-режим&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;800\&quot; y=\&quot;230\&quot; width=\&quot;290\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;advisor\&quot; value=\&quot;&amp;lt;b&amp;gt;Advisor Agent&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[LLM-роль через Gateway]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Консультация по найденному контексту (шаги 7–8). Ретривал не делает сам — запрашивает у Backend (правило 4.1)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;800\&quot; y=\&quot;430\&quot; width=\&quot;290\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;form\&quot; value=\&quot;&amp;lt;b&amp;gt;Form Agent&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[LLM-роль через Gateway]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Определяет недостающие слоты (шаги 9–10), формулирует вопрос абоненту&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;800\&quot; y=\&quot;620\&quot; width=\&quot;290\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;slots\&quot; value=\&quot;&amp;lt;b&amp;gt;Slot Store&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[in-memory + Session State]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;full_name, account_number, phone, email, address, reason, extra. Обязательные: full_name, account_number, reason&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;800\&quot; y=\&quot;790\&quot; width=\&quot;290\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;draftval\&quot; value=\&quot;&amp;lt;b&amp;gt;Draft Validator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[правила, без LLM]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Полнота обязательных слотов и корректность черновика ДО показа абоненту. Не путать с Guardrails в LLM Gateway: там проверяется ответ модели (ПДн, токсичность, groundedness), здесь — готовность черновика к HITL&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1170\&quot; y=\&quot;430\&quot; width=\&quot;300\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;hitl\&quot; value=\&quot;&amp;lt;b&amp;gt;HITL Gate&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[правило 4.7]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Состояние AWAITING_CONFIRMATION. Без подтверждения абонента ни один write-инструмент не вызывается. Проверка привязки subscriber_id к сессии на каждом write-шаге (шаг 25 — защита Spoofing / IDOR)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1170\&quot; y=\&quot;680\&quot; width=\&quot;300\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;tools\&quot; value=\&quot;&amp;lt;b&amp;gt;Tool Router&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[function-calling]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Вызов инструментов после HITL: Document Generator, Billing Adapter, Сервис работы с обращениями. Генерация и проброс Idempotency-Key&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1540\&quot; y=\&quot;430\&quot; width=\&quot;290\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;audit\&quot; value=\&quot;&amp;lt;b&amp;gt;Audit Writer&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[запись в Session State]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Кто, что, когда, Idempotency-Key (шаг 36). Отказ абонента пишется тоже — с пометкой, что write не выполнялся (шаг 43)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1540\&quot; y=\&quot;700\&quot; width=\&quot;290\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;o1\&quot; value=\&quot;3. Делегирование сценария&amp;lt;br&amp;gt;[Internal HTTP]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.3;entryX=0;entryY=0.3;\&quot; parent=\&quot;1\&quot; source=\&quot;backend\&quot; target=\&quot;ctl\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;o2\&quot; value=\&quot;37. ID заявки, подразделение,&amp;lt;br&amp;gt;статус, следующие шаги\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0;exitY=0.75;entryX=1;entryY=0.75;\&quot; parent=\&quot;1\&quot; source=\&quot;ctl\&quot; target=\&quot;backend\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;o3\&quot; value=\&quot;Создать и вести состояние (шаг 4)\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;ctl\&quot; target=\&quot;fsm\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;o4\&quot; value=\&quot;classify\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.15;entryX=0;entryY=0.7;\&quot; parent=\&quot;1\&quot; source=\&quot;fsm\&quot; target=\&quot;triage\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;o5\&quot; value=\&quot;консультация\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.45;entryX=0;entryY=0.4;\&quot; parent=\&quot;1\&quot; source=\&quot;fsm\&quot; target=\&quot;advisor\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;o6\&quot; value=\&quot;fill — сбор слотов\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.85;entryX=0;entryY=0.4;\&quot; parent=\&quot;1\&quot; source=\&quot;fsm\&quot; target=\&quot;form\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;o7\&quot; value=\&quot;17. Сохранить слот\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;form\&quot; target=\&quot;slots\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;o8\&quot; value=\&quot;Слоты на проверку\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.3;entryX=0.5;entryY=1;\&quot; parent=\&quot;1\&quot; source=\&quot;slots\&quot; target=\&quot;draftval\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1320\&quot; y=\&quot;860\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;o9\&quot; value=\&quot;finalize_draft → request_confirm&amp;lt;br&amp;gt;(черновик полон)\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontCol
