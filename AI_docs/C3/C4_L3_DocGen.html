ml=1;fillColor=#F7F9FB;strokeColor=#4D4D4D;strokeWidth=2;dashed=1;dashPattern=8 6;verticalAlign=top;align=left;spacingLeft=14;spacingTop=8;fontSize=15;fontStyle=1;fontColor=#4D4D4D;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;380\&quot; y=\&quot;150\&quot; width=\&quot;900\&quot; height=\&quot;430\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;orch\&quot; value=\&quot;&amp;lt;b&amp;gt;Agent Orchestrator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Python] Шаг 18: заполнение и рендер по шаблону (Этап 2). На прототипе путь template ведёт Response Router&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;260\&quot; width=\&quot;260\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;templates\&quot; value=\&quot;&amp;lt;b&amp;gt;Реестр форм&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[файловое хранилище] Шаблоны по типу обращения (источник 8), устав, оферта, типовые формы. На прототипе — 7 образцов по ПП РФ 644/776 в app/documents/templates.py&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1360\&quot; y=\&quot;200\&quot; width=\&quot;300\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;store\&quot; value=\&quot;&amp;lt;b&amp;gt;Объектное хранилище&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[S3 / MinIO — целевое] На прототипе не развёрнут: роль играет каталог процесса .documents/&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1360\&quot; y=\&quot;400\&quot; width=\&quot;300\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fill\&quot; value=\&quot;&amp;lt;b&amp;gt;Template Fill&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[app/documents/templates.py + responder.py] Выбор образца по inquiry_type; подстановка из Биллинга по ЛС (ФИО, счёт, адрес, данные счётчика); проверка обязательных полей; недостающие ассистент спрашивает по одному (FSM, без модели). Путь Этапа 1 — HITL не применяется&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;430\&quot; y=\&quot;230\&quot; width=\&quot;400\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;artifact\&quot; value=\&quot;&amp;lt;b&amp;gt;Artifact&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[app/documents/artifact.py] render_html — лист под A4 с кнопкой «Печать» (не PDF: браузер печатает сам). ArtifactStore — каталог .documents/, токен в пути вместо presigned-URL, TTL 24 ч. best-effort. Ссылка уходит в document_url&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;900\&quot; y=\&quot;230\&quot; width=\&quot;340\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_fold\&quot; value=\&quot;[v4.53] Свёрнуто 5 → 2. В Template Fill влиты Render API + Template Registry + Field Validator; в Artifact — Renderer + Artifact Store Client.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#B85450;whiteSpace=wrap;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;380\&quot; y=\&quot;600\&quot; width=\&quot;900\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_f4\&quot; value=\&quot;Находка F4 (раздел 25.1) закрыта на прототипе для темы template: render_html → ArtifactStore → document_url → маршрут стенда /documents/{token} → Document Panel виджета. Не PDF и не S3 — область MVP. Адаптер Этапа 2 app/adapters/document_generator.py (запись в S3 после HITL) остаётся заглушкой.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#B85450;whiteSpace=wrap;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;380\&quot; y=\&quot;645\&quot; width=\&quot;900\&quot; height=\&quot;55\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d1\&quot; value=\&quot;18. заполнение и рендер&amp;lt;br&amp;gt;(Этап 2)&amp;lt;br&amp;gt;[Internal HTTP]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;dashed=1;exitX=1;exitY=0.3;entryX=0;entryY=0.3;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;orch\&quot; target=\&quot;fill\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d2\&quot; value=\&quot;19–20. готовый документ: файл или ссылка\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;dashed=1;exitX=0;exitY=0.85;entryX=1;entryY=0.8;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;artifact\&quot; target=\&quot;orch\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;360\&quot; y=\&quot;360\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d3\&quot; value=\&quot;загрузка шаблона по типу&amp;lt;br&amp;gt;[чтение]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.3;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;fill\&quot; target=\&quot;templates\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1300\&quot; y=\&quot;270\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d4\&quot; value=\&quot;готовый текст бланка\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;fill\&quot; target=\&quot;artifact\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d5\&quot; value=\&quot;сохранить + отдать ссылку&amp;lt;br&amp;gt;[на прототипе — запись в .documents/]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; e
