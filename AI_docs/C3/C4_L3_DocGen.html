<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;toolbar&quot;: &quot;pages zoom layers lightbox&quot;, &quot;page&quot;: 0, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;app.diagrams.net\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;C4 L3 — Document Generator\&quot; name=\&quot;C4 L3 — Document Generator\&quot;&gt;&lt;mxGraphModel dx=\&quot;1400\&quot; dy=\&quot;900\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;1900\&quot; pageHeight=\&quot;1080\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;ttl\&quot; value=\&quot;C4 Level 3 — Компоненты: Document Generator\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=20;fontStyle=1;fontColor=#1A1A1A;whiteSpace=wrap;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;20\&quot; width=\&quot;1820\&quot; height=\&quot;34\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sub\&quot; value=\&quot;Этап 2. Заполнение шаблона обращения данными из слотов и выдача готового документа абоненту. Закрывает находку F4 (раздел 25.1) — у документа есть путь доставки.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=12;fontColor=#4D4D4D;whiteSpace=wrap;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;56\&quot; width=\&quot;1820\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;bnd\&quot; value=\&quot;Document Generator&amp;amp;nbsp; [Контейнер: Python, Этап 2]\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F7F9FB;strokeColor=#4D4D4D;strokeWidth=2;dashed=1;verticalAlign=top;align=left;spacingLeft=14;spacingTop=8;fontSize=15;fontStyle=1;fontColor=#4D4D4D;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;380\&quot; y=\&quot;150\&quot; width=\&quot;1080\&quot; height=\&quot;700\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;orch\&quot; value=\&quot;&amp;lt;b&amp;gt;Agent Orchestrator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Python]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Шаг 18: заполнение и рендер документа по шаблону&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;300\&quot; width=\&quot;260\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;templates\&quot; value=\&quot;&amp;lt;b&amp;gt;Реестр договоров и типовые формы&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система — файловое хранилище]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Шаблоны по типу обращения (источник 8), устав, оферта, типовые формы Word/PDF (источник 12)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1540\&quot; y=\&quot;300\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;store\&quot; value=\&quot;&amp;lt;b&amp;gt;Объектное хранилище&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[S3 / MinIO]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Готовые документы. То же хранилище, что Data Lake (раздел 31)&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1540\&quot; y=\&quot;560\&quot; width=\&quot;300\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;api\&quot; value=\&quot;&amp;lt;b&amp;gt;Render API&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Python, точка входа]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Принимает inquiry_type + слоты от оркестратора, возвращает файл или ссылку (шаги 19–20). Вызывается только после HITL — собственного пути записи не имеет&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;430\&quot; y=\&quot;230\&quot; width=\&quot;300\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;registry\&quot; value=\&quot;&amp;lt;b&amp;gt;Template Registry&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[выбор по inquiry_type]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Сопоставляет тип обращения шаблону из 10 canonical-кодов (раздел 9.3). Версия шаблона фиксируется в метаданных документа&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;800\&quot; y=\&quot;230\&quot; width=\&quot;300\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;validator\&quot; value=\&quot;&amp;lt;b&amp;gt;Field Validator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[правила, без LLM]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Проверяет обязательные поля шаблона до рендера: full_name, account_number, reason (раздел 10). Недостача — ошибка оркестратору, не пустой документ&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;430\&quot; y=\&quot;450\&quot; width=\&quot;300\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;renderer\&quot; value=\&quot;&amp;lt;b&amp;gt;Renderer&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[шаблонизатор + PDF/HTML]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Подстановка значений слотов, рендер в PDF или HTML, валидация результата&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;800\&quot; y=\&quot;450\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;artifact\&quot; value=\&quot;&amp;lt;b&amp;gt;Artifact Store Client&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[S3-клиент]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Сохраняет документ, отдаёт ссылку с ограниченным сроком жизни&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fontSize=12;verticalAlign=top;spacingTop=6;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1150\&quot; y=\&quot;450\&quot; width=\&quot;280\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d1\&quot; value=\&quot;18. Заполнение и рендер&amp;lt;br&amp;gt;[Internal HTTP]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.3;entryX=0;entryY=0.3;\&quot; parent=\&quot;1\&quot; source=\&quot;orch\&quot; target=\&quot;api\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d2\&quot; value=\&quot;19–20. Готовый документ:&amp;lt;br&amp;gt;файл или ссылка\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0;exitY=0.8;entryX=1;entryY=0.8;\&quot; parent=\&quot;1\&quot; source=\&quot;api\&quot; target=\&quot;orch\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d3\&quot; value=\&quot;Тип обращения\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.4;entryX=0;entryY=0.4;\&quot; parent=\&quot;1\&quot; source=\&quot;api\&quot; target=\&quot;registry\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d4\&quot; value=\&quot;Загрузка шаблона&amp;lt;br&amp;gt;[Файловый доступ, чтение]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.4;entryX=0;entryY=0.4;\&quot; parent=\&quot;1\&quot; source=\&quot;registry\&quot; target=\&quot;templates\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d5\&quot; value=\&quot;Слоты на проверку\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;api\&quot; target=\&quot;validator\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d6\&quot; value=\&quot;Поля полны\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;validator\&quot; target=\&quot;renderer\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d7\&quot; value=\&quot;Готовый файл\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;renderer\&quot; target=\&quot;artifact\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d8\&quot; value=\&quot;Сохранить документ&amp;lt;br&amp;gt;[S3 API]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.3;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;artifact\&quot; target=\&quot;store\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;d9\&quot; value=\&quot;Ссылка на документ\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=0;entryX=0.9;entryY=1;\&quot; parent=\&quot;1\&quot; source=\&quot;artifact\&quot; target=\&quot;api\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1290\&quot; y=\&quot;420\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_f4\&quot; value=\&quot;Находка F4 (раздел 25.1): на L2 у Document Generator не было исходящего ребра — не показано, как документ доходит до абонента. Здесь путь явный: Renderer → Artifact Store → ссылка → оркестратор → Backend → виджет (шаг 20 sequence).\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#B85450;whiteSpace=wrap;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;430\&quot; y=\&quot;890\&quot; width=\&quot;900\&quot; height=\&quot;80\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_assume\&quot; value=\&quot;ПРЕДПОЛОЖЕНИЕ: хранилище готовых документов и срок жизни ссылки в контексте не заданы. Взято S3/MinIO как уже принятая в проекте технология (раздел 31). Требует подтверждения.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#B85450;whiteSpace=wrap;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;430\&quot; y=\&quot;990\&quot; width=\&quot;900\&quot; height=\&quot;60\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;&quot;}"></div>
