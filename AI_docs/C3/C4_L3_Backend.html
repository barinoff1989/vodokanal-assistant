<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;toolbar&quot;: &quot;pages zoom layers lightbox&quot;, &quot;page&quot;: 0, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;app.diagrams.net\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;c4-l3-backend\&quot; name=\&quot;C3 — API Gateway / Backend\&quot;&gt;&lt;mxGraphModel dx=\&quot;1400\&quot; dy=\&quot;1080\&quot; grid=\&quot;0\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;2120\&quot; pageHeight=\&quot;1440\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;ttl\&quot; value=\&quot;C4 Level 3 — Компоненты: API Gateway / Backend\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=20;fontStyle=1;fontColor=#1A1A1A;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;24\&quot; width=\&quot;1700\&quot; height=\&quot;32\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sub\&quot; value=\&quot;По правилу 4.1 контейнера AI Service нет — вся RAG-логика здесь. Свёрнуто до семи компонентов (v4.53): бокс остаётся, только если это отдельная работа с кодом на прототипе; модуль-справочник, внутрипроцессный вызов и ненаписанная заглушка — в ноты и на рёбра.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=12;fontColor=#4D4D4D;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;58\&quot; width=\&quot;1820\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;boundary\&quot; value=\&quot;Контейнер: API Gateway / Backend  [Go / Python FastAPI]\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F7F9FB;strokeColor=#4D4D4D;strokeWidth=2;dashed=1;dashPattern=8 6;verticalAlign=top;align=left;spacingLeft=14;spacingTop=8;fontSize=15;fontStyle=1;fontColor=#4D4D4D;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;250\&quot; width=\&quot;1560\&quot; height=\&quot;980\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;widget\&quot; value=\&quot;&amp;lt;b&amp;gt;AI-виджет в ЛК&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Контейнер: React/TS]&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;90\&quot; y=\&quot;120\&quot; width=\&quot;280\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;gw\&quot; value=\&quot;&amp;lt;b&amp;gt;LLM Gateway&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Контейнер: Python/LiteLLM] Quota → PII Sanitizer → LiteLLM → Guardrails&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1690\&quot; y=\&quot;300\&quot; width=\&quot;300\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;orch\&quot; value=\&quot;&amp;lt;b&amp;gt;Agent Orchestrator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Контейнер: Python, Этап 2] На прототипе к шлюзу не обращается&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;dashed=1;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1690\&quot; y=\&quot;450\&quot; width=\&quot;300\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;stores\&quot; value=\&quot;&amp;lt;b&amp;gt;Session State + Quota Store&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Redis / PostgreSQL] Состояние диалога, слоты, аудит; счётчики квот; таблица обращений&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1690\&quot; y=\&quot;580\&quot; width=\&quot;300\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;refsys\&quot; value=\&quot;&amp;lt;b&amp;gt;Биллинг · Диспетчерская · тарифы&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Внешние системы] Биллинг — XML-RPC; Диспетчерская — REST; тарифы — файл. На прототипе всё читается из файлов при старте (раздел 75.6)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1690\&quot; y=\&quot;730\&quot; width=\&quot;300\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ch\&quot; value=\&quot;&amp;lt;b&amp;gt;ClickHouse · Prometheus&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Аналитика / метрики] Prometheus :9100; usage_events (Postgres на прототипе)&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1690\&quot; y=\&quot;890\&quot; width=\&quot;300\&quot; height=\&quot;100\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;vdb\&quot; value=\&quot;&amp;lt;b&amp;gt;Vector DB — Qdrant&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Целевое] На прототипе не развёрнут: корпус в памяти (ADR-006, 75.6)&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;dashed=1;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;300\&quot; y=\&quot;1270\&quot; width=\&quot;300\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;infer\&quot; value=\&quot;&amp;lt;b&amp;gt;Embedding · Reranker Inference&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[TEI/vLLM, GPU — целевое] На прототипе: e5-small на CPU в процессе, реранжинга нет (ADR-014). Один вызов на два потребителя в процессе Backend — поиск и запасной классификатор темы (v4.55)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#D79B00;strokeColor=#B57E00;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;dashed=1;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;660\&quot; y=\&quot;1270\&quot; width=\&quot;340\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;api\&quot; value=\&quot;&amp;lt;b&amp;gt;HTTP API Layer  ·  SSE Streamer&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[FastAPI] POST /v1/generate, GET /v1/healthz (4.4); /v1/ версионирование (4.6); RFC 7807 на всех ошибках (4.5); валидация query ≤ 2000, system обязателен. Поток token/metadata/done/error без буферизации (4.3)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;110\&quot; y=\&quot;330\&quot; width=\&quot;440\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;triage\&quot; value=\&quot;&amp;lt;b&amp;gt;Triage&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[правила + запасной k-NN по эмбеддингам] topic (путь ответа) + inquiry_type (регистрация, метрика). Тему определяют правила — решают, звать ли модель; правила молчат ⇒ запасной классификатор (v4.55): близость к размеченным примерам той же моделью, что Knowledge Base Search — не генерация, вторая копия весов не грузится. LLM-режим для inquiry_type (Этап 2) не написан&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;590\&quot; y=\&quot;330\&quot; width=\&quot;430\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;metrics\&quot; value=\&quot;&amp;lt;b&amp;gt;Metrics Emitter&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[prometheus_client] 14 метрик по конвенции дашборда (раздел 37) на отдельном порту 9100: TTFT, latency, токены, блокировки с разбивкой по причине, разбивка по inquiry_type&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1060\&quot; y=\&quot;330\&quot; width=\&quot;510\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;router\&quot; value=\&quot;&amp;lt;b&amp;gt;Response Router&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[протокол DirectResponder] По теме выбирает путь. &amp;lt;b&amp;gt;Пять прямых ответчиков без модели:&amp;lt;/b&amp;gt; outage — график отключений по адресу из Биллинга (ADR-013); water_quality — регламентная формулировка (ADR-012); tariff — таблица тарифов по дате; account — факты лицевого счёта, спор «почему столько» не берёт; template — семь образцов заявлений по ПП РФ 644/776, готовый бланк отдаётся ссылкой на лист для печати (v4.53). Предметная логика — в самих ответчиках (правило 4.1). Иначе — RAG-путь. Сборка промпта (system + query + context) — здесь и в шлюзе, отдельного Prompt Builder нет&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;110\&quot; y=\&quot;530\&quot; width=\&quot;1460\&quot; height=\&quot;190\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;kb\&quot; value=\&quot;&amp;lt;b&amp;gt;Knowledge Base Search&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[ядро RAG — правило 4.1] Эмбеддинг запроса → косинус по корпусу → порог score_threshold=0.872 → top_n=3 в промпт. Пустая выдача ⇒ ответ без модели с телефоном контакт-центра (Advisor, раздел 8.2). &amp;lt;b&amp;gt;Целевое:&amp;lt;/b&amp;gt; top_k=20 + payload-фильтр inquiry_type + реранжинг top_n=3, Qdrant + Embedding/Reranker Inference. &amp;lt;b&amp;gt;Прототип:&amp;lt;/b&amp;gt; e5-small в памяти, без реранжинга (ADR-014). Тот же эмбеддер переиспользует запасной классификатор темы Triage (v4.55)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;110\&quot; y=\&quot;760\&quot; width=\&quot;900\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sessc\&quot; value=\&quot;&amp;lt;b&amp;gt;Session &amp;amp; Quota Client&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Redis protocol / SQL] Состояние диалога между репликами, слоты, черновик, аудит (Redis; недоступен ⇒ «сессии нет», не 503 — путь записи закрывается сам). Квоты на абонента/сессию/сервис (Redis; недоступны ⇒ 503, ADR-008). Регистрация обращения — таблица в Postgres (ADR-009)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1040\&quot; y=\&quot;760\&quot; width=\&quot;530\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;refdata\&quot; value=\&quot;&amp;lt;b&amp;gt;Reference Data&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[чтение источников-слепков] Профиль абонента, счета, счётчики, начисления (Биллинг); график плановых отключений; таблица тарифов. Адрес абонента для пути outage резолвится здесь по ЛС (v4.53). &amp;lt;b&amp;gt;Целевое:&amp;lt;/b&amp;gt; XML-RPC/REST + кэш профиля Postgres MV + Redis (Feature Store без платформы, раздел 32). &amp;lt;b&amp;gt;Прототип:&amp;lt;/b&amp;gt; чтение файлов при старте, в памяти&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;110\&quot; y=\&quot;965\&quot; width=\&quot;900\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_tax\&quot; value=\&quot;Канонический справочник — app/taxonomy.py: две оси ADR-011 (topic — путь ответа, inquiry_type — регистрация), parse/coerce (значение вне справочника не выйдет — правило 4.8), нормализация strip().lower(). Общий импорт всех компонентов, не отдельный узел — свёрнут как Billing Callback на C4_L3_LLM.  ·  Auth &amp;amp; Session Middleware [SSO-клиент ЛК] — целевое: на прототипе кабинета нет, subscriber_id из метаданных; написана только привязка session_id ↔ subscriber_id в Session Client (Spoofing/IDOR, раздел 13).\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#B85450;whiteSpace=wrap;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;110\&quot; y=\&quot;1130\&quot; width=\&quot;1460\&quot; height=\&quot;55\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_fold\&quot; value=\&quot;[v4.53] Свёрнуто 17 → 7. В Knowledge Base Search влиты Retrieval Orchestrator + Embedding/Vector/Reranker Client + Fallback Handler; в Reference Data — External Read Clients + Subscriber Profile Cache; SSE Streamer — в HTTP API Layer. Prompt Builder и LLM Gateway Client — на рёбрах (сборка промпта; внутрипроцессный вызов). PII-фильтра здесь нет (правило 4.2, он в LLM Gateway).  ·  Открытый P1: привязка subscriber_id к сессии на каждом write-шаге Этапа 2 не реализована.  ·  Диаграмма — целевое устройство; сверка с кодом — пункт 77 TODO.  ·  [v4.55] Triage: запасной классификатор темы — k-NN по эмбеддингам, не новый бокс (переиспользует эмбеддер Knowledge Base Search).\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#B85450;whiteSpace=wrap;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;110\&quot; y=\&quot;1190\&quot; width=\&quot;1460\&quot; height=\&quot;55\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e1\&quot; value=\&quot;Запрос абонента&amp;lt;br&amp;gt;[HTTPS / JSON]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=1;entryX=0.15;entryY=0;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;widget\&quot; target=\&quot;api\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e2\&quot; value=\&quot;SSE-стрим: token / metadata / done / error&amp;lt;br&amp;gt;[text/event-stream]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0;exitY=0.25;entryX=0.85;entryY=1;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;api\&quot; target=\&quot;widget\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;70\&quot; y=\&quot;300\&quot;/&gt;&lt;mxPoint x=\&quot;70\&quot; y=\&quot;165\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e5\&quot; value=\&qu
