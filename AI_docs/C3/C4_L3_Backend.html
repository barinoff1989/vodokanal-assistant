<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;toolbar&quot;: &quot;pages zoom layers lightbox&quot;, &quot;page&quot;: 0, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;Electron\&quot; agent=\&quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) draw.io/29.0.3 Chrome/140.0.7339.249 Electron/38.7.0 Safari/537.36\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;c4l3be\&quot; name=\&quot;C4 Level 3 Backend\&quot;&gt;&lt;mxGraphModel dx=\&quot;3728\&quot; dy=\&quot;611\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;2700\&quot; pageHeight=\&quot;1930\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot; /&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot; /&gt;&lt;mxCell id=\&quot;title\&quot; value=\&quot;&amp;lt;b&amp;gt;C4 Level 3 — Компоненты: API Gateway / Backend&amp;lt;/b&amp;gt;\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=middle;whiteSpace=wrap;fontSize=20;fontColor=#16324F;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;20\&quot; width=\&quot;1400\&quot; height=\&quot;36\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;subtitle\&quot; value=\&quot;Отдельного контейнера AI Service нет — вся RAG-логика здесь. Семь компонентов: бокс есть, только если это отдельная работа с кодом на прототипе; модуль-справочник, внутрипроцессные вызовы и ненаписанные заглушки — в нотах и на рёбрах.\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=top;whiteSpace=wrap;fontSize=11;fontColor=#5A6B7B;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;60\&quot; width=\&quot;2000\&quot; height=\&quot;34\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;widget\&quot; value=\&quot;&amp;lt;b&amp;gt;AI-виджет в ЛК&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер]\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;140\&quot; y=\&quot;140\&quot; width=\&quot;320\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;boundary\&quot; value=\&quot;Контейнер: API Gateway / Backend [Go / Python FastAPI]\&quot; style=\&quot;rounded=1;arcSize=3;whiteSpace=wrap;html=1;fillColor=#F4F8FC;strokeColor=#5B8DB8;dashed=1;strokeWidth=2;align=left;verticalAlign=top;spacingTop=10;spacingLeft=14;fontSize=13;fontStyle=1;fontColor=#16324F;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;340\&quot; width=\&quot;1860\&quot; height=\&quot;1060\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;http\&quot; value=\&quot;&amp;lt;b&amp;gt;HTTP API Layer · SSE Streamer&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[FastAPI] POST /v1/generate, GET /v1/healthz; версионирование /v1; RFC 7807 на всех ошибках; валидация query ≤ 2000, system обязателен. Поток token/metadata/done/error без буферизации\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;140\&quot; y=\&quot;400\&quot; width=\&quot;540\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;triage\&quot; value=\&quot;&amp;lt;b&amp;gt;Triage&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[правила + запасной k-NN по эмбеддингам] topic (путь ответа) + inquiry_type (регистрация, метрика). Обе оси — правила решают, звать ли модель; правила молчат ⇒ запасной классификатор той же моделью, что Knowledge Base Search — не генерация, вторая копия весов не грузится: topic (все темы) и inquiry_type (только семь регистрируемых типов из шестнадцати — остальные девять на будущий этап). matched_by отдельно для каждой оси\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;720\&quot; y=\&quot;400\&quot; width=\&quot;560\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;metrics\&quot; value=\&quot;&amp;lt;b&amp;gt;Metrics Emitter&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[prometheus_client] 14 метрик по конвенции дашборда: TTFT, latency, токены, блокировки с разбивкой по причине, разбивка по inquiry_type\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1320\&quot; y=\&quot;400\&quot; width=\&quot;600\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;router\&quot; value=\&quot;&amp;lt;b&amp;gt;Response Router&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[протокол DirectResponder] По теме выбирает путь. &amp;lt;b&amp;gt;Пять прямых ответчиков без модели:&amp;lt;/b&amp;gt; outage — график отключений по адресу из Биллинга; water_quality — регламентная формулировка; tariff — таблица тарифов по дате; account — факты лицевого счёта, спор «почему столько» не берёт; template — семь образцов заявлений по ПП РФ 644/776, готовый бланк отдаётся ссылкой на лист для печати. Предметная логика — в самих ответчиках. Иначе — RAG-путь. Сборка промпта (system + query + context) — здесь и в llm-gateway, отдельного Prompt Builder нет\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;140\&quot; y=\&quot;680\&quot; width=\&quot;1780\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;kbsearch\&quot; value=\&quot;&amp;lt;b&amp;gt;Knowledge Base Search&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[ядро RAG] Эмбеддинг запроса → косинус по корпусу → порог score_threshold=0.872 → top_n=3 в промпт. Пустая выдача ⇒ ответ без модели с телефоном контакт-центра (Advisor). &amp;lt;b&amp;gt;Реализовано:&amp;lt;/b&amp;gt; top_k=20 + фильтр inquiry_type внутри поиска, Qdrant (gRPC) или корпус в памяти; e5-small на CPU. &amp;lt;b&amp;gt;Выключено:&amp;lt;/b&amp;gt; реранкинг top_n=3 (нужен GPU-узел, ADR-600). Тот же эмбеддер переиспользует запасной классификатор темы Triage\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;140\&quot; y=\&quot;950\&quot; width=\&quot;880\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sessclient\&quot; value=\&quot;&amp;lt;b&amp;gt;Session &amp;amp; Quota Client&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Redis protocol / SQL] Состояние диалога между репликами, слоты, черновики, аудит (Redis; недоступен ⇒ «сессии нет», не 503 — путь записи закрывается сам). Квоты на абонента/сессию/сервис (Redis; недоступен ⇒ 503). Регистрация обращения — таблица в Postgres\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1060\&quot; y=\&quot;950\&quot; width=\&quot;600\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;refdata\&quot; value=\&quot;&amp;lt;b&amp;gt;Reference Data&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[in-process источники-слепки] Профиль абонента, счета, счётчики, начисления (Биллинг); график плановых отключений; таблица тарифов. Адрес абонента для пути outage резолвится здесь по ЛС. &amp;lt;b&amp;gt;Целевое:&amp;lt;/b&amp;gt; клиенты XML-RPC/REST читают Биллинг и Диспетчерскую в момент вопроса, без предрасчёта; кэш Redis со сроком жизни в минуты — только после замера (решение 25.09.2026). &amp;lt;b&amp;gt;Прототип:&amp;lt;/b&amp;gt; чтение файлов при старте, в памяти\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;140\&quot; y=\&quot;1230\&quot; width=\&quot;1400\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;llmgw\&quot; value=\&quot;&amp;lt;b&amp;gt;LLM Gateway&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Python/LiteLLM]&amp;lt;br&amp;gt;Quota → PII Sanitizer → LiteLLM → Guardrails\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2200\&quot; y=\&quot;360\&quot; width=\&quot;460\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;docgen\&quot; value=\&quot;&amp;lt;b&amp;gt;Document Generator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер: Python, Этап 2]&amp;lt;br&amp;gt;На прототипе к шлюзу не обращается\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2200\&quot; y=\&quot;540\&quot; width=\&quot;460\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;store\&quot; value=\&quot;&amp;lt;b&amp;gt;Session State + Quota Store&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Redis / PostgreSQL]&amp;lt;br&amp;gt;Состояние диалога, слоты, аудит; счётчики квот; таблица обращений\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=14;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2200\&quot; y=\&quot;700\&quot; width=\&quot;460\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;billing\&quot; value=\&quot;&amp;lt;b&amp;gt;Биллинг · Диспетчерская · тарифы&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешние системы] Биллинг — XML-RPC; Диспетчерская — REST; тарифы — файл. На прототипе всё читается из файлов при старте\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#8A9BA8;strokeColor=#5F7182;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2200\&quot; y=\&quot;880\&quot; width=\&quot;460\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;clickhouse\&quot; value=\&quot;&amp;lt;b&amp;gt;Postgres (telemetry) · Prometheus&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Аналитика / метрики]&amp;lt;br&amp;gt;Prometheus :9100; usage_events в Postgres\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=14;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2200\&quot; y=\&quot;1060\&quot; width=\&quot;460\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;qdrant\&quot; value=\&quot;&amp;lt;b&amp;gt;Vector DB — Qdrant&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Реализовано] Docker compose (VECTOR_STORE=qdrant): клиент по gRPC :6334, переиндексация blue-green; без compose по умолчанию корпус в памяти\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=14;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;300\&quot; y=\&quot;1460\&quot; width=\&quot;420\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;embinf\&quot; value=\&quot;&amp;lt;b&amp;gt;Embedding · Reranker Inference&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[MVP: e5-small на CPU; TEI/vLLM на GPU — только по решению владельца] На прототипе: e5-small на CPU в процессе, реранкинга нет. Один вызов на два потребителя в процессе Backend — поиск и запасной классификатор темы\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#D99C00;strokeColor=#A67C00;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;780\&quot; y=\&quot;1460\&quot; width=\&quot;460\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note1\&quot; value=\&quot;&amp;lt;b&amp;gt;Канонический справочник&amp;lt;/b&amp;gt; — app/taxonomy.py: две оси (topic — путь ответа, inquiry_type — регистрация), parse/coerce (значение вне справочника не выйдет), нормализация strip().lower(). Общий импорт всех компонентов, не отдельный узел — свёрнут как Billing Callback на C4_L3_LLM. &amp;lt;b&amp;gt;Auth &amp;amp; Session Middleware&amp;lt;/b&amp;gt; [SSO-клиент ЛК] — целевое: на прототипе кабинета нет, subscriber_id из метаданных; написана только привязка session_id → subscriber_id в Session Client (Spoofing/IDOR).\&quot; style=\&quot;rounded=1;arcSize=6;whiteSpace=wrap;html=1;fillColor=#FDF6E7;strokeColor=#D9A400;fontColor=#7A5C00;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;140\&quot; y=\&quot;1640\&quot; width=\&quot;1240\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note2\&quot; value=\&quot;&amp;lt;b&amp;gt;Состав.&amp;lt;/b&amp;gt; В Knowledge Base Search входят Retrieval Orchestrator, Embedding/Vector/Reranker Client и Fallback Handler; в Reference Data — External Read Clients (данные абонента читаются в момент вопроса; кэш — после замера); SSE Streamer — часть HTTP API Layer. Prompt Builder и LLM Gateway Client — без рёбер (сборка промпта — внутрипроцессный вызов). PII-фильтра здесь нет (он в LLM Gateway). &amp;lt;b&amp;gt;Открыто P1:&amp;lt;/b&amp;gt; привязка subscriber_id к сессии на каждом write-шаге Этапа 2 не реализована. Диаграмма — целевое устройство. &amp;lt;b&amp;gt;Triage:&amp;lt;/b&amp;gt; запасной классификатор темы — k-NN по эмбеддингам, не новый бокс (переиспользует эмбеддер Knowledge Base Search); то же для inquiry_type — семь регистрируемых типов из шестнадцати, остальные девять — на будущий этап.\&quot; style=\&quot;rounded=1;arcSize=6;whiteSpace=wrap;html=1;fillColor=#FDF6E7;strokeColor=#D9A400;fontColor=#7A5C00;fontSize=10;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1420\&quot; y=\&quot;1640\&quot; width=\&quot;1240\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e1\&quot; value=\&quot;Запрос абонента&amp;lt;br&amp;gt;[HTTPS / JSON]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;widget\&quot; target=\&quot;http\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;120\&quot; y=\&quot;-40\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e2\&quot; value=\&quot;SSE-стрим: token / metadata / done / error&amp;lt;br&amp;gt;[text/event-stream]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.15;exitY=0;entryX=0.2;entryY=1;\&quot; parent=\&quot;1\&quot; source=\&quot;http\&quot; target=\&quot;widget\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;-160\&quot; y=\&quot;-40\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e3\&quot; value=\&quot;Нормализованный запрос\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;http\&quot; target=\&quot;triage\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint y=\&quot;-25\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e4\&quot; value=\&quot;topic + inquiry_type\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#5A6B7B;strokeWidth=1.5;fontColor=#16324F;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0
