<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;toolbar&quot;: &quot;pages zoom layers lightbox&quot;, &quot;page&quot;: 0, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;app.diagrams.net\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;C4 L3 — Billing Adapter\&quot; name=\&quot;C4 L3 — Billing Adapter\&quot;&gt;&lt;mxGraphModel dx=\&quot;1400\&quot; dy=\&quot;900\&quot; grid=\&quot;0\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;1620\&quot; pageHeight=\&quot;720\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;ttl\&quot; value=\&quot;C4 Level 3 — Компоненты: Billing Adapter\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=20;fontStyle=1;fontColor=#1A1A1A;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;20\&quot; width=\&quot;1540\&quot; height=\&quot;34\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sub\&quot; value=\&quot;Этап 2. Единственная точка записи в Биллинг — только после подтверждения абонента (4.7), с Idempotency-Key. Свёрнут до двух компонентов (v4.53); на прототипе заглушка.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=12;fontColor=#4D4D4D;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;56\&quot; width=\&quot;1540\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;bnd\&quot; value=\&quot;Billing Adapter  [Go/Python, Этап 2 — не вызывается на прототипе]\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F7F9FB;strokeColor=#4D4D4D;strokeWidth=2;dashed=1;dashPattern=8 6;verticalAlign=top;align=left;spacingLeft=14;spacingTop=8;fontSize=15;fontStyle=1;fontColor=#4D4D4D;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;380\&quot; y=\&quot;150\&quot; width=\&quot;780\&quot; height=\&quot;400\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;orch\&quot; value=\&quot;&amp;lt;b&amp;gt;Agent Orchestrator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Python] Шаг 26: запись операции после подтверждения&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;250\&quot; width=\&quot;260\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;billing\&quot; value=\&quot;&amp;lt;b&amp;gt;Биллинг&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Внешняя legacy-система] Лицевые счета, начисления, задолженность. Доступ — только через собственный XML-RPC API&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1240\&quot; y=\&quot;200\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;sess\&quot; value=\&quot;&amp;lt;b&amp;gt;Session State Store&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Redis / PostgreSQL] Аудит-лог операций&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1240\&quot; y=\&quot;400\&quot; width=\&quot;300\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;backend\&quot; value=\&quot;&amp;lt;b&amp;gt;API Gateway / Backend&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[Контейнер] Этап 1 читает Биллинг напрямую по тому же XML-RPC API — мимо адаптера (на прототипе — из CSV)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;430\&quot; width=\&quot;260\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;writeapi\&quot; value=\&quot;&amp;lt;b&amp;gt;Write API  ·  HITL Guard&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[правило 4.7] Принимает операцию записи от оркестратора. Отклоняет, если состояние сессии не AWAITING_CONFIRMATION с подтверждением; повторно проверяет привязку subscriber_id к сессии (Spoofing / IDOR, раздел 13). Read-путь Этапа 1 сюда не идёт&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;430\&quot; y=\&quot;230\&quot; width=\&quot;320\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;client\&quot; value=\&quot;&amp;lt;b&amp;gt;XML-RPC Client&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:11px&amp;#x27;&amp;gt;[клиент внешнего API Биллинга] Единственный путь в Биллинг (SQL-клиента к его БД нет — схема не контракт, 29.5). Idempotency-Key: повтор с тем же ключом возвращает прежний результат, дубль не создаётся. Повтор с backoff, размыкание при недоступности — ошибка возвращается оркестратору как отказ, а не молчание. Аудит: кто/что/когда/ключ/результат&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#85BBF0;strokeColor=#5D9BD8;fontColor=#0B2A45;fontSize=12;verticalAlign=top;spacingTop=6;spacingLeft=8;spacingRight=8;align=left;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;800\&quot; y=\&quot;230\&quot; width=\&quot;320\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_fold\&quot; value=\&quot;[v4.53] Свёрнуто 6 → 2. В XML-RPC Client влиты Retry / Circuit Breaker + Idempotency Store + Audit Emitter.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#B85450;whiteSpace=wrap;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;380\&quot; y=\&quot;570\&quot; width=\&quot;780\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;n_stub\&quot; value=\&quot;На прототипе адаптер написан заглушкой (app/adapters/billing_adapter.py) и не вызывается: запись в Биллинг — Этап 2. Раздел 29.5: отдельный «слой доступа к Биллингу» не вводится — Backend (read, Этап 1) и Billing Adapter (write, Этап 2) идут в XML-RPC API независимо.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=11;fontStyle=2;fontColor=#B85450;whiteSpace=wrap;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;380\&quot; y=\&quot;615\&quot; width=\&quot;780\&quot; height=\&quot;55\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;b1\&quot; value=\&quot;26. запись операции&amp;lt;br&amp;gt;[Internal HTTP]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.3;entryX=0;entryY=0.3;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;orch\&quot; target=\&quot;writeapi\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;b2\&quot; value=\&quot;29. подтверждение / отказ\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0;exitY=0.8;entryX=1;entryY=0.8;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;writeapi\&quot; target=\&quot;orch\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;b3\&quot; value=\&quot;гейт пройден\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.3;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;writeapi\&quot; target=\&quot;client\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;b8\&quot; value=\&quot;27. Write + Idempotency-Key&amp;lt;br&amp;gt;[XML-RPC API Биллинга]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.25;entryX=0;entryY=0.6;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;client\&quot; target=\&quot;billing\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;b10\&quot; value=\&quot;36. аудит-лог&amp;lt;br&amp;gt;[Redis / SQL]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.75;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;client\&quot; target=\&quot;sess\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;b11\&quot; value=\&quot;данные абонента (read), Этап 1 — мимо адаптера&amp;lt;br&amp;gt;[XML-RPC API Биллинга]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;dashed=1;exitX=0.5;exitY=1;entryX=0.5;entryY=1;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;backend\&quot; target=\&quot;billing\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;190\&quot; y=\&quot;700\&quot;/&gt;&lt;mxPoint x=\&quot;1390\&quot; y=\&quot;700\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;&quot;}"></div>
