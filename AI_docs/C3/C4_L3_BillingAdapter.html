0\&quot; y=\&quot;62\&quot; width=\&quot;2100\&quot; height=\&quot;30\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;orch\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:13px&amp;quot;&amp;gt;Agent Orchestrator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Python]&amp;lt;br&amp;gt;Шаг 26: запись операции после подтверждения\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=11;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;80\&quot; y=\&quot;420\&quot; width=\&quot;360\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;backend\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:13px&amp;quot;&amp;gt;API Gateway / Backend&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Контейнер]&amp;lt;br&amp;gt;Этап 1 читает Биллинг напрямую по тому же XML-RPC API — мимо адаптера (на прототипе — из CSV)\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=11;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;80\&quot; y=\&quot;700\&quot; width=\&quot;360\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;boundary\&quot; value=\&quot;Billing Adapter [Go/Python, Этап 2 — не вызывается на прототипе]\&quot; style=\&quot;rounded=1;arcSize=3;whiteSpace=wrap;html=1;fillColor=#F4F8FC;strokeColor=#5B8DB8;dashed=1;strokeWidth=2;align=left;verticalAlign=top;spacingTop=12;spacingLeft=16;fontSize=15;fontStyle=1;fontColor=#16324F;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;520\&quot; y=\&quot;240\&quot; width=\&quot;1400\&quot; height=\&quot;760\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;hitlguard\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:13px&amp;quot;&amp;gt;Write API · HITL Guard&amp;lt;/b&amp;gt;  [правило 4.7]&amp;lt;br&amp;gt;Принимает операцию записи от оркестратора. Отклоняет, если состояние сессии не AWAITING_CONFIRMATION с подтверждением; повторно проверяет привязку subscriber_id к сессии (Spoofing / IDOR, раздел 13).&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Read-путь Этапа 1 сюда не ходит&amp;lt;/b&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#FADBD8;strokeColor=#C0392B;fontColor=#16324F;fontSize=11;align=left;verticalAlign=top;spacing=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;600\&quot; y=\&quot;380\&quot; width=\&quot;560\&quot; height=\&quot;320\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;xmlrpc\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:13px&amp;quot;&amp;gt;XML-RPC Client&amp;lt;/b&amp;gt;  [клиент внешнего API Биллинга]&amp;lt;br&amp;gt;Единственный путь в Биллинг (SQL-клиента к его БД нет — схема не контракт, 29.5). &amp;lt;b&amp;gt;Idempotency-Key:&amp;lt;/b&amp;gt; повтор с тем же ключом возвращает прежний результат, дубль не создаётся. Повтор с backoff, размыкание при недоступности — ошибка возвращается оркестратору как отказ, не молчание. Аудит: кто/что/когда/ключ/результат\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#D6E6F5;strokeColor=#2F80C3;fontColor=#16324F;fontSize=11;align=left;verticalAlign=top;spacing=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1240\&quot; y=\&quot;380\&quot; width=\&quot;600\&quot; height=\&quot;320\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;billing\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:13px&amp;quot;&amp;gt;Биллинг&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя legacy-система]&amp;lt;br&amp;gt;Лицевые счета, начисления, задолженность. Доступ — только через собственный XML-RPC API\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#8A9BA8;strokeColor=#5F7182;fontColor=#FFFFFF;fontSize=11;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2020\&quot; y=\&quot;300\&quot; width=\&quot;460\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;store\&quot; value=\&quot;&amp;lt;b&amp;gt;Session State Store&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Redis / PostgreSQL]&amp;lt;br&amp;gt;Аудит-лог операций\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=14;fillColor=#D5F0E1;strokeColor=#1E8449;fontColor=#16324F;fontSize=11;align=center;verticalAlign=middle;spacing=4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2020\&quot; y=\&quot;640\&quot; width=\&quot;460\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note_v\&quot; value=\&quot;&amp;lt;b&amp;gt;[v4.53]&amp;lt;/b&amp;gt; Свёрнуто 6 → 2. В XML-RPC Client влиты Retry / Circuit Breaker + Idempotency Store + Audit Emitter.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;На прототипе адаптер написан заглушкой (app/adapters/billing_adapter.py) и не вызывается: запись в Биллинг — Этап 2. Раздел 29.5: отдельный «слой доступа к Биллингу» не вводится — Backend (read, Этап 1) и Billing Adapter (write, Этап 2) идут к XML-RPC API независимо.\&quot; style=\&quot;rounded=1;arcSize=6;whiteSpace=wrap;html=1;fillColor=#FDF6E7;strokeColor=#D9A400;fontColor=#7A5C00;fontSize=11;align=left;verticalAlign=top;spacing=12;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;520\&quot; y=\&quot;1180\&quot; width=\&quot;1400\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;legend\&quot; value=\&quot;Легенда\&quot; style=\&quot;rounded=1;arcSize=4;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#C9D4DE;align=left;verticalAlign=top;spacingTop=8;spacingLeft=12;fontSize=12;fontStyle=1;fontColor=#16324F;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2020\&quot; y=\&quot;880\&quot; width=\&quot;460\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;lg1\&quot; value=\&quot;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FADBD8;strokeColor=#C0392B;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2040\&quot; y=\&quot;912\&quot; width=\&quot;26\&quot; height=\&quot;14\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;lg1t\&quot; value=\&quot;HITL-guard / контрольные проверки\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=middle;fontSize=10;fontColor=#333333;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2074\&quot; y=\&quot;909\&quot; width=\&quot;380\&quot; height=\&quot;20\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;lg2\&quot; value=\&quot;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#D6E6F5;strokeColor=#2F80C3;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2040\&quot; y=\&quot;938\&quot; width=\&quot;26\&quot; height=\&quot;14\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;lg2t\&quot; value=\&quot;Клиент внешнего API\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=middle;fontSize=10;fontColor=#333333;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2074\&quot; y=\&quot;935\&quot; width=\&quot;380\&quot; height=\&quot;20\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;lg3\&quot; value=\&quot;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2
