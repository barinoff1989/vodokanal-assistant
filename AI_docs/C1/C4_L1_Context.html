<div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;Electron\&quot; agent=\&quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) draw.io/29.0.3 Chrome/140.0.7339.249 Electron/38.7.0 Safari/537.36\&quot; version=\&quot;29.0.3\&quot;&gt;&lt;diagram id=\&quot;c4l1\&quot; name=\&quot;C4 Level 1\&quot;&gt;&lt;mxGraphModel dx=\&quot;1028\&quot; dy=\&quot;611\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;1800\&quot; pageHeight=\&quot;1000\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot; /&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot; /&gt;&lt;mxCell id=\&quot;title\&quot; value=\&quot;&amp;lt;b&amp;gt;C4 Level 1 — Контекст: «AI-помощник абонента водоканала»&amp;lt;/b&amp;gt;\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;whiteSpace=wrap;fontSize=20;fontColor=#1A237E;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;550\&quot; y=\&quot;20\&quot; width=\&quot;700\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;person\&quot; value=\&quot;&amp;lt;b&amp;gt;Абонент водоканала&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Персона]&amp;lt;br&amp;gt;Единственный конечный пользователь чат-интерфейса. Работает в существующем Личном кабинете\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#1565C0;strokeColor=#0D47A1;fontColor=#FFFFFF;fontSize=12;align=center;verticalAlign=middle;spacing=8;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;120\&quot; width=\&quot;300\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ai\&quot; value=\&quot;&amp;lt;b&amp;gt;AI-помощник абонента водоканала&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Программная система]&amp;lt;br&amp;gt;Встроен в Личный кабинет: агент — документы, заявки, операции в биллинге с подтверждением абонента\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#1976D2;strokeColor=#0D47A1;strokeWidth=3;fontColor=#FFFFFF;fontSize=13;align=center;verticalAlign=middle;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;660\&quot; y=\&quot;300\&quot; width=\&quot;520\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;lk\&quot; value=\&quot;&amp;lt;b&amp;gt;Платформа ЛК&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;SSO, сессии, профиль абонента, контекст личного кабинета. В неё встроен AI-виджет\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#78909C;strokeColor=#546E7A;fontColor=#FFFFFF;fontSize=12;align=center;verticalAlign=middle;spacing=8;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;380\&quot; width=\&quot;300\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;llm\&quot; value=\&quot;&amp;lt;b&amp;gt;LLM Provider&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;По умолчанию — управляемый API на территории РФ (GigaChat Pro / YandexGPT, 152-ФЗ). Собственная модель (Qwen2.5) — вариант тиража, решение не принято\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#78909C;strokeColor=#546E7A;fontColor=#FFFFFF;fontSize=12;align=center;verticalAlign=middle;spacing=8;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1400\&quot; y=\&quot;315\&quot; width=\&quot;320\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;kb\&quot; value=\&quot;&amp;lt;b&amp;gt;База знаний (файловое хранилище)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;Регламенты и инструкции (Word), реестр договоров (файлы по типу обращения), типовые формы / устав / оферта (Word/PDF), публичный FAQ / сайт и соцсети водоканала\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#78909C;strokeColor=#546E7A;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=8;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;60\&quot; y=\&quot;760\&quot; width=\&quot;330\&quot; height=\&quot;190\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;billing\&quot; value=\&quot;&amp;lt;b&amp;gt;Биллинг&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя legacy-система]&amp;lt;br&amp;gt;Данные абонента, показания, начисления, задолженность, данные о поверке. Доступ — только через собственный внешний XML-RPC API\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#78909C;strokeColor=#546E7A;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=8;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;440\&quot; y=\&quot;760\&quot; width=\&quot;310\&quot; height=\&quot;190\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;tickets\&quot; value=\&quot;&amp;lt;b&amp;gt;Микросервис обращений&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;Регистрация обращений абонентов (поверка, подключение, приём документов). Из него обращения читают подрядчики и пайплайн дообучения модели\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#78909C;strokeColor=#546E7A;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=8;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;800\&quot; y=\&quot;760\&quot; width=\&quot;330\&quot; height=\&quot;190\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;dispatch\&quot; value=\&quot;&amp;lt;b&amp;gt;Диспетчерская система&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;Аварийные заявки, near real-time. Этап 1 — чтение данных по авариям для ответа. Этап 2 — передача аварийной заявки после подтверждения (HITL)\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#78909C;strokeColor=#546E7A;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=8;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1180\&quot; y=\&quot;760\&quot; width=\&quot;350\&quot; height=\&quot;190\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e1\&quot; value=\&quot;Вопросы, ответ, источники,&amp;lt;br&amp;gt;рекомендации; подтверждение&amp;lt;br&amp;gt;операций Этапа 2&amp;lt;br&amp;gt;[HTTPS, AI-виджет в ЛК]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#37474F;fontColor=#263238;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.222;\&quot; parent=\&quot;1\&quot; source=\&quot;person\&quot; target=\&quot;ai\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;520\&quot; y=\&quot;180\&quot; /&gt;&lt;mxPoint x=\&quot;520\&quot; y=\&quot;340\&quot; /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e2\&quot; value=\&quot;Работает в личном кабинете,&amp;lt;br&amp;gt;вход по SSO [HTTPS]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#37474F;fontColor=#263238;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;person\&quot; target=\&quot;lk\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;90\&quot; y=\&quot;10\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e3\&quot; value=\&quot;Проверка сессии SSO, профиль&amp;lt;br&amp;gt;и контекст абонента [HTTPS]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#37474F;fontColor=#263238;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.555;\&quot; parent=\&quot;1\&quot; source=\&quot;lk\&quot; target=\&quot;ai\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;520\&quot; y=\&quot;450\&quot; /&gt;&lt;mxPoint x=\&quot;520\&quot; y=\&quot;400\&quot; /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e4\&quot; value=\&quot;Генерация ответа по обезличенному&amp;lt;br&amp;gt;промпту (ПДн удалены в LLM Gateway)&amp;lt;br&amp;gt;[External API]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#37474F;fontColor=#263238;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; parent=\&quot;1\&quot; source=\&quot;ai\&quot; target=\&quot;llm\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint y=\&quot;-45\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e5\&quot; value=\&quot;Забор документов для индексации RAG&amp;lt;br&amp;gt;[файловый доступ, только чтение]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#37474F;fontColor=#263238;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.077;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;ai\&quot; target=\&quot;kb\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;700\&quot; y=\&quot;560\&quot; /&gt;&lt;mxPoint x=\&quot;225\&quot; y=\&quot;560\&quot; /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e6\&quot; value=\&quot;Этап 1 — чтение данных абонента;&amp;lt;br&amp;gt;Этап 2 — запись после подтверждения (HITL)&amp;lt;br&amp;gt;[внешний XML-RPC API Биллинга]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#37474F;fontColor=#263238;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.308;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;ai\&quot; target=\&quot;billing\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;820\&quot; y=\&quot;600\&quot; /&gt;&lt;mxPoint x=\&quot;595\&quot; y=\&quot;600\&quot; /&gt;&lt;/Array&gt;&lt;mxPoint y=\&quot;15\&quot; as=\&quot;offset\&quot; /&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e7\&quot; value=\&quot;Этап 2 — регистрация обращения&amp;lt;br&amp;gt;после подтверждения [REST API]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#37474F;fontColor=#263238;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.587;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;ai\&quot; target=\&quot;tickets\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e8\&quot; value=\&quot;Этап 1 — чтение данных по авариям;&amp;lt;br&amp;gt;Этап 2 — передача аварийной заявки&amp;lt;br&amp;gt;после подтверждения [REST API]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#37474F;fontColor=#263238;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.846;exitY=1;entryX=0.5;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;ai\&quot; target=\&quot;dispatch\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1100\&quot; y=\&quot;640\&quot; /&gt;&lt;mxPoint x=\&quot;1355\&quot; y=\&quot;640\&quot; /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;annotator\&quot; value=\&quot;&amp;lt;b&amp;gt;Annotator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Техническая роль — IAM]&amp;lt;br&amp;gt;Golden Set, валидация ответов, разметка спорных кейсов, оценка качества RAG\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#455A64;strokeColor=#263238;fontColor=#FFFFFF;fontSize=12;align=center;verticalAlign=middle;spacing=8;dashed=1;dashPattern=6 4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;900\&quot; y=\&quot;120\&quot; width=\&quot;280\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;datascientist\&quot; value=\&quot;&amp;lt;b&amp;gt;Data Scientist&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Техническая роль — IAM]&amp;lt;br&amp;gt;Анализ логов, метрики RAG (recall / precision), подготовка данных для дообучения\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#455A64;strokeColor=#263238;fontColor=#FFFFFF;fontSize=12;align=center;verticalAlign=middle;spacing=8;dashed=1;dashPattern=6 4;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1210\&quot; y=\&quot;120\&quot; width=\&quot;280\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e9\&quot; value=\&quot;Готовит Golden Set, валидирует ответы,&amp;lt;br&amp;gt;размечает спорные кейсы, оценивает качество RAG\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#37474F;fontColor=#263238;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.3;exitY=1;entryX=0.65;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;annotator\&quot; target=\&quot;ai\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;960\&quot; y=\&quot;260\&quot; /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e10\&quot; value=\&quot;Анализирует логи и метрики RAG,&amp;lt;br&amp;gt;готовит данные для дообучения\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#37474F;fontColor=#263238;fontSize=10;labelBackgroundColor=#FFFFFF;exitX=0.3;exitY=1;entryX=0.9;entryY=0;\&quot; parent=\&quot;1\&quot; source=\&quot;datascientist\&quot; target=\&quot;ai\&quot; edge=\&quot;1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1270\&quot; y=\&quot;280\&quot; /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;&quot;, &quot;toolbar&quot;: &quot;pages zoom layers lightbox&quot;, &quot;page&quot;: 0}"></div>
