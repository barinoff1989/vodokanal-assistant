teSpace=wrap;html=1;fontSize=12;arcSize=8;fillColor=#1F5C8B;strokeColor=#16466A;fontColor=#FFFFFF;dashed=1;dashPattern=6 4;\&quot; value=\&quot;&amp;lt;b&amp;gt;Annotator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Техническая роль — IAM]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Golden Set, валидация ответов, разметка спорных кейсов, оценка качества RAG&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;120\&quot; width=\&quot;250\&quot; x=\&quot;900\&quot; y=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;datascientist\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fontSize=12;arcSize=8;fillColor=#1F5C8B;strokeColor=#16466A;fontColor=#FFFFFF;dashed=1;dashPattern=6 4;\&quot; value=\&quot;&amp;lt;b&amp;gt;Data Scientist&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Техническая роль — IAM]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Анализ логов, метрики RAG (recall / precision), подготовка данных для дообучения&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;120\&quot; width=\&quot;260\&quot; x=\&quot;1210\&quot; y=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;system\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fontSize=12;arcSize=8;fillColor=#1168BD;strokeColor=#0B5394;fontColor=#FFFFFF;verticalAlign=top;spacingTop=10;spacingLeft=6;spacingRight=6;align=left;\&quot; value=\&quot;&amp;lt;b&amp;gt;AI-помощник абонента водоканала&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Программная система]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Встроен в Личный кабинет. агент: документы, заявки, операции в биллинге с подтверждением абонента.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;240\&quot; width=\&quot;520\&quot; x=\&quot;560\&quot; y=\&quot;440\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;lk\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fontSize=12;arcSize=0;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;\&quot; value=\&quot;&amp;lt;b&amp;gt;Платформа ЛК&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;SSO, сессии, профиль абонента, контекст личного кабинета. В неё встроен AI-виджет&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;140\&quot; width=\&quot;270\&quot; x=\&quot;50\&quot; y=\&quot;470\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;llm\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fontSize=12;arcSize=8;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;\&quot; value=\&quot;&amp;lt;b&amp;gt;LLM Provider&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;По умолчанию — управляемый API на территории РФ (GigaChat Pro / YandexGPT, 152-ФЗ, ADR-002).&amp;lt;br&amp;gt;Self-hosted Qwen2.5 / Llama 3.1 — по триггерам&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;180\&quot; width=\&quot;340\&quot; x=\&quot;1320\&quot; y=\&quot;460\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;kb\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fontSize=12;arcSize=8;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;\&quot; value=\&quot;&amp;lt;b&amp;gt;База знаний (файловое хранилище)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Регламенты и инструкции (Word), реестр договоров (файлы по типу обращения), типовые формы / устав / оферта (Word/PDF), публичный FAQ / сайт и соцсети водоканала&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;170\&quot; width=\&quot;320\&quot; x=\&quot;70\&quot; y=\&quot;820\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;billing\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fontSize=12;arcSize=8;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;\&quot; value=\&quot;&amp;lt;b&amp;gt;Биллинг&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя legacy-система]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Данные абонента, показания, начисления, задолженность, данные о поверке. Доступ — только через собственный внешний XML-RPC API&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;160\&quot; width=\&quot;290\&quot; x=\&quot;420\&quot; y=\&quot;840\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;inquiries\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fontSize=12;arcSize=8;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;\&quot; value=\&quot;&amp;lt;b&amp;gt;Микросервис обращений&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Регистрация обращений абонентов (поверка, подключение, приём документов). Из него обращения читают подрядчики и пайплайн дообучения модели (источник 3, раздел 29)&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;160\&quot; width=\&quot;350\&quot; x=\&quot;750\&quot; y=\&quot;840\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;dispatch\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fontSize=12;arcSize=8;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;\&quot; value=\&quot;&amp;lt;b&amp;gt;Диспетчерская система&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешняя система]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size:11px&amp;quot;&amp;gt;Аварийные заявки, near real-time (источник 7, раздел 29). Этап 1 — чтение данных по авариям для ответа. Этап 2 — передача аварийной заявки после подтверждения (HITL)&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;160\&quot; width=\&quot;340\&quot; x=\&quot;1160\&quot; y=\&quot;840\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_sub_sys\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;subscriber\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=1;exitY=0.3;entryX=0;entryY=0.25;\&quot; target=\&quot;system\&quot; value=\&quot;Задаёт вопросы; получает ответ, источники&amp;lt;br&amp;gt;и рекомендации; подтверждает операции Этапа 2&amp;lt;br&amp;gt;[HTTPS, AI-виджет в ЛК]\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; x=\&quot;-0.1157\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint as=\&quot;offset\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_sub_lk\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;subscriber\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.4;exitY=1;entryX=0.4;entryY=0;\&quot; target=\&quot;lk\&quot; value=\&quot;Работает в личном кабинете,&amp;lt;br&amp;gt;вход по SSO [HTTPS]\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_sys_lk\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;system\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0;exitY=0.55;entryX=1;entryY=0.5;\&quot; target=\&quot;lk\&quot; value=\&quot;Проверка сессии SSO,&amp;lt;br&amp;gt;профиль и контекст абонента [HTTPS]\&quot;& mp;gt;[внешний XML-RPC API Биллинга]\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; x=\&quot;-0.15\&quot; y=\&quot;-8\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_sys_inquiries\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;system\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.6;exitY=1;entryX=0.4;entryY=0;\&quot; target=\&quot;inquiries\&quot; value=\&quot;Этап 2 — регистрация обращения абонента&amp;lt;br&amp;gt;после подтверждения [REST API]\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; x=\&quot;-0.15\&quot; y=\&quot;-8\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_sys_dispatch\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;system\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.9;exitY=1;entryX=0.35;entryY=0;\&quot; target=\&quot;dispatch\&quot; value=\&quot;Этап 1 — чтение данных по авариям для ответа;&amp;lt;br&amp;gt;Этап 2 — передача аварийной заявки после подтверждения&amp;lt;br&amp;gt;[REST API]\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; x=\&quot;0.5\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1020\&quot; y=\&quot;800\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_annotator_sys\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;annotator\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.4;exitY=1;entryX=0.75;entryY=0;\&quot; target=\&quot;system\&quot; value=\&quot;Готовит Golden Set, валидирует ответы,&amp;lt;br&amp;gt;размечает спорные кейсы, оценивает качество RAG\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; x=\&quot;-0.45\&quot; y=\&quot;-12\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_ds_sys\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;datascientist\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0.3;exitY=1;entryX=0.92;entryY=0;\&quot; target=\&quot;system\&quot; value=\&quot;Анализирует логи и метрики RAG,&amp;lt;br&amp;gt;готовит данные для дообучения\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; x=\&quot;-0.35\&quot; y=\&quot;-12\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1290\&quot; y=\&quot;400\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;&quot;,&quot;toolbar&quot;:&quot;pages zoom layers lightbox&quot;,&quot;page&quot;:0}"></div>
