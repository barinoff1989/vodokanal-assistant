<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6B7B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="800" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#16324F">Как данные становятся ответом абоненту</text>

  <!-- lane backgrounds -->
  <rect x="80" y="150" width="1440" height="190" rx="8" fill="#FFF9EC" stroke="#D9A400" stroke-dasharray="6 4"/>
  <text x="100" y="135" font-size="15" font-weight="700" fill="#7A5C00">ПОДГОТОВКА БАЗЫ ЗНАНИЙ — заранее, по расписанию</text>

  <rect x="80" y="430" width="1440" height="300" rx="8" fill="#F4F8FC" stroke="#5B8DB8" stroke-dasharray="6 4"/>
  <text x="100" y="415" font-size="15" font-weight="700" fill="#1F5C8B">ОТВЕТ АБОНЕНТУ — сразу, в момент вопроса</text>

  <!-- edges lane 1 -->
  <path d="M 440,245 L 560,245" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M 860,245 L 980,245" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>

  <!-- edges lane 2 -->
  <path d="M 1127,300 L 1127,380 L 707,380 L 707,470" stroke="#5A6B7B" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow2)"/>
  <rect x="1060" y="368" width="55" height="20" fill="#FFFFFF"/>
  <text x="1087" y="383" text-anchor="middle" font-size="12" fill="#333333">читает</text>

  <path d="M 360,570 L 560,525" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <rect x="400" y="530" width="60" height="20" fill="#FFFFFF"/>
  <text x="430" y="545" text-anchor="middle" font-size="13" fill="#333333">вопрос</text>

  <path d="M 360,620 L 560,655" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>

  <path d="M 860,525 L 980,525" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <rect x="885" y="503" width="70" height="20" fill="#FFFFFF"/>
  <text x="920" y="518" text-anchor="middle" font-size="13" fill="#333333">контекст</text>

  <path d="M 860,650 L 920,650 L 920,558 L 980,558" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>

  <path d="M 1280,525 L 1380,570" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <rect x="1300" y="530" width="55" height="20" fill="#FFFFFF"/>
  <text x="1327" y="545" text-anchor="middle" font-size="13" fill="#333333">ответ</text>

  <!-- lane 1 boxes -->
  <rect x="140" y="190" width="300" height="110" rx="10" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
  <text x="290" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Документы водоканала</text>
  <text x="290" y="262" text-anchor="middle" font-size="12.5" fill="#F0F0F0">инструкции, договоры, FAQ</text>

  <rect x="560" y="190" width="300" height="110" rx="10" fill="#D99C00" stroke="#A67C00" stroke-width="1.5"/>
  <text x="710" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Обработка и разметка</text>
  <text x="710" y="262" text-anchor="middle" font-size="12" fill="#FCEFD2">разбор, разбиение на части,</text>
  <text x="710" y="278" text-anchor="middle" font-size="12" fill="#FCEFD2">эмбеддинги</text>

  <rect x="980" y="190" width="300" height="110" rx="10" fill="#2F80C3" stroke="#1F5C8B" stroke-width="1.5"/>
  <text x="1130" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">База знаний</text>
  <text x="1130" y="267" text-anchor="middle" font-size="12.5" fill="#E8F0FA">векторный поиск</text>

  <!-- lane 2 boxes -->
  <rect x="140" y="540" width="220" height="80" rx="14" fill="#16324F" stroke="#0E2233" stroke-width="1.5"/>
  <text x="250" y="587" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Абонент</text>

  <rect x="560" y="470" width="300" height="110" rx="10" fill="#2F80C3" stroke="#1F5C8B" stroke-width="1.5"/>
  <text x="710" y="520" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Поиск в базе знаний</text>
  <text x="710" y="542" text-anchor="middle" font-size="12" fill="#E8F0FA">находит нужные фрагменты</text>

  <rect x="560" y="610" width="300" height="100" rx="10" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
  <text x="710" y="655" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Биллинг · Диспетчерская</text>
  <text x="710" y="677" text-anchor="middle" font-size="12" fill="#F0F0F0">текущие факты — в реальном времени</text>

  <rect x="980" y="470" width="300" height="110" rx="10" fill="#2F80C3" stroke="#1F5C8B" stroke-width="1.5"/>
  <text x="1130" y="516" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Модель формирует ответ</text>
  <text x="1130" y="538" text-anchor="middle" font-size="12.5" fill="#E8F0FA">GigaChat / YandexGPT</text>

  <rect x="1380" y="540" width="220" height="80" rx="10" fill="#16324F" stroke="#0E2233" stroke-width="1.5"/>
  <text x="1490" y="587" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Ответ абоненту</text>

  <!-- legend -->
  <rect x="80" y="800" width="30" height="18" rx="3" fill="#FFF9EC" stroke="#D9A400" stroke-dasharray="5 3"/>
  <text x="118" y="814" font-size="13.5" fill="#333333">офлайн, заранее</text>

  <rect x="340" y="800" width="30" height="18" rx="3" fill="#F4F8FC" stroke="#5B8DB8" stroke-dasharray="5 3"/>
  <text x="378" y="814" font-size="13.5" fill="#333333">онлайн, при вопросе абонента</text>
</svg>
