<svg viewBox="0 0 1600 960" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6B7B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="960" fill="#FFFFFF"/>

  <text x="800" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#16324F">AI-помощник абонента водоканала — контейнеры</text>

  <!-- edges (drawn first, under boxes) -->
  <path d="M 800,150 L 800,190" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <path d="M 800,260 L 800,320" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="740" y="278" width="120" height="22" fill="#FFFFFF"/>
  <text x="800" y="294" text-anchor="middle" font-size="13" fill="#333333">вопрос → ответ</text>

  <path d="M 660,420 L 660,450 L 230,450 L 230,480" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="150" y="438" width="90" height="22" fill="#FFFFFF"/>
  <text x="195" y="454" text-anchor="middle" font-size="13" fill="#333333">генерация</text>

  <path d="M 230,580 L 230,630" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <path d="M 800,420 L 800,450 L 605,450 L 605,480" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="530" y="438" width="140" height="22" fill="#FFFFFF"/>
  <text x="600" y="454" text-anchor="middle" font-size="13" fill="#333333">поиск контекста</text>

  <path d="M 605,580 L 605,630" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 605,720 L 605,760 L 605,800" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <path d="M 940,420 L 940,450 L 930,450 L 930,480" stroke="#5A6B7B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <path d="M 1040,370 L 1100,370 L 1100,480" stroke="#5A6B7B" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/>
  <rect x="1045" y="358" width="130" height="22" fill="#FFFFFF"/>
  <text x="1110" y="374" text-anchor="middle" font-size="13" fill="#333333">сценарий записи</text>

  <path d="M 1270,580 L 1270,630" stroke="#5A6B7B" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/>
  <rect x="1180" y="588" width="170" height="22" fill="#FFFFFF"/>
  <text x="1265" y="604" text-anchor="middle" font-size="13" fill="#333333">после подтверждения</text>

  <!-- Абонент -->
  <rect x="700" y="90" width="200" height="60" rx="12" fill="#16324F" stroke="#0E2233" stroke-width="1.5"/>
  <text x="800" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Абонент</text>

  <!-- AI-виджет -->
  <rect x="680" y="190" width="240" height="70" rx="10" fill="#2F80C3" stroke="#1F5C8B" stroke-width="1.5"/>
  <text x="800" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">AI-виджет в ЛК</text>

  <!-- Backend -->
  <rect x="560" y="320" width="480" height="100" rx="10" fill="#2F80C3" stroke="#1F5C8B" stroke-width="1.5"/>
  <text x="800" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">API Gateway / Backend</text>
  <text x="800" y="384" text-anchor="middle" font-size="13" fill="#E8F0FA">классификация, поиск, сборка ответа</text>

  <!-- LLM Gateway -->
  <rect x="80" y="480" width="300" height="100" rx="10" fill="#2F80C3" stroke="#1F5C8B" stroke-width="1.5"/>
  <text x="230" y="518" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">LLM Gateway</text>
  <text x="230" y="542" text-anchor="middle" font-size="12.5" fill="#E8F0FA">обезличивание, лимиты,</text>
  <text x="230" y="559" text-anchor="middle" font-size="12.5" fill="#E8F0FA">проверка ответа</text>

  <!-- LLM Provider -->
  <rect x="80" y="630" width="300" height="90" rx="10" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
  <text x="230" y="668" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">LLM Provider</text>
  <text x="230" y="690" text-anchor="middle" font-size="12.5" fill="#F0F0F0">GigaChat / YandexGPT</text>

  <!-- Поиск -->
  <rect x="440" y="480" width="330" height="100" rx="10" fill="#2F80C3" stroke="#1F5C8B" stroke-width="1.5"/>
  <text x="605" y="514" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Поиск по базе знаний</text>
  <text x="605" y="537" text-anchor="middle" font-size="12.5" fill="#E8F0FA">векторная база + эмбеддинги</text>
  <text x="605" y="554" text-anchor="middle" font-size="12.5" fill="#E8F0FA">+ переранжирование</text>

  <!-- ETL -->
  <rect x="440" y="630" width="330" height="90" rx="10" fill="#2F80C3" stroke="#1F5C8B" stroke-width="1.5"/>
  <text x="605" y="666" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Индексация документов</text>
  <text x="605" y="688" text-anchor="middle" font-size="12.5" fill="#E8F0FA">загрузка и обработка базы знаний</text>

  <!-- Хранилища -->
  <rect x="820" y="480" width="220" height="100" rx="10" fill="#5B6B7C" stroke="#3E4C59" stroke-width="1.5"/>
  <text x="930" y="524" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">Сессии · лимиты ·</text>
  <text x="930" y="546" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">телеметрия</text>

  <!-- Агент операций записи -->
  <rect x="1100" y="480" width="340" height="100" rx="10" fill="#F4F8FC" stroke="#5B8DB8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="1270" y="514" text-anchor="middle" font-size="16" font-weight="700" fill="#16324F">Агент операций записи</text>
  <text x="1270" y="537" text-anchor="middle" font-size="12" fill="#3A5A78">заявки, показания, документы —</text>
  <text x="1270" y="554" text-anchor="middle" font-size="12" fill="#3A5A78">после подтверждения абонента</text>

  <!-- Системы водоканала -->
  <rect x="1100" y="630" width="340" height="90" rx="10" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
  <text x="1270" y="666" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Системы водоканала</text>
  <text x="1270" y="688" text-anchor="middle" font-size="12.5" fill="#F0F0F0">Биллинг · Диспетчерская · обращения</text>

  <!-- База знаний -->
  <rect x="460" y="800" width="290" height="80" rx="10" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
  <text x="605" y="834" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">База знаний</text>
  <text x="605" y="855" text-anchor="middle" font-size="12.5" fill="#F0F0F0">регламенты, инструкции, FAQ</text>

  <!-- Легенда -->
  <rect x="80" y="805" width="30" height="18" rx="3" fill="#2F80C3" stroke="#1F5C8B"/>
  <text x="118" y="819" font-size="13.5" fill="#333333">работает сейчас (Этап 1)</text>

  <rect x="80" y="845" width="30" height="18" rx="3" fill="#F4F8FC" stroke="#5B8DB8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="118" y="859" font-size="13.5" fill="#333333">в разработке (Этап 2)</text>
</svg>
