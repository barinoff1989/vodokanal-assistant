etry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;user\&quot; value=\&quot;&amp;lt;b&amp;gt;Абонент&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Персона]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;браузер ЛК&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#08427B;strokeColor=#073B6F;fontColor=#FFFFFF;fontSize=11;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;90\&quot; y=\&quot;140\&quot; width=\&quot;190\&quot; height=\&quot;80\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;llmprov\&quot; value=\&quot;&amp;lt;b&amp;gt;LLM Provider&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешний SaaS]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;GigaChat Pro — управляемый API на территории РФ (152-ФЗ, ADR-002)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2010\&quot; y=\&quot;140\&quot; width=\&quot;330\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;cluster\&quot; value=\&quot;Kubernetes-кластер  ·  контур водоканала  ·  Helm-релизы, RBAC, NetworkPolicy\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F2F7FA;strokeColor=#2C5DA8;strokeWidth=2;verticalAlign=top;align=left;spacingLeft=14;spacingTop=8;fontSize=15;fontStyle=1;fontColor=#1B3E73;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;70\&quot; y=\&quot;270\&quot; width=\&quot;1830\&quot; height=\&quot;1400\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ns_plat\&quot; value=\&quot;namespace: platform  —  node pool: general (CPU)\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeCol pace=wrap;html=1;arcSize=8;fillColor=#6C7A89;strokeColor=#57626E;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;740\&quot; y=\&quot;360\&quot; width=\&quot;300\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;netpol\&quot; value=\&quot;&amp;lt;b&amp;gt;NetworkPolicy + egress-gateway&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;Единственный разрешённый выход наружу — LLM Provider. Остальное — только внутрь закрытой сети&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#6C7A89;strokeColor=#57626E;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1070\&quot; y=\&quot;360\&quot; width=\&quot;330\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;backupjob\&quot; value=\&quot;&amp;lt;b&amp;gt;CronJob: backup&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[расписание 0 3 * * *]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;Дампы Postgres, снапшоты Qdrant → S3/MinIO&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#1B8F5E;strokeColor=#146B47;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1430\&quot; y=\&quot;360\&quot; width=\&quot;300\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ns_app\&quot; value=\&quot;namespace: ai-app  —  node pool: general (CPU), HPA по CPU и RPS\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#7FA6EE;strokeWidth=1.5;dashed=1;dashPattern=6 4;verticalAlign=top;align=left;spacingLeft=12;spacingTop=6;fontSize=12;fontStyle=1;fontColor=#2C5DA8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;500\&quot; width=\&quot;1770\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;widget\&quot; value=\&quot;&amp;lt;b&amp;gt;ai-widget&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, 2 реплики]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;Статика React + Node SSR, встраивается в ЛК&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;130\&quot; y=\&quot;545\&quot; width=\&quot;300\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;backend\&quot; value=\&quot;&amp;lt;b&amp;gt;backend&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, 3 реплики + HPA]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;API Gateway / Backend: оркестрация, retrieval, SSE-стрим. PodDisruptionBudget: minAvailable 2&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;460\&quot; y=\&quot;545\&quot; width=\&quot;330\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;gateway\&quot; value=\&quot;&amp;lt;b&amp;gt;llm-gateway&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, 2 реплики + HPA]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;PII Sanitizer, Guardrails, Quota Manager. Секреты провайдера — из Vault&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;820\&quot; y=\&quot;545\&quot; width=\&quot;330\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;orch\&quot; value=\&quot;&amp;lt;b&amp;gt;agent-orchestrator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, Этап 2 — не разворачивается на MVP]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;FSM, tool-calling, HITL-гейты&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1180\&quot; y=\&quot;545\&quot; width=\&quot;320\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;adapters\&quot; value=\&quot;&amp;lt;b&amp;gt;billing-adapter · inquiry-service · doc-generator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, Этап 2 — не разворачиваются на MVP]\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1530\&quot; y=\&quot;545\&quot; width=\&quot;320\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ns_gpu\&quot; value=\&quot;node pool: gpu  —  1× GPU-узел, taint nvidia.com/gpu=present:NoSchedule, nodeSelector pool=gpu\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F7F3E8;strokeColor=#B57E00;strokeWidth=1.5;dashed=1;dashPattern=6 4;verticalAlign=top;align=left;spacingLeft=12;spacingTop=6;fontSize=12;fontStyle=1;fontColor=#8A5F00;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;730\&quot; width=\&quot;1770\&quot; height=\&quot;330\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;embinf\&quot; value=\&quot;&amp;lt;b&amp;gt;embedding-inference&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, GPU, 1 реплика]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;BGE-M3. Обслуживает и онлайн-ретривал Backend, и батч ETL — общий сервис (находка F7)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#D79B00;strokeColor=#B57E00;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;130\&quot; y=\&quot;800\&quot; width=\&quot;320\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rerinf\&quot; value=\&quot;&amp;lt;b&amp;gt;reranker-inference&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, GPU, 1 реплика]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;BGE-reranker-v2-m3. Онлайн top_k=20 → top_n=3 и offline-отбор чанков в ETL&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#D79B00;strokeColor=#B57E00;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;480\&quot; y=\&quot;800\&quot; width=\&quot;320\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;etljob\&quot; value=\&quot;&amp;lt;b&amp;gt;CronJob: etl-index&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Celery Beat + воркеры, расписание 0 2 * * *]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;Окно 02:00–05:00. activeDeadlineSeconds = 10800 — жёсткая граница окна. concurrencyPolicy: Forbid&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#1B8F5E;strokeColor=#146B47;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;830\&quot; y=\&quot;800\&quot; width=\&quot;340\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;cachejob\&quot; value=\&quot;&amp;lt;b&amp;gt;CronJob: profile-cache-refresh&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[K8s CronJob, раздел 30]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;Материализация кэша профиля абонента. GPU не использует&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#1B8F5E;strokeColor=#146B47;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1200\&quot; y=\&quot;800\&quot; width=\&quot;300\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;f7\&quot; value=\&quot;РЕШЕНИЕ F7 — окно обслуживания (единственный P0 проекта, открыт с версии 4.0)\n\n• Полный реиндекс базы знаний выполняется ТОЛЬКО в окне 02:00–05:00, когда онлайн-трафик абонентов минимален. Жёсткая граница — activeDeadlineSeconds = 10800.\n• Если окно не закрылось — job прерывается принудительно; курсор и контрольные суммы сохранены в Sync State (источник 14), работа продолжается в следующем окне. Индекс не повреждается: переключение alias — blue-green, только после полного успеха.\n• Delta-индексация новых документов идёт днём, но малыми порциями и с ограничением параллелизма батчей — нагрузка на GPU остаётся низкой.\n• Контроль: виджет Saturation дашборда (раздел 37) группирует утилизацию GPU по workload = etl-worker | llm-inference — конкуренция видна на одном графике.\n\nЦЕНА РЕШЕНИЯ, принятая осознанно: днём полный реиндекс невозможен; свежие документы попадают в индекс с задержкой до следующего окна. Пересмотреть — если delta-объём перестанет укладываться в окно (тогда второй GPU-пул, вариант «два пула узлов»).\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FBF0DC;strokeColor=#A66A12;strokeWidth=1.5;fontSize=11;fontColor=#5C3A02;align=left;verticalAlign=top;spacingLeft=8;spacingTop=6;spacingRight=8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1530\&quot; y=\&quot;790\&quot; width=\&quot;320\&quot; height=\&quot;240\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ns_data\&quot; value=\&quot;namespace: ai-data  —  node pool: data (CPU + локальные NVMe), PersistentVolume на каждом StatefulSet\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#7FA6EE;strokeWidth=1.5;dashed=1;dashPattern=6 4;verticalAlign=top;align=left;spacingLeft=12;spacingTop=6;fontSize=12;fontStyle=1;fontColor=#2C5DA8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;1090\&quot; width=\&quot;1770\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;qdrant\&quot; value=\&quot;&amp;lt;b&amp;gt;qdrant&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[StatefulSet, PVC NVMe]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;HNSW m=16 / ef=128; blue-green alias при реиндексе&amp;lt;/font&amp;gt;\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=10;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=11;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;130\&quot; y=\&quot;1135\&quot; width=\&quot;300\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;pg\&quot; value=\&quot;&amp;lt;b&amp; xPoint x=\&quot;290\&quot; y=\&quot;1340\&quot;/&gt;&lt;mxPoint x=\&quot;1340\&quot; y=\&quot;1340\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;diagram id=\&quot;deploy-scale\&quot; name=\&quot;Тираж — self-hosted LLM\&quot;&gt;&lt;mxGraphModel dx=\&quot;1400\&quot; dy=\&quot;900\&quot; grid=\&quot;0\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;2200\&quot; pageHeight=\&quot;1300\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;deploy-scale_t\&quot; value=\&quot;Deployment View — тираж: переход на self-hosted LLM\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=20;fontStyle=1;fontColor=#1A1A1A;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;24\&quot; width=\&quot;2000\&quot; height=\&quot;32\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;deploy-scale_s\&quot; value=\&quot;Разворачивается по факту наступления любого из четырёх триггеров ADR-002. Показана только дельта относительно MVP: остальные namespace, хранилища и observability не меняются. Переход — правка config.yaml шлюза, а не рефакторинг системы.\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;fontSize=12;fontColor=#4D4D4D;whiteSpace=wrap;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;62\&quot; width=\&quot;2000\&quot; height=\&quot;46\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;trig\&quot; value=\&quot;Триггеры перехода (ADR-002, раздел 26.3) — достаточно любого одного\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F5EFEF;strokeColor=#B85450;strokeWidth=2;dashed=1;dashPattern=8 6;verticalAlign=top;align=left;spacingLeft=12;spacingTop=6;fontSize=13;fontStyle=1;fontColor=#8C2F1E;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;70\&quot; y=\&quot;140\&quot; width=\&quot;1020\&quot; height=\&quot;250\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t1\&quot; value=\&quot;1. Запрет ИБ на внешние управляемые API — даже после обезличивания.\n    Реакция: немедленный перевод трафика на резервный self-hosted контур,\n    подготовленный заранее в тестовом режиме.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FBF0DC;strokeColor=#A66A12;strokeWidth=1.5;fontSize=11;fontColor=#5C3A02;align=left;verticalAlign=top;spacingLeft=8;spacingTop=6;spacingRight=8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;185\&quot; width=\&quot;960\&quot; height=\&quot;62\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t2\&quot; value=\&quot;2. Устойчиво более 50 млн токенов в месяц два месяца подряд.\n    Реакция: плановый перевод основного трафика — SaaS перестаёт быть выгодным.\n    Контроль: виджет «Токены за месяц» дашборда (раздел 37).\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FBF0DC;strokeColor=#A66A12;strokeWidth=1.5;fontSize=11;fontColor=#5C3A02;align=left;verticalAlign=top;spacingLeft=8;spacingTop=6;spacingRight=8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;255\&quot; width=\&quot;960\&quot; height=\&quot;62\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t3\&quot; value=\&quot;3. Требование задержки генерации менее 200 мс для конкретного сценария.\n    Реакция: на self-hosted переводится только этот сценарий, не вся система.\n4. Дообучение (LoRA) на закрытых данных обращений — их нельзя отдать третьей стороне.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FBF0DC;strokeColor=#A66A12;strokeWidth=1.5;fontSize=11;fontColor=#5C3A02;align=left;verticalAlign=top;spacingLeft=8;spacingTop=6;spacingRight=8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;325\&quot; width=\&quot;960\&quot; height=\&quot;55\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;cluster2\&quot; value=\&quot;Kubernetes-кластер — тот же, добавляется один node pool\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F2F7FA;strokeColor=#2C5DA8;strokeWidth=2;verticalAlign=top;align=left;spacingLeft=14;spacingTop=8;fontSize=15;fontStyle=1;fontColor=#1B3E73;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;70\&quot; y=\&quot;430\&quot; width=\&quot;2050\&quot; height=\&quot;500\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;pool_llm\&quot; value=\&quot;node pool: gpu-llm  —  ЭТАП 3 (тираж, по триггеру ADR-002)  ·  1× NVIDIA A100 80GB  ·  taint workload=llm-inference:NoSchedule\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F7F3E8;strokeColor=#B57E00;strokeWidth=1.5;dashed=1;dashPattern=6 4;verticalAlign=top;align=left;spacingLeft=12;spacingTop=6;fontSize=12;fontStyle=1;fontColor=#8A5F00;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;480\&quot; width=\&quot;1020\&quot; height=\&quot;300\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;vllm\&quot; value=\&quot;&amp;lt;b&amp;gt;llm-inference&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, vLLM, GPU A100 80GB]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;Qwen2.5-32B в INT4 — единственная конфигурация из рассмотренных, укладывающаяся и в VRAM, и в DoD по латентности (раздел 39.1). VRAM ≈ 34 ГБ при L=15 конкурентных запросов&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#D79B00;strokeColor=#B57E00;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;130\&quot; y=\&quot;540\&quot; width=\&quot;460\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;judge\&quot; value=\&quot;&amp;lt;b&amp;gt;llm-judge&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, опционально]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;Второй self-hosted инстанс другой модели (Llama 3.1) — нужен ТОЛЬКО при переходе по триггеру №1: внешний судья противоречил бы самому запрету (раздел 36.4)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#D79B00;strokeColor=#B57E00;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;620\&quot; y=\&quot;540\&quot; width=\&quot;470\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;vram\&quot; value=\&quot;Расчёт из раздела 39.1: T4 и L4 отклонены НЕ по объёму VRAM, а по пропускной способности памяти — инференс memory bound. A100: ≈125 ток/с (в DoD). T4/L4: ≈19–20 ток/с — ответ на 150 токенов займёт ~7.5 с, что нарушает DoD «полный ответ &amp;lt; 3 сек». Qwen2.5-72B INT4 проходит по VRAM, но ~56 ток/с — вплотную к границе, раздел 28.2 требует эмпирической проверки на целевой GPU.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FBF0DC;strokeColor=#A66A12;strokeWidth=1.5;fontSize=11;fontColor=#5C3A02;align=left;verticalAlign=top;spacingLeft=8;spacingTop=6;spacingRight=8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;130\&quot; y=\&quot;700\&quot; width=\&quot;960\&quot; height=\&quot;68\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;pool_gpu2\&quot; value=\&quot;node pool: gpu (без изменений с MVP)\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F7F3E8;strokeColor=#B57E00;strokeWidth=1.5;dashed=1;dashPattern=6 4;verticalAlign=top;align=left;spacingLeft=12;spacingTop=6;fontSize=12;fontStyle=1;fontColor=#8A5F00;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1150\&quot; y=\&quot;480\&quot; width=\&quot;460\&quot; height=\&quot;300\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;emb2\&quot; value=\&quot;&amp;lt;b&amp;gt;embedding-inference&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[BGE-M3, GPU]\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#D79B00;strokeColor=#B57E00;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1180\&quot; y=\&quot;540\&quot; width=\&quot;400\&quot; height=\&quot;70\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rer2\&quot; value=\&quot;&amp;lt;b&amp;gt;reranker-inference&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[BGE-reranker-v2-m3, GPU]\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#D79B00;strokeColor=#B57E00;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1180\&quot; y=\&quot;625\&quot; width=\&quot;400\&quot; height=\&quot;70\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;f7b\&quot; value=\&quot;Окно обслуживания ETL (решение F7) сохраняется без изменений — оно относится к этому пулу, а не к новому.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#E4F5EC;strokeColor=#1B8F5E;strokeWidth=1.5;fontSize=11;fontColor=#0E4F32;align=left;verticalAlign=top;spacingLeft=8;spacingTop=6;spacingRight=8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1180\&quot; y=\&quot;705\&quot; width=\&quot;400\&quot; height=\&quot;62\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;pool_app2\&quot; value=\&quot;namespace: ai-app (без изменений)\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#7FA6EE;strokeWidth=1.5;dashed=1;dashPattern=6 4;verticalAlign=top;align=left;spacingLeft=12;spacingTop=6;fontSize=12;fontStyle=1;fontColor=#2C5DA8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1640\&quot; y=\&quot;480\&quot; width=\&quot;450\&quot; height=\&quot;300\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;gw2\&quot; value=\&quot;&amp;lt;b&amp;gt;llm-gateway&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;Единственный компонент, который вообще знает о переходе. Смена провайдера — правка config.yaml, кода бизнес-логики не касается&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#438DD5;strokeColor=#3C7FC0;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1670\&quot; y=\&quot;540\&quot; width=\&quot;390\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;cfgnote\&quot; value=\&quot;Подтверждение ADR-002: шлюз обязан держать минимум двух провайдеров с автопереключением при сбое основного.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#E4F5EC;strokeColor=#1B8F5E;strokeWidth=1.5;fontSize=11;fontColor=#0E4F32;align=left;verticalAlign=top;spacingLeft=8;spacingTop=6;spacingRight=8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1670\&quot; y=\&quot;695\&quot; width=\&quot;390\&quot; height=\&quot;72\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;saas\&quot; value=\&quot;&amp;lt;b&amp;gt;LLM Provider (SaaS)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[GigaChat Pro]&amp;lt;br&amp;gt;&amp;lt;font style=&amp;#x27;font-size:10px&amp;#x27;&amp;gt;Остаётся как fallback — кроме случая перехода по триггеру №1, где внешний вызов запрещён полностью&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#999999;strokeColor=#8A8A8A;fontColor=#FFFFFF;fontSize=11;verticalAlign=top;spacingTop=5;spacingLeft=4;spacingRight=4;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1740\&quot; y=\&quot;970\&quot; width=\&quot;380\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;open\&quot; value=\&quot;ОТКРЫТО и обязательно до фактического перехода (раздел 26, пункт «Подтверждение»):\n• Расчёт стоимости владения — CAPEX оборудования + ежемесячный OPEX — должен быть выполнен ЗАРАНЕЕ, до наступления триггера, иначе переход всё равно окажется незапланированным. Сметы в проекте до сих пор нет (P0 №1, раздел 27).\n• Экономический порог проверить расчётом по разделу 28.4 и сверить с порогом 50 млн токенов; при расхождении — обновить сам триггер в ADR-002, а не игнорировать.\n• Резервный self-hosted контур нужно держать в тестовом режиме ЗАРАНЕЕ: триггер №1 может наступить резко, и миграция в моменте нарушит непрерывность сервиса.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FBF0DC;strokeColor=#A66A12;strokeWidth=1.5;fontSize=11;fontColor=#5C3A02;align=left;verticalAlign=top;spacingLeft=8;spacingTop=6;spacingRight=8;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;70\&quot; y=\&quot;970\&quot; width=\&quot;1620\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;g1\&quot; value=\&quot;Основной трафик после перехода&amp;lt;br&amp;gt;[OpenAI-совместимый API]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;exitX=0;exitY=0.4;entryX=1;entryY=0.4;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;gw2\&quot; target=\&quot;vllm\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1630\&quot; y=\&quot;596\&quot;/&gt;&lt;mxPoint x=\&quot;1630\&quot; y=\&quot;600\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;g2\&quot; value=\&quot;Fallback [External API]\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;dashed=1;exitX=0.5;exitY=1;entryX=0.5;entryY=0;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;gw2\&quot; target=\&quot;saas\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;g3\&quot; value=\&quot;Без изменений\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;strokeColor=#707070;strokeWidth=2;fontSize=11;fontColor=#333333;labelBackgroundColor=#FFFFFF;dashed=1;exitX=0;exitY=0.75;entryX=1;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;gw2\&quot; target=\&quot;emb2\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1620\&quot; y=\&quot;645\&quot;/&gt;&lt;mxPoint x=\&quot;1620\&quot; y=\&quot;575\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;&quot;}"></div>
