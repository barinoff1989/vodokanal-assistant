00. Биллинг, ЛК, микросервис обращений, диспетчерская и файловое хранилище БЗ физически внутри закрытой сети водоканала — снаружи недоступны ни на разработке, ни на демо.\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=top;whiteSpace=wrap;fontSize=11;fontColor=#5A6B7B;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;100\&quot; y=\&quot;58\&quot; width=\&quot;2000\&quot; height=\&quot;44\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;person\&quot; value=\&quot;&amp;lt;b&amp;gt;Абонент&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Персона]&amp;lt;br&amp;gt;Браузер ЛК\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#16324F;strokeColor=#0E2233;fontColor=#FFFFFF;fontSize=12;align=center;verticalAlign=middle;spacing=6;shadow=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;140\&quot; y=\&quot;120\&quot; width=\&quot;260\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;llmprov\&quot; value=\&quot;&amp;lt;b&amp;gt;LLM Provider&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Внешний SaaS]&amp;lt;br&amp;gt;GigaChat Pro — управляемый API на территории РФ (152-ФЗ)\&quot; style=\&quot;rounded=1;arcSize=12;whiteSpace=wrap;html=1;fillColor=#8A9BA8;strokeColor=#5F7182;fontColor=#FFFFFF;fontSize=11;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2260\&quot; y=\&quot;120\&quot; width=\&quot;420\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;k8s\&quot; value=\&quot;Kubernetes (k8s) — общий кластер, где работает личный кабинет (эксплуатирует тот же отдел; GPU-узлов нет) · Helm-релизы, RBAC, NetworkPolicy\&quot; style=\&quot;rounded=1;arcSize=2;whiteSpace=wrap;html=1;fillColor=#F4F8FC;strokeColor=#2E6DA4;strokeWidth=2;align=left;verticalAlign=top;spacingTop=10;spacingLeft=14;f ingTop=6;spacingLeft=10;fontSize=11;fontStyle=1;fontColor=#3A6EA5;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;120\&quot; y=\&quot;550\&quot; width=\&quot;1880\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;widget\&quot; value=\&quot;&amp;lt;b&amp;gt;ai-widget&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, 2 реплики]&amp;lt;br&amp;gt;Статика React + Node-SSR, встраивается в ЛК\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;140\&quot; y=\&quot;560\&quot; width=\&quot;280\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;backend\&quot; value=\&quot;&amp;lt;b&amp;gt;backend&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, 2 реплики на MVP (3 на тираже) + HPA]&amp;lt;br&amp;gt;API Gateway / Backend: retrieval, routing, SSE-стрим. PodDisruptionBudget: minAvailable 1\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;764\&quot; y=\&quot;560\&quot; width=\&quot;280\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;llmgw\&quot; value=\&quot;&amp;lt;b&amp;gt;llm-gateway&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, 2 реплики + HPA]&amp;lt;br&amp;gt;PII Sanitizer, Guardrails, Quota Manager. Секреты провайдера — из Kubernetes Secret\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1076\&quot; y=\&quot;560\&quot; width=\&quot;280\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;orch\&quot; value=\&quot;&amp;lt;b&amp;gt;agent-orchestrator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, 2 реплики + HPA]&amp;lt;br&amp;gt;FSM, tool-calling, HITL-гейты\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1388\&quot; y=\&quot;560\&quot; width=\&quot;280\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;stage2\&quot; value=\&quot;&amp;lt;b&amp;gt;billing-adapter · inquiry-service · doc-generator&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, Этап 2 — разворачиваются на MVP после stage-gating, ADR-600]\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2F80C3;strokeColor=#1F5C8B;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1700\&quot; y=\&quot;560\&quot; width=\&quot;280\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ns_gpu\&quot; value=\&quot;namespace: inference — node pool: general (CPU) · базовый вариант без GPU. GPU-узел (taint nvidia.com/gpu-present, nodeSelector pool=gpu) — только по решению владельца после проверки на реальных данных\&quot; style=\&quot;rounded=1;arcSize=2;whiteSpace=wrap;html=1;fillColor=#FFF9EC;fillOpacity=60;strokeColor=#D9A400;dashed=1;align=left;verticalAlign=top;spacingTop=6;spacingLeft=10;fontSize=11;fontStyle=1;fontColor=#A67C00;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;120\&quot; y=\&quot;780\&quot; width=\&quot;1880\&quot; height=\&quot;280\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;embinf\&quot; value=\&quot;&amp;lt;b&amp;gt;embedding-inference&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Deployment, CPU, 2 реплики]&amp;lt;br&amp;gt;e5-small на CPU: 36–37 мс на запрос (замер) — общий сервис для Backend и ETL. BGE-M3 на GPU — только при GPU-узле\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#2E75B6;strokeColor=#1F4E79;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;140\&quot; y=\&quot;800\&quot; width=\&quot;320\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rerinf\&quot; value=\&quot;&amp;lt;b&amp;gt;reranker-inference&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[не разворачивается на MVP: выключен]&amp;lt;br&amp;gt;BGE-reranker-v2-m3: на CPU 7,2 с (замер) — включается только при GPU-узле\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#F3F5F7;strokeColor=#8A96A3;dashed=1;fontColor=#5A6B7B;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;520\&quot; y=\&quot;800\&quot; width=\&quot;320\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;etl\&quot; value=\&quot;&amp;lt;b&amp;gt;CronJob: etl-index&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[Kubernetes CronJob, 0 2 * * *]&amp;lt;br&amp;gt;Окно 02:00–05:00, activeDeadlineSeconds = 10800, concurrencyPolicy: Forbid. Эмбеддинги — на CPU\&quot; style=\&quot;rounded=1;arcSize=10;whiteSpace=wrap;html=1;fillColor=#27AE60;strokeColor=#1B7A43;fontColor=#FFFFFF;fontSize=10;align=center;verticalAlign=middle;spacing=6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;900\&quot; y=\&quot;800\&quot; width=\&quot;320\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note_f7\&quot; value=\&quot;&amp;lt;b&amp;gt;РЕШЕНИЕ&amp;lt;/b&amp;gt; — окно обслуживания (нагрузка индексации не мешает онлайн-поиску): забор документов 4 ч + полный реиндекс. Окно 02:00–05:00, activeDeadlineSeconds = 10800 — жёсткая граница. Не успели — job прерывается, курсор и контрольные суммы в Sync State, продолжение в следующем окне. Индекс не повреждается: alias переключается blue-green только после полного успеха. Delta-индексация днём — малыми порциями, нагрузка на CPU низкая. Контроль: Saturation по workload = etl-worker. Полная изоляция невозможна: свежие документы попадают в индекс с задержкой до окна. Пересмотр — если объём перестанет укладываться в окно (тогда отдельный пул индексации или GPU-узел).\&quot; style=\&quot;rounded=1;arcSize=6;whiteSpace=wrap;html=1;fillColor=#FDF6E7;strokeColor=#D9A400;strokeWidth=1;fontColor=#7A5C00;fontSize=9;align=left;verticalAlign=top;spacing=10;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1660\&quot; y=\&quot;790\&quot; width=\&quot;320\&quot; height=\&quot;260\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ns_data\&quot; value=\&quot;namespace: ai-data — node pool: data (CPU + локальные NVMe), PersistentVolume на каждом StatefulSet\&quot; style=\&quot;rounded=1;arcSize=2;whiteSpace=wrap;html=1;fillColor=#FFFFFF;fillOpacity=0;strokeColor=#9BB8D3;dashed=1;align=left;verticalAlign=top;spacingTop=6;spacingLeft=10;fontSize=11;fontStyle=1;fontColor=#3A6EA5;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;120\&quot; y=\&quot;1140\&quot; width=\&quot;1880\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot; /&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;qdrant\&quot; value=\&quot;&amp;lt;b&amp;gt;qdrant&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;[StatefulSet, PVC: NVMe]&amp;lt;br&amp;gt;HNSW m=16 / ef=128, blue-green alias при реиндексе\&quot; style=\&quot;shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=14;fillColor=#2F80C3;strokeColor=#1F5C8B
