# Локальные слепки внешних систем и инфраструктура прототипа.
#
# Реальные Биллинг, Личный кабинет, БД обращений, БД ЛКК и файловое хранилище
# базы знаний находятся внутри закрытой сети водоканала: доступа к ним нет ни
# на разработке, ни на демонстрации. Здесь поднимаются локальные заменители,
# наполняемые синтетикой (код-шаг 0).
#
# Сервисы добавляются ПО ШАГАМ плана разработки, а не все сразу: на машине
# 15 ГБ памяти, и держать поднятым то, что понадобится через неделю, незачем.
#   шаг 0  : postgres          — слепки трёх систем
#   шаг 4  : redis             — квоты и состояние сессии
#   шаг 5  : qdrant, minio     — векторный поиск и хранилище документов
#   шаг 10 : prometheus, clickhouse — наблюдаемость и телеметрия
# Заготовки для будущих шагов лежат ниже закомментированными, чтобы порядок
# и имена не пришлось выдумывать заново.

services:
  # --- Шаг 0: три базы в одном экземпляре ------------------------------------
  # Три отдельные базы, а не три контейнера: в реальности это три независимые
  # системы, и разделение по базам сохраняет это разграничение, не требуя
  # трёх процессов на машине разработчика.
  #   billing_stub   — лицевые счета, начисления, счётчики и поверки
  #   lk_stub        — профиль абонента личного кабинета
  #   inquiries_stub — обращения абонентов с текстами
  postgres:
    image: postgres:16-alpine
    container_name: vk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vodokanal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vodokanal_local}
      POSTGRES_DB: ${POSTGRES_DB:-billing_stub}
      # Русские тексты обращений — единственная причина явной локали:
      # без неё сортировка и сравнение строк ведут себя не как в оригинале.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипты создания схем и загрузки синтетики. Каталог намеренно пуст:
      # структуры таблиц строятся по CSV-примерам от владельцев систем, а до
      # их получения любая схема была бы гипотезой (см. Data_Request.md).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vodokanal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Шаг 4: лимиты и состояние сессии --------------------------------------
  # Хранит счётчики квот (на абонента, на сессию, на сервис) и состояние
  # диалога. Данные намеренно не сохраняются на диск: на прототипе это
  # рабочая память, а не источник истины, и терять её при перезапуске не жалко.
  # На MVP появится сохранение — состояние сессии там переживает перезапуск.
  redis:
    image: redis:7-alpine
    container_name: vk-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Шаг 5 -----------------------------------------------------------------
  # Векторное хранилище. Вне контейнерного стека — опционально (по умолчанию
  # поиск работает в памяти процесса, app/kb/search.py, InMemoryVectorStore).
  # Внутри этого файла — обычная (не опциональная) зависимость backend и
  # reindex: раз оркестрация уже поднимает Compose-стек целиком, используется
  # настоящий Qdrant, а не InMemoryVectorStore (см. VECTOR_STORE в backend/
  # reindex ниже — переопределён на qdrant, дефолт "memory" остаётся верным
  # только для хостового запуска вне Compose).
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vk-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # minio:
  #   image: minio/minio:latest
  #   container_name: vk-minio
  #   command: server /data --console-address ":9001"
  #   ports: ["9000:9000", "9001:9001"]
  #   volumes: [minio_data:/data]

  # --- Backend -----------------------------------------------------------
  # Одноразовое наполнение Qdrant перед стартом backend — тот же приём, что
  # `scripts/reindex_kb.py` на хосте (Backend сам не пересчитывает эмбеддинги
  # при своём старте, reindex_kb.py — отдельный прогон), только теперь прогон
  # автоматический, часть подъёма стека, а не ручная команда разработчика.
  # exit code 0 при пустом или уже наполненном корпусе, поэтому безопасно
  # выполнять при каждом `docker compose up`.
  reindex:
    build: .
    container_name: vk-reindex
    restart: "no"
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-kb_faq}
    command: ["python", "scripts/reindex_kb.py"]

  # Backend читает переменные окружения ХОСТА через подстановку ${VAR} —
  # Compose делает это сама при `docker compose up`, никакого файла .env для
  # этого заводить не нужно (см. env.example.sh — справочник команд export,
  # не файл для авточтения).
  backend:
    build: .
    container_name: vk-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      reindex:
        condition: service_completed_successfully
    environment:
      # Имена сервисов Compose вместо localhost — единственное, что отличает
      # контейнерный запуск от хостового; дефолты в app/config.py не тронуты.
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-kb_faq}
      VECTOR_STORE: qdrant
      # Ollama не контейнеризирована, остаётся сервисом хоста — из контейнера
      # доступна по host.docker.internal, не localhost (Docker Desktop
      # добавляет этот алиас автоматически на Windows/Mac).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Секреты и остальная конфигурация — из настоящих переменных окружения
      # хоста (export/setx), не из файла.
      APP_ENV: ${APP_ENV:-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-local-test}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_API_BASE: ${YANDEX_API_BASE:-https://llm.api.cloud.yandex.net/v1}
      YANDEX_MODEL_URI: ${YANDEX_MODEL_URI:-}
      GIGACHAT_CLIENT_ID: ${GIGACHAT_CLIENT_ID:-}
      GIGACHAT_CLIENT_SECRET: ${GIGACHAT_CLIENT_SECRET:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_CORP}
    ports:
      - "8000:8000"
    volumes:
      # Live-reload при разработке — без пересборки образа на каждую правку.
      - ./app:/app/app
      - ./web:/app/web
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--reload"]

  # --- Шаг 10 ----------------------------------------------------------------
  # prometheus, clickhouse — добавляются вместе с метриками кода

volumes:
  pgdata:
  qdrant_data:
  # minio_data:
