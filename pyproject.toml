[project]
name = "vodokanal-assistant"
version = "0.0.1"
description = "AI-помощник абонента водоканала — прототип"
requires-python = ">=3.12,<3.13"

# Зависимости добавляются по шагам плана разработки (Dev_Plan.html, раздел 2.2).
# На шаге 0.5 нужен минимум: шлюз к моделям и настройки из окружения.
dependencies = [
    "litellm",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

# Ставится на шаге 0 — генератор синтетических данных.
data = [
    "faker",
    "pandas",
    "python-docx",
]

# Ставится на шаге 3 — слой защиты персональных данных.
# ВАЖНО: русская модель spaCy сюда не входит, она ставится отдельной командой:
#     python -m spacy download ru_core_news_md
# Через зависимости её тянуть нельзя — это не пакет с PyPI, а артефакт релиза.
pii = [
    "presidio-analyzer",
    "presidio-anonymizer",
]

# Ставится на шаге 4 — шлюз к модели: счётчики лимитов и состояние сессии.
gateway = [
    "redis",
    "slowapi",
]

# Ставится на шаге 8 — HTTP-интерфейс и демо-стенд.
api = [
    "fastapi",
    "uvicorn",
    "sse-starlette",
]

# Ставится на шаге 10 — наблюдаемость.
observability = [
    "prometheus-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Корень репозитория в sys.path: тесты запускаются без editable-установки.
# Без этого голый `pytest` падал на импорте `app`, а работал только `python -m pytest`.
pythonpath = ["."]
# Живые тесты исключены из обычного прогона: без Ollama они бы падали, а не пропускались.
# Запуск явно: pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: требует запущенной Ollama и загруженной модели; в обычном прогоне пропускается",
    "slow: требует загрузки языковой модели spaCy (несколько секунд)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
