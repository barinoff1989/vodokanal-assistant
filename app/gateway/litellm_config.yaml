# Конфигурация LiteLLM — список доступных моделей.
#
# Это и есть точка, ради которой в ADR-002 выбран вариант с единым шлюзом:
# переход между провайдерами выполняется правкой LLM_PROVIDER в .env,
# код шлюза и всей остальной системы при этом не меняется.
#
# ВАЖНО: зарубежные провайдеры общего назначения сюда не добавляются ни при
# каких условиях — абонент физическое лицо, передача его персональных данных
# за периметр РФ нарушает 152-ФЗ (ADR-002). Если доступ к GigaChat задерживается,
# работа идёт на local-test, а не на зарубежном API.

model_list:
  # --- Локальная тестовая модель (шаг 0.5) ------------------------------------
  # Не отвечает абонентам. Нужна для офлайн-проверок промптов, Security Layer
  # и нагрузочных прогонов без расхода платных токенов.
  - model_name: local-test
    litellm_params:
      model: ollama_chat/qwen2.5:7b-instruct-q4_K_M
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 120

  # --- GigaChat Pro (шаг 4) ---------------------------------------------------
  # Основной провайдер генерации на MVP. Требует корневых сертификатов
  # НУЦ Минцифры — без них вызов падает на проверке TLS.
  - model_name: gigachat
    litellm_params:
      model: gigachat/GigaChat-Pro
      client_id: os.environ/GIGACHAT_CLIENT_ID
      client_secret: os.environ/GIGACHAT_CLIENT_SECRET
      scope: os.environ/GIGACHAT_SCOPE
      timeout: 60

# Автоматическое переключение при сбое основного провайдера — требование
# ADR-002, «Подтверждение», п. 1: шлюз должен поддерживать минимум двух
# провайдеров с fallback. На прототипе вторым выступает локальная модель;
# на MVP в проде её место занимает YandexGPT (контекст, раздел 44.5).
router_settings:
  fallbacks:
    - gigachat: ["local-test"]
  num_retries: 2
  timeout: 60

litellm_settings:
  # Промпты не логируются: тот же кодовый путь используется с внешним
  # провайдером, а логирование сырых ПДн запрещено правилом 4.2.
  turn_off_message_logging: true
  drop_params: true
