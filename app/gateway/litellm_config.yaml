# Конфигурация LiteLLM — список доступных моделей.
#
# Это и есть точка, ради которой в ADR-200 выбран вариант с единым шлюзом:
# переход между провайдерами выполняется правкой переменной окружения
# LLM_PROVIDER, код шлюза и всей остальной системы при этом не меняется.
#
# ВАЖНО: зарубежные провайдеры общего назначения сюда не добавляются ни при
# каких условиях — абонент физическое лицо, передача его персональных данных
# за периметр РФ нарушает 152-ФЗ (ADR-200).
#
# РАСПРЕДЕЛЕНИЕ ПО КОНТУРАМ (решение от 1 сентября 2026):
#   Прототип : генерация — YandexGPT; второй backend и судья — local-test.
#              GigaChat недоступен: он требует корневых сертификатов НУЦ
#              Минцифры, которых на машине прототипа не будет.
#   MVP      : генерация — GigaChat Pro; судья — YandexGPT (ADR-300).
# Оба провайдера описаны здесь одновременно; какой активен — решает LLM_PROVIDER.
#
# Файл читает `app/gateway/model_router.py`: из него строится маршрутизатор LiteLLM
# (`Router`) внутри процесса шлюза — отдельного прокси-сервера нет. Формат совместим с
# прокси: если его когда-нибудь введут, файл заработает без правок.
#
# Значения берутся из app/config.py и переменных окружения, чтобы расхождение не завелось
# в третьем месте.

model_list:
  # --- Локальная тестовая модель ------------------------------------
  # Не отвечает абонентам. Нужна для офлайн-проверок промптов, Security Layer
  # и нагрузочных прогонов без расхода платных токенов. На прототипе она же —
  # судья качества (ADR-300: судья не должен совпадать с отвечающей моделью).
  - model_name: local-test
    litellm_params:
      model: ollama_chat/qwen2.5:7b-instruct-q4_K_M
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 120

  # --- YandexGPT (генерация на прототипе) ------------------------------
  # Штатного провайдера `yandex` в LiteLLM нет (проверено на версии 1.99.0:
  # в списке из 152 провайдеров отсутствует), поэтому подключение идёт через
  # OpenAI-совместимый режим с явным адресом.
  #
  # [ТРЕБУЕТ ПОДТВЕРЖДЕНИЯ] Точный вид имени модели, адреса и способа
  # авторизации сверить с документацией Yandex Cloud, а не принимать отсюда на
  # веру: значения ниже — ожидаемая форма, не подтверждённый факт.
  #
  # ВНИМАНИЕ: LiteLLM подставляет `os.environ/` только ЦЕЛЫМ значением, а не
  # внутри строки. Проверено на версии 1.99.0: `gpt://os.environ/FOLDER/...`
  # разворачивается в None. Поэтому имя модели целиком выносится в одну
  # переменную YANDEX_MODEL_URI, а не собирается здесь из кусков.
  - model_name: yandexgpt
    litellm_params:
      model: os.environ/YANDEX_MODEL_URI
      api_base: os.environ/YANDEX_API_BASE
      api_key: os.environ/YANDEX_API_KEY
      timeout: 60

  # --- GigaChat Pro (MVP, не прототип) ----------------------------------------
  # Поддерживается LiteLLM штатно (провайдер `gigachat` есть в списке).
  # Требует корневых сертификатов НУЦ Минцифры — без них вызов падает на
  # проверке TLS. Именно поэтому на прототипе не используется.
  - model_name: gigachat
    litellm_params:
      model: gigachat/GigaChat-Pro
      client_id: os.environ/GIGACHAT_CLIENT_ID
      client_secret: os.environ/GIGACHAT_CLIENT_SECRET
      scope: os.environ/GIGACHAT_SCOPE
      timeout: 60

# Автоматическое переключение при сбое основного провайдера — требование
# ADR-200: шлюз должен поддерживать минимум двух
# провайдеров с fallback.
#   Прототип : yandexgpt -> local-test
#   MVP      : gigachat  -> yandexgpt
# Обе цепочки описаны сразу, чтобы переход MVP не потребовал правки структуры.
router_settings:
  fallbacks:
    - yandexgpt: ["local-test"]
    - gigachat: ["yandexgpt"]
  num_retries: 2
  timeout: 60

litellm_settings:
  # Промпты не логируются: тот же кодовый путь используется с внешним
  # провайдером, а логирование сырых ПДн запрещено правилом защиты ПДн.
  turn_off_message_logging: true
  drop_params: true
